"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_fx_custom.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To open the Pad FX page, press the <strong>PAD FX</strong> mode button.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_fx_custom_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_fx_custom_2.png\" data-full-width=\"327\" data-full-height=\"251\" /></span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To trigger Pad FX, press <strong>PADS 1–16</strong>, corresponding to the effect you would like to trigger. The more pressure you apply to the pad, the more the effect is applied to the audio signal. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">You can use up to four effects at the same time. If additional effects are triggered, previously engaged effects are bypassed, starting with the first effect engaged. When the additional effects after the fourth are turned off, the bypassed effects will re-engage.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To adjust Pad FX parameters, turn the <strong>K1–3 </strong>Knobs. See the list below for the available parameters for all effects. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>B1 </strong>Function Button to <strong>Latch</strong> an effect at the current amount. Select the pad and press this button again to disable Latch.</span></div>\n<div class=\"p de_6AF6DD6F29\"><table class=\"de_tbl_678 detbl\">\n<col class=\"de_col_1_42\" />\n<col class=\"de_col_2_96\" />\n<col class=\"de_col_3_252\" />\n<col class=\"de_col_4_108\" />\n<col class=\"de_col_5_180\" />\n<tr>\n<td class=\"de_td_42\" style = \"padding: 2px; border-left-style: none; border-le yle = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: none; border-bottom-width: 1px; border-bottom-color: #000000;  width: 108px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">K1 – Pre-Delay</span></div>\n</td><td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: none; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">0–250 ms</span></div>\n</td></tr><tr>\n<td class=\"de_td_40\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: none; border-bottom-width: 1px; border-bottom-color: #000000;  width: 40px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n\n</td><td class=\"de_td_98\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: none; border-bottom-width: 1px; border-bottom-color: #000000;  width: 98px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n\n</td><td class=\"de_td_108\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: none; border-bottom-width: 1px; border-bottom-color: #000000;  width: 108px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">K2 – Decay </span></div>\n</td><td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: none; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">0–100%</span></div>\n</td></tr><tr>\n<td class=\"de_td_40\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 40px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n\n</td><td class=\"de_td_98\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 98px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n\n</td><td class=\"de_td_108\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 108px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">K3 – Diffusion </span></div>\n</td><td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">0–100%</span></div>\n</td></tr></table></div>\n\n\n\n\n</div>", "flex_beat": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Flex Beat</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Similar to Pad FX, the pads are used to trigger effects in MPC Sample’s Flex Beat mode, but these are time-based effects that warp the pitch, time, and volume of your sequence for beat chops, DJ-style scratches, and trance gate effects.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_flex_beat_custom.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_flex_beat_custom_2.png\"/></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To open the Flex Beat page, press and hold <strong>SHIFT</strong> and press the <strong>PAD FX / FLEX BEAT</strong> button.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_flex_beat_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_flex_beat_custom_3.png\" data-full-width=\"329\" data-full-height=\"248\" /></span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Flex Beat effects are applied to your entire sequence during playback. Press the <strong>PLAY</strong> button to play your sequence before using Flex Beat.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">By default, <strong>PAD 1</strong> is active when Flex Beat is entered. This is an <strong>EMPTY</strong> effect and is the baseline of no change to your audio.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To apply a Flex Beat effect, press <strong>PADS 2–16</strong>. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B3 Function Button</strong> to activate or deactivate <strong>Quantize</strong> for Flex Beat. When activated, Flex Beat effects are applied starting at the nearest time division. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1</strong> Knob to change the Flex Beat mode from <strong>One Shot</strong> to <strong>Loop</strong>. In One Shot mode, when a Flex Beat effect is triggered, it automatically returns to the Empty effect (<strong>PAD 1</strong>) after completion. In Loop mode, each Flex Beat effect will continue to repeat until another effect is selected or the Empty slot is selected.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>K3</strong> Knob to adjust the dry/wet <strong>Mix</strong> of the Flex Beat effect (<strong>0</strong> – <strong>100%</strong>). When set to 0%, only the original audio is heard. When set to 100%, the original audio is not heard, and only the Flex Beat affected audio is heard. </span></div>\n\n\n</div>", "knob_fx": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Knob FX</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">MPC Sample’s Knob FX allows you to use the <strong>K1–3 KNOBS</strong> to control a single effect parameter, freeing your pads for other uses, such as triggering samples or sequences, or even in conjunction with the pads in Pad FX or Flex Beat modes. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_knob_fx_custom.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To engage the Knob FX controls, press the <strong>KNOB FX</strong> button. Once enabled, the <strong>KNOB FX</strong> button lights up, and the current effect is briefly shown on the display. </span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_knob_fx_custom_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_knob_fx_custom_2.png\" data-full-width=\"332\" data-full-height=\"251\" /> <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_knob_fx_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_knob_fx_custom_3.png\" data-full-width=\"329\" data-full-height=\"255\" /></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">The bottom of the display will show the parameters available for control using the <strong>K1–K3</strong> Knobs. If the Shift indicator is shown, you can press and hold SHIFT to access additional parameters for control using the <strong>K1–K3</strong> Knobs. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">While Knob FX is engaged, you are unable to use the <strong>K1–3 KNOBS</strong> for other functions, such as adjusting the Start/End points in Sample Mode or adjusting Pad FX parameters.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To disengage Knob FX mode, press the <strong>KNOB FX</strong> button again. </span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_knob_fx_custom_4.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_knob_fx_custom.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To adjust the Knob FX settings, press and hold <strong>SHIFT</strong> and press the <strong>KNOB FX</strong> button. </span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_knob_fx_custom_5.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_knob_fx_custom_5.png\" data-full-width=\"327\" data-full-height=\"249\" /></span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Knob FX can be applied to specific pads, or to all pads. Press a pad to enable Knob FX for that pad. Enabled pads are brightly lit, while pads unaffected by Knob FX are dimly lit.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>B2 </strong>Function Button to enable Knob FX on <strong>All Pads</strong> at the same time. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>B3 </strong>Function Button to <strong>Bypass</strong> Knob FX on all affected pads. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To select an effect for Knob FX, turn the <strong>ENCODER</strong> or press the <strong>-/+</strong> buttons to browse the list of effects, and then ne; border-bottom-width: 1px; border-bottom-color: #000000;  width: 198px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">10 – 100%</span></div>\n</td></tr><tr>\n<td class=\"de_td_114\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 114px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">K3 – Pitch</span></div>\n</td><td class=\"de_td_198\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: none; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 198px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">20 – 100%</span></div>\n</td></tr></table></div>\n\n\n</div>", "compressor": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Compressor</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">The dedicated Compressor effect can be used to change the dynamic range of your signal by automatically reducing its gain if it exceeds a certain level. This is primarily a “pumping” compressor, designed to apply sharp ducking, but can also be used for more subtle peak-limiting. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_compressor_custom.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_compressor_custom_2.png\"/></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To open the Compressor page, press and hold <strong>SHIFT</strong> and press <strong>PAD 5 – COMPRESSOR</strong>. </span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_compressor_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_compressor_custom_3.png\" data-full-width=\"328\" data-full-height=\"249\" /></span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B1 Function Button</strong> to activate or deactivate the <strong>Color</strong> effect for the compressor. This applies a slight parallel bass boost when activated, as well as minor pitch instability and harmonic saturation for a classic “tape warmth” effect.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B3 Function Button</strong> to <strong>Bypass</strong> or engage the compressor effect. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1</strong> Knob to adjust the <strong>Attack</strong> phase of the compressor (<strong>0.100</strong> – <strong>150 ms</strong>). This determines how much time it takes to start applying compression and reducing the incoming signal gain after the audio signal passes above the threshold. High settings may allow some signal peaks to bypass the compressor. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>K2</strong> Knob to adjust the <strong>Release</strong> phase of the compressor (<strong>3.0</strong> – <strong>300 ms</strong>). This determines how much time it takes for the compressor to stop applying compression after the audio signal passes below the threshold.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>K3</strong> Knob to adjust the compressor <strong>Amount</strong> (<strong>0.00</strong> – <strong>100.00%</strong>). This determines how much compression is applied, and combines the threshold and ratio parameters of traditional compressor effects. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and turn the <strong>K3</strong> Knob to adjust the amount of <strong>In Boost</strong> applied. This increase the incoming volume to the compressor, allowing it to work more aggressively.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\"><strong>Note:</strong> The traditional makeup gain compressor parameter is automatically calculated based on input level and overall parameter settings.</span></div>\n</td></tr></table></div>\n\n\n</div>", "menus": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Menus</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">This chapter describes additional menus in MPC Sample that are used for device configuration, file management, and more. </span></div>\n\n</div>", "input_configuration": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Input Configuration</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">The Input Configuration menu allows you to select and adjust your audio input sources for sampling. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_input_configuration_custom.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_input_configuration_custom_2.png\"/></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To enter the Input Configuration menu, press and hold <strong>SHIFT</strong> and press the <strong>SAMPLE</strong> button.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_input_configuration_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_input_configuration_custom_3.png\" data-full-width=\"325\" data-full-height=\"246\" /></span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>Source: </strong></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-0;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Mic:</strong> The built-in microphone, located next to the <strong>ENCODER</strong>.</span></div>\n</li><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Rear:</strong> The rear panel <strong>AUDIO IN</strong> connections. Selecting this option enables both the <strong>1/L </strong>and <strong>2/R</strong> inputs to record in stereo.</span></div>\n</li><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Rear L:</strong> The <strong>1/L AUDIO IN</strong> on the rear panel.</span></div>\n</li><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Rear R:</strong> The <strong>2/R AUDIO IN</strong> on the rear panel.</span></div>\n</li><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Resample:</strong> Re-recorded audio from MPC Sample. You can use this to record a sequence onto a single pad, freeing up other pads for additional sounds.</span></div>\n</li><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>USB:</strong> Audio from a device connected to MPC Sample’s rear panel <strong>USB</strong> port. Selecting this option records stereo audio from the USB device.</span></div>\n</li><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>USB L:</strong> Left-channel audio from a device connected to the <strong>USB</strong> port.</span></div>\n</li><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>USB R:</strong> Right-channel audio from a device connected to the <strong>USB</strong> port.</span></div>\n</li></ul>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>Monitor:</strong></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-1;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Off:</strong> Audio from the selected Source is never monitored.</span></div>\n</li><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Auto:</strong> Audio from the selected Source is monitored only while Sample Record Mode is in focus.</span></div>\n</li><li class=\"list-element list-counter-f8ebbd05-9d9c-4163-bfdd-103efde0cf7f-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>On:</strong> Audio from the selected Source is always monitored.</span></div>\n</li></ul>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>Threshold:</strong> This setting determines the minimum audio level (<strong>-96 – 0 dB</strong>) from the selected audio input Source that must be reached to automatically trigger recording. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>Rec Length:</strong> This setting determines the length of your recording. When set to <strong>FREE</strong>, you can record with no set length. When set to <strong>SEQ</strong>, the recording length is locked to the Sequence length. If <strong>SEQ</strong> is selected and playback is active, recording begins at the end of the current loop.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>Rec Input Effects:</strong> This setting determines whether Knob FX triggered during recording are recorded as part of the audio sample (<strong>ON</strong>) or are excluded from the recording (<strong>Off</strong>).</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">All these settings (except <strong>Rec Input Effects</strong>) can also be adjusted in the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sample_record_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sample Record Mode</strong></span></a><span class=\"de_CC7DAF531E\">. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To close the Input Configuration menu, press the <strong>B3 </strong>Function Button to move back to the previous page.</span></div>\n\n\n</div>", "fader": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Fader</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">The Fader menu allows you to select the current parameter controlled by the Fader.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_fader_custom.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_fader_custom_2.png\"/></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To open the <strong>FADER</strong> menu, press and hold <strong>SHIFT</strong> and press <strong>PAD 9 – FADER</strong>.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_fader_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_fader_custom_3.png\" data-full-width=\"328\" data-full-height=\"250\" /></span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B3</strong> Function Button to turn the Fader control on or off. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> to browse the following Fader functions, and then press it to select.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-f32745b3-633f-4324-aefd-8f24bc427e4c-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-f32745b3-633f-4324-aefd-8f24bc427e4c-0;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Pad Volume:</strong> Adjust the volume level of the selected pad.</span></div>\n</li><li class=\"list-element list-counter-f32745b3-633f-4324-aefd-8f24bc427e4c-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Pad Pan:</strong> Adjust the stereo panning of the selected pad.</span></div>\n</li><li class=\"list-element list-counter-f32745b3-633f-4324-aefd-8f24bc427e4c-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Pad Tune:</strong> Adjust the Semi Tune value of the selected pad.</span></div>\n</li><li class=\"list-element list-counter-f32745b3-633f-4324-aefd-8f24bc427e4c-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Pad Amp Attack:</strong> Adjust the Attack value of the Amplitude Envelope for the selected pad.</span></div>\n</li><li class=\"list-element list-counter-f32745b3-633f-4324-aefd-8f24bc427e4c-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Pad Amp Decay/Release:</strong> Adjust the Decay or Release value of the Amplitude Envelope for the selected pad. This controls Decay if the pad is set to One Shot playback, and controls Release if the pad is set to Note On playback.</span></div>\n</li><li class=\"list-element list-counter-f32745b3-633f-4324-aefd-8f24bc427e4c-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Pad Filter Cutoff:</strong> Adjust the Cutoff value of the Filter for the selected pad.</span></div>\n</li><li class=\"list-element list-counter-f32745b3-633f-4324-aefd-8f24bc427e4c-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Kit Volume:</strong> Adjust the volume of the entire kit.</span></div>\n</li></ul>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Similar to the <strong>K1–K3</strong> Knobs, the <strong>FADER</strong> has absolute position only and uses soft takeover when switching between controls. This means that as you are moving between different controls, the fader’s position may not align with the current setting of the new parameter.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">The brightness of the <strong>Fader LED</strong> indicates the relative position of the current parameter value. The brighter the LED, the higher the value (when Pad Pan or Pad Tune are selected, the Fader LED is brightest at the center, and dims at both the top and bottom). Move the fader until the LED begins changing brightness again, indicating the fader has regained control of the current parameter value.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B1</strong> Function Button to move back to the previous page.</span></div>\n\n\n</div>", "time_correct": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Time Correct</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">The Time Correct menu contains settings that help quantize the events in your project. This makes your notes snap to a grid at a defined value.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_time_correct_custom.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_time_correct_custom_2.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To open the Time Correct menu, press and hold <strong>SHIFT</strong> and press <strong>PAD 14 – TIME CORRECT</strong>.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_time_correct_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_time_correct_custom_3.png\" data-full-width=\"326\" data-full-height=\"248\" /></span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press a <strong>PAD</strong> to select it for timing correction. Selected pads are highlighted on the display, and the pad lights up while viewing the Time Correct menu. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">You can also press the <strong>B2</strong> Function Button to select all pads at the same time. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1</strong> Knob to adjust the quantization (<strong>Q</strong>) value. This determines the time division that each bar of the sequence is divided into, and how note events snap to those divisions. For example, if the Q is set to 1/16, all events will snap to the nearest 1/16 note on the grid. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K2</strong> Knob to adjust the <strong>Shift</strong> value. This setting adjusts all selected events forward or backward in the sequence by a small amount. This can allow you to create subtle timing variations that give your events a more “humanized” feel.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K3</strong> Knob to adjust the <strong>Swing</strong> value. This setting lets you “shuffle” your beats by shifting the timing of notes so they have a triplet-like feel instead of falling on the downbeat.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To apply the Time Correct settings, press the <strong>B3 </strong>Function Button (<strong>Do It!</strong>). All recorded events for the selected pads are adjusted according to the settings.</span></div>\n<div class=\"p de_6AF6DD6F29\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_026A006CB7\"><span class=\"de_C4517954D8\"><strong>Tips:</strong> Play your sequence before and after applying Time Correct settings to hear the difference. If you aren’t happy with the results, you can undo the settings by holding <strong>SHIFT</strong> and pressing <strong>-/UNDO</strong>. </span></div>\n<div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\">The <strong>Q</strong> and <strong>Swing</strong> values are global and will remain at the settings shown here whether they are applied to recorded events or not. For example, changing the Q value in this menu also changes it in Sequence Mode. For the Swing value, the current setting will also affect how Note Repeat functions. </span></div>\n</td></tr></table></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To exit the Time Correct menu without applying the settings, press the <strong>B1 </strong>Function Button (<strong>Cancel</strong>).</span></div>\n\n\n\n</div>", "midi_configuration": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>MIDI Configuration</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">The MIDI Configuration menu allows you to adjust how MPC Sample sends and receives MIDI and CV data. You can also use this menu to reset MPC Sample’s settings and data.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_midi_configuration_custom.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_midi_configuration_custom_2.png\"/></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press <strong>PAD 8 – MIDI CONFIG</strong> to open the MIDI Configuration menu.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_midi_configuration_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_midi_configuration_custom_3.png\" data-full-width=\"325\" data-full-height=\"248\" /></span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Use the <strong>ENCODER</strong> to scroll through the following options. Press the <strong>ENCODER</strong> to select a setting, and then turn it to adjust the value. Press the <strong>ENCODER</strong> again to confirm.</span></div>\n<div cla top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">MIDI Port</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines the active MIDI port for sending and receiving MIDI data. External refers to the 1/8” <strong>MIDI IN</strong> and <strong>MIDI OUT</strong> ports on the rear panel.</span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">External, USB</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \" ht-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines the MIDI Channel on which MIDI output data is sent.</span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">1–16</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Pad MIDI In</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines whether MIDI Input can be used to trigger the pads.</span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Off, On</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Pad MIDI Out</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines whether MIDI Output is sent from the pads.</span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Never, Always, Empty</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">MIDI Sync In</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines whether MPC Sample receives MIDI Sync information, and what type of information if enabled.</span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Off, Midi Clock, MTC</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">MIDI Sync Out</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines whether MPC Sample sends MIDI Sync information, and what type of information if enabled.</span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Off, Midi Clock, MTC</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">MIDI Thru</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines whether the <strong>MIDI OUT</strong> port also functions as a Thru port. When set to ON, MIDI data received by the <strong>MIDI IN</strong> port is also forwarded through the <strong>MIDI OUT</strong> port. </span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Off, On</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Receive Program Change</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines whether MPC Sample receives MIDI Program Change messages. When enabled, these messages can be used to trigger sequences. </span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Off, Sequence</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">CV/Sync Out</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines whether MPC Sample send CV/Sync output data via the <strong>SYNC OUT</strong> port. </span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Off, On</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">CV/Sync Base</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting determines the base CV clock resolution. A value of 1 is equal to 1 pulse per quarter note.</span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">1–8</span></div>\n</td></tr><tr>\n<td class=\"de_td_180\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 180px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">CV/Sync Division</span></div>\n</td><td class=\"de_td_335\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 335px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">This setting multiplies the CV/Sync Base setting by the given value.</span></div>\n</td><td class=\"de_td_162\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #000000; border-right-style: solid; border-right-width: 1px; border-right-color: #000000; border-top-style: solid; border-top-width: 1px; border-top-color: #000000; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #000000;  width: 162px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">1–24</span></div>\n</td></tr></table></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">The Takeover settings allow you to adjust the hardware control behavior of <strong>Parameter Takeover</strong> and <strong>Knob FX Takeover</strong> for the <strong>K1–K3</strong> Knobs, and <strong>Fader Takeover</strong> for the <strong>FADER</strong>. Each setting can be set to one of the following options:</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-3b7faa44-ae6f-483c-a708-85c5b362eea3-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-3b7faa44-ae6f-483c-a708-85c5b362eea3-0;\">\n<div class=\"p de_FF1EFA3B44\"><span class=\"de_CC7DAF531E\"><strong>Pickup:</strong> Parameters are not editable until the hardware control position matches the parameter position. This is the default behavior for<strong> Fader Takeover</strong>.</span></div>\n</li><li class=\"list-element list-counter-3b7faa44-ae6f-483c-a708-85c5b362eea3-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_FF1EFA3B44\"><span class=\"de_CC7DAF531E\"><strong>Scaled:</strong> Parameters move in the same direction as the hardware control is adjusted. The rate of adjustment is scaled based on the hardware control and parameter position to ensure they eventually meet. This is the default behavior for <strong>Parameter Takeover</strong> and <strong>Knob FX Takeover</strong>.</span></div>\n</li><li class=\"list-element list-counter-3b7faa44-ae6f-483c-a708-85c5b362eea3-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_FF1EFA3B44\"><span class=\"de_CC7DAF531E\"><strong>Instant:</strong> As soon as a hardware control is adjusted, the parameter jumps to match the knob position.</span></div>\n</li></ul>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Select <strong>RESET FACTORY SETTINGS</strong> to reset all settings on MPC Sample to their factory defaults and restart the device. Press the <strong>B3 </strong>Function Button to select <strong>YES</strong> to continue with the reset, or press the <strong>B1 </strong>Function Button to select <strong>NO</strong> to return to the MIDI Config menu.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Select <strong>RESET FACTORY DATA</strong> to delete all internal user content and restart MPC Sample. Press the <strong>B3 Function Button</strong> to select <strong>YES</strong> to continue with the reset, or press the <strong>B1 </strong>Function Button to select <strong>NO</strong> to return to the MIDI Config menu.</span></div>\n<div class=\"p de_6AF6DD6F29\"><table class=\"de-text-block de-text-block-custom-6488f07e-4719-432c-aa40-f80bfbe5fe06\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf06a;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\"><strong>IMPORTANT:</strong> Doing so will remove all user content saved to the internal drive and restore MPC Sample to the factory default content. This includes any content in an unsaved user project, including the current project, and this action cannot be undone. </span></div>\n</td></tr></table></div>\n\n\n\n</div>", "project": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Project</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">The Project menu lets you save and load your projects, as well as manage external microSD card storage. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_project_custom.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_project_custom_2.png\"/></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press <strong>PAD 16 – PROJECT</strong> to open the Project menu. </span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_project_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_project_custom_3.png\" data-full-width=\"325\" data-full-height=\"248\" /></span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Use the <strong>ENCODER</strong> to browse the available options, and then press it to select. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>Load Project</strong></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Select this option to load projects and kits. </span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-9c935a85-776d-4499-9370-3174288f7dfc-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-9c935a85-776d-4499-9370-3174288f7dfc-0;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Demos:</strong> This category includes demo projects, including the default startup project. These projects are great for exploring the range of sounds and styles that you can create with MPC Sample.</span></div>\n</li><li class=\"list-element list-counter-9c935a85-776d-4499-9370-3174288f7dfc-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Kits:</strong> This category includes entire kits. Press the <strong>ENCODER</strong> to load the kit along with four default sequences, or press the <strong>B3</strong> Function Button (<strong>Load Kit</strong>) to only load the kit samples with no sequence data. </span></div>\n</li><li class=\"list-element list-counter-9c935a85-776d-4499-9370-3174288f7dfc-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>User:</strong> This category includes user-saved projects on the internal drive.</span></div>\n</li></ul>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>Save Project</strong></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Select this option to save the current project.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> to scroll through letters and numbers. Press the <strong>ENCODER</strong> to select the desired character and move to the next character.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> to access capital letters.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press the <strong>-/+</strong> buttons to move between characters.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press the <strong>B2</strong> Function Button to erase the current character.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>B2</strong> Function Button to erase all characters at the same time.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">When you have finished editing the project title, press the <strong>B3</strong> Function Button (<strong>Do It!</strong>) to start the export.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To exit the project save page, press the <strong>B1</strong> Function Button (<strong>Cancel</strong>).</span></div>\n\n<div class=\"p de_026A006CB7\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\"><strong>Note:</strong> MPC Sample contains an automatic saving system. As you work on your project, your progress is saved in the background, so if you turn MPC Sample off and on, your project reloads at the last saved state. Saving your project in the Project menu copies the locally stored files to a new location, either internal or external. Because of this system, performing certain actions such as chopping, extracting, or copying on long samples may take a short time.</span></div>\n</td></tr></table></div>\n\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>New Project</strong> </span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Select this option to start a new project. On the page that appears, press the <strong>B3</strong> Function Button to confirm that you want to clear the current project and start a new project. Press the <strong>B1</strong> Function Button to cancel and return to the Project menu.</span></div>\n\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>SD Card Access</strong> </span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Select this option to access a microSD card (not included) inserted into the microSD Card Slot on MPC Sample from a computer connected via USB. This allows you to easily transfer samples, songs, and project files between MPC Sample and your computer.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">The microSD card will mount as an external drive on your computer. You are unable to use other modes while in SD Card Access mode.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">When you have finished transferring files, make sure you safely eject the microSD card drive from your computer before exiting SD Card Access mode.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Once the drive is ejected, press the <strong>B1</strong> Function Button to exit SD Card Access mode.</span></div>\n\n</div>", "technical_specifications": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Technical Specifications</h1></div></div>\n<div class=\"p de_6AF6DD6F29\"><table class=\"de_tbl_677 detbl\">\n<col class=\"de_col_1_227\" />\n<col class=\"de_col_2_450\" />\n<tr>\n<td class=\"de_td_677\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #a6a6a6; border-right-style: solid; border-right-width: 1px; border-right-color: #a6a6a6; border-top-style: solid; border-top-width: 1px; border-top-color: #a6a6a6; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #a6a6a6;  width: 677px; vertical-align: top; background-color: #d9d9d9;\" colspan = \"2\" rowspan = \"1\" >\n<div class=\"p de_0781524CBD\"><span class=\"de_CC7DAF531E\"><strong>Hardware and I/O</strong></span></div>\n</td></tr><tr>\n<td class=\"de_td_227\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #a6a6a6; border-right-style: none; border-right-width: 1px; border-right-color: #a6a6a6; border-top-style: solid; border-top-width: 1px; border-top-color: #a6a6a6; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #a6a6a6;  width: 227px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_0781524CBD\"><span class=\"de_CC7DAF531E\">Storage Capacity</span></div>\n</td><td class=\"de_td_450\" style = \"padding: 2px; border-left-style: none; border-left-width: 1px; a6a6; border-top-style: solid; border-top-width: 1px; border-top-color: #a6a6a6; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #a6a6a6;  width: 227px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Advanced Sample Editing</span></div>\n</td><td class=\"de_td_450\" style = \"padding: 2px; border-left-style: none; border-left-width: 1px; border-left-color: #a6a6a6; border-right-style: solid; border-right-width: 1px; border-right-color: #a6a6a6; border-top-style: solid; border-top-width: 1px; border-top-color: #a6a6a6; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #a6a6a6;  width: 450px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">With Chop Mode, lazy-chopping, auto-snapping, real-time looping, and warping.</span></div>\n</td></tr><tr>\n<td class=\"de_td_227\" style = \"padding: 2px; border-left-style: solid; border-left-width: 1px; border-left-color: #a6a6a6; border-right-style: none; border-right-width: 1px; border-right-color: #a6a6a6; border-top-style: solid; border-top-width: 1px; border-top-color: #a6a6a6; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #a6a6a6;  width: 227px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Fast Workflow</span></div>\n</td><td class=\"de_td_450\" style = \"padding: 2px; border-left-style: none; border-left-width: 1px; border-left-color: #a6a6a6; border-right-style: solid; border-right-width: 1px; border-right-color: #a6a6a6; border-top-style: solid; border-top-width: 1px; border-top-color: #a6a6a6; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: #a6a6a6;  width: 450px; vertical-align: top;\" colspan = \"1\" rowspan = \"1\" >\n<div class=\"p de_F5E25F2BBC\"><span class=\"de_CC7DAF531E\">Fast one-touch funct
