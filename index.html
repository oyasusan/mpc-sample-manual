const PAGES_JA = {"introduction": "<h1>はじめに</h1>\n<p>MPC Sample をご購入いただきありがとうございます。</p>\n<p>クラシックな MPC60 のデザインにインスパイアされたこのポータブルサンプラーは、ヴィンテージ MPC のアイコニックなワークフローをコンパクトで最新のフォーマットに搭載しています。伝説的な MPC パッド、フルカラーディスプレイ、シンプルなクリエイティブコントロールにより、サンプリング、ループ、ビートメイキングをすぐに始められます。100 以上のキット、Pad FX、Knob FX、直感的なチョッピングワークフローが含まれています。</p>\n<p>充電式リチウムイオンバッテリー、microSD カードストレージ、オンボードシーケンサー、内蔵マイク、内蔵スピーカー、USB-C 接続により、コンピュータや DAW なしで、どこでもオーディオの録音・編集・再生が可能です。</p>\n<h2>同梱物</h2>\n<ul><li>MPC Sample 本体</li><li>USB-C ケーブル</li><li>クイックスタートガイド</li><li>安全・保証マニュアル</li></ul>\n<h2>サポート</h2>\n<p>製品について詳しくは <strong>akaipro.com</strong> をご覧ください。</p>\n<p>製品登録は <strong>profile.inmusicbrands.com</strong> から行えます。ログインまたはアカウント作成後、「新規製品を登録」を選択してください。</p>\n<p>追加サポートは <strong>support.akaipro.com</strong> をご利用ください。</p>\n<h2>このユーザーガイドについて</h2>\n<p>このマニュアルは MPC Sample の使い方を習得するためのガイドです。重要な情報は以下の形式で表記されます。</p>\n<p><strong>重要 / 注意 / ヒント：</strong> 特定のトピックに関する重要または役立つ情報。</p>\n<p>ボタン・コントロール・パラメータ名はマニュアル全体で <strong>太字</strong> で表記されます。</p>\n<p>関連セクションへの参照は <strong>太字斜体</strong> の青い文字で示されます。クリックするとそのセクションに直接移動できます。</p>", "setup": "<h1>セットアップ</h1>\n<p>本章では MPC Sample の初期設定と他の機器との接続方法について説明します。チュートリアルに進む前に、このセクションを確認することをお勧めします。</p>\n<p>MPC Sample のコントロールと接続について詳しくは <strong>Features</strong> 章をご覧ください。</p>\n<h2>セクション内容</h2>\n<ul><li>Firmware Updates</li><li>Connection Diagram</li></ul>", "firmware_updates": "<h1>ファームウェア更新</h1>\n<h2>はじめに</h2>\n<p>MPC Sample を初めて使用する前に、利用可能なファームウェア更新を確認することをお勧めします。更新により新機能と改善が追加されます。</p>\n<h2>更新手順</h2>\n<ol><li>付属の USB-C ケーブルで MPC Sample をコンピュータの USB ポートに接続します。</li><li>MPC Sample の電源をオンにします。</li><li>ウェブブラウザで <strong>mpc-sample.local</strong> にアクセスします。</li></ol>\n<p><strong>ヒント：</strong> 接続に問題がある場合は、USB 接続中に MPC Sample を再起動してください。それでも接続できない場合は <strong>192.168.155.1</strong> を試してください。Windows 10 ユーザーは事前に Windows 10 ドライバーをインストールしてください。</p>\n<ol><li>ページが読み込まれると、現在のファームウェアバージョンが自動スキャンされます。更新がある場合は画面の指示に従って適用してください。</li><li><strong>Manual Firmware Upload</strong> をクリックしてファームウェアファイルを手動でアップロードすることもできます。</li></ol>\n<h2>重要な注意</h2>\n<p>Windows 10 ユーザーは、<strong>akaipro.com/mpc-sample</strong> の MPC Sample ダウンロードページから専用のアップデートアプリをダウンロードしてください。</p>\n<p>inMusic Software Center を使用して更新を確認・適用することもできます。</p>\n<p>定期的にファームウェア更新を確認することをお勧めします。</p>", "connection_diagram": "<h1>接続ダイアグラム</h1>\n<p>以下は MPC Sample を他の機器と接続する設定例です。記載されていないアイテムは別途購入が必要です。</p>\n<p>各端子の詳細は <strong>Features</strong> 章をご参照ください。</p>\n<h2>接続例</h2>\n<ul><li><strong>AUDIO OUT</strong> → スピーカー / ミキサー</li><li><strong>AUDIO IN</strong> → マイク / 楽器 / ラインソース</li><li><strong>PHONES</strong> → ヘッドフォン</li><li><strong>MIDI IN/OUT</strong> → 外部 MIDI 機器</li><li><strong>SYNC OUT</strong> → 外部モジュールギア</li><li><strong>USB-C</strong> → コンピュータ（オーディオ・MIDI・ファイル転送）</li></ul>", "tutorial": "<h1>チュートリアル</h1>\n<p>このチュートリアルでは MPC Sample を使ったビート制作の基本を学びます。ステップは順番に進めることをお勧めします。</p>\n<h2>サウンドの再生</h2>\n<ol><li><strong>POWER</strong> ボタンを押して MPC Sample の電源をオンにします。</li><li><strong>MAIN VOLUME</strong> ノブを上げます。</li><li><strong>PLAY</strong> ボタンを押してシーケンスを再生します。各サウンドがトリガーされるとパッドが光ります。</li><li><strong>STOP</strong> ボタンを押して停止します。</li></ol>\n<p>パッドをタップするとサンプルが再生されます（Sample Mode）。<strong>SAMPLE</strong> ボタンでいつでもアクセスできます。</p>\n<h2>サンプルの探索</h2>\n<ol><li>パッドをタップし、<strong>SAMPLE SELECT</strong> ボタンを押します。</li><li><strong>ENCODER</strong> を回してサンプルフォルダを参照します。</li><li><strong>ENCODER</strong> を押してフォルダを開き、サンプルリストを閲覧します。</li><li>新しいサンプルを選択して <strong>ENCODER</strong> を押してパッドにロードします。</li><li><strong>SAMPLE SELECT</strong> を再度押して Sample Mode に戻ります。</li></ol>\n<h2>シーケンスの再生</h2>\n<ol><li><strong>SEQ</strong> ボタンを押して Sequence Mode を開きます。</li><li><strong>PLAY</strong> ボタンを押して再生を開始します。</li><li>再生中に別のパッドをタップするとそのシーケンスがキューイングされます。</li><li><strong>STOP</strong> ボタンで停止します。</li></ol>\n<h2>シーケンスの録音</h2>\n<ol><li>空のパッドをタップして選択します。</li><li><strong>B1</strong> ボタンを押し続けて Sequence BPM ウィンドウを開き、<strong>ENCODER</strong> で BPM を調整します。</li><li><strong>B3</strong> ボタンで Record Quantization のオン/オフを切り替えます。</li><li><strong>K2</strong> ノブで Q 値、<strong>K1</strong> ノブでシーケンス長をバー単位で調整します。</li><li><strong>SEQ RECORD</strong> ボタンを押して録音準備完了にします。</li><li><strong>PLAY</strong> ボタンで録音開始、パッドをタップしてイベントを追加します。</li><li><strong>SEQ RECORD</strong> で録音停止、<strong>STOP</strong> で再生も停止します。</li></ol>\n<h2>新規プロジェクトの開始</h2>\n<ol><li><strong>SHIFT</strong> を押し続けながら <strong>PAD 16 – PROJECT</strong> を押します。</li><li><strong>ENCODER</strong> で「New Project」を選択して押します。</li><li>確認メッセージで <strong>B3</strong> ボタンを押して実行します。</li></ol>\n<h2>サンプルの録音</h2>\n<ol><li><strong>SAMPLE RECORD</strong> ボタンを押して Sample Record Mode に入ります。</li><li><strong>K1</strong> ノブで入力ソースを「Mic」に設定します。</li><li>パッドをタップして録音開始します。</li><li>完了後、パッドをもう一度タップして停止します。</li></ol>\n<h2>サンプルの編集</h2>\n<ol><li><strong>SAMPLE</strong> ボタンを押して Sample Mode を確認します。</li><li>編集するサンプルのパッドをタップします。</li><li><strong>K1</strong> ノブで <strong>Start</strong> ポイント、<strong>K2</strong> ノブで <strong>End</strong> ポイントを調整します。</li><li>パッドをタップして新しい範囲で再生確認します。</li><li><strong>SHIFT</strong> を押しながら <strong>PAD 13 – TRIM SAMPLE</strong> でサンプルを永続的に短縮できます。</li><li><strong>B1, B2, B3</strong> で編集オプションを切り替え、<strong>K1, K2, K3</strong> で各パラメータを調整します。</li></ol>\n<h2>エフェクト（FX）の使用</h2>\n<h3>Pad FX モード</h3>\n<ol><li><strong>PAD FX</strong> ボタンを押して Pad FX Mode を開きます。</li><li><strong>PLAY</strong> でシーケンス再生開始します。</li><li>パッドをタップ＆ホールドしてエフェクトをトリガーします。</li><li><strong>K1–K3</strong> ノブでエフェクトパラメータを調整します。</li></ol>\n<h3>Knob FX モード</h3>\n<ol><li><strong>KNOB FX</strong> ボタンを押して Knob FX Mode を有効化します。</li><li><strong>SEQ</strong> ボタンで Sequence Mode、<strong>PLAY</strong> で再生開始します。</li><li><strong>K1–K3</strong> ノブでエフェクトを調整します。</li><li><strong>SHIFT + KNOB FX</strong> ボタンで別のエフェクトを選択します。</li></ol>\n<h3>Flex Beat モード</h3>\n<ol><li><strong>SHIFT + PAD FX / FLEX BEAT</strong> ボタンを押します。</li><li><strong>PLAY</strong> でシーケンス再生開始します。</li><li><strong>PADS 2–16</strong> を押してエフェクトをトリガーします。</li><li><strong>PAD 1</strong> を押すと Empty エフェクト（変更なし）に戻ります。</li></ol>", "features": "<h1>機能説明</h1>\n<p>本章では MPC Sample の各接続端子とコントロールの機能を説明します。</p>\n<h2>POWER</h2>\n<p>電源ボタン。押して MPC Sample の電源をオン/オフします。</p>\n<h2>USB</h2>\n<p>付属の USB-C ケーブルで USB-C 電源アダプタまたはモバイルバッテリーに接続して電源供給・充電ができます。コンピュータの USB-C ホストポートに接続するとオーディオ・MIDI 信号の送受信と microSD カードのファイル転送も可能です。</p>\n<h2>REC GAIN</h2>\n<p>このノブを回して AUDIO IN 接続の録音レベルを調整します。</p>\n<h2>AUDIO IN</h2>\n<p>1/4\"（6.35mm）TRS 入力。マイク・楽器・ミキサー・シンセサイザーなどのラインレベルオーディオソースを接続します。</p>\n<h2>AUDIO OUT</h2>\n<p>1/4\"（6.35mm）TRS 出力。スピーカー・ミキサーなどに接続します。MAIN VOLUME コントロールで出力レベルを調整します。</p>\n<h2>MIDI IN / OUT</h2>\n<p>1/8\" TRS（Type A）→ 5-Pin MIDI DIN コネクタ（別売）経由でドラムマシンやシンセサイザーなどの外部 MIDI 機器を接続します。</p>\n<h2>SYNC OUT</h2>\n<p>5V CV 出力（1/8\"、TS）。外部モジュールギアを同期させるクロックパルスを送信します。</p>\n<h2>PHONES</h2>\n<p>標準的なヘッドフォンを接続して MPC Sample のオーディオをモニターします。MAIN VOLUME で音量を調整します。ヘッドフォン接続時は内蔵スピーカーが無効になります。</p>\n<h2>microSD Card Slot</h2>\n<p>microSD カードを挿入して外部ストレージとして使用します。Project メニューの SD Card Access から管理できます。</p>\n<h2>Display</h2>\n<p>利用可能なメニューやパラメータを表示します。</p>\n<h2>Battery Icon</h2>\n<p>現在のバッテリーレベルを表示します。緑 = 100〜30%、琥珀 = 29〜15%、赤 = 14〜5%。点滅赤は 5% 未満で、すぐに充電が必要です。</p>\n<h2>Charging Icon</h2>\n<p>充電中に点灯します。</p>\n<h2>MAIN VOLUME</h2>\n<p>オーディオ出力レベルを調整します。内蔵スピーカー・PHONES・AUDIO OUT すべてに適用されます。</p>\n<h2>Meters</h2>\n<p>メイン出力ボリュームレベルまたはサンプル録音時の入力ソースレベルを表示します。</p>\n<h2>Speaker</h2>\n<p>内蔵スピーカー。PHONES または AUDIO OUT に何も接続されていない場合にオーディオを再生します。</p>\n<h2>Microphone</h2>\n<p>内蔵コンデンサーマイク。簡単にサンプリングできます。</p>\n<h2>SHIFT</h2>\n<p>二次機能へのアクセスボタン。押し続けながら別のボタンやパッドを押して二次機能にアクセスします。</p>\n<h2>Encoder</h2>\n<p>回してメニューを操作・設定を調整します。押して選択・確定します。</p>\n<h2>-/+</h2>\n<p>選択したパラメータを増減、またはリストを上下に移動します。</p>\n<h2>B1, B2, B3 Function Buttons</h2>\n<p>ディスプレイのページを切り替えたり、特定の機能を有効にするボタンです。</p>\n<h2>K1, K2, K3 Knobs</h2>\n<p>ディスプレイに表示される各種設定やパラメータを調整するノブです。</p>\n<h2>Fader</h2>\n<p>各種パッドおよびキットパラメータを調整します。デフォルトではパッドボリュームを調整します。</p>\n<h2>ERASE</h2>\n<p>サンプル・シーケンス・イベント・オートメーションを消去します。</p>\n<h2>NOTE REPEAT</h2>\n<p>Note Repeat モードを有効にします。有効時、パッドを押すと設定された時間分割で繰り返し音が出ます。</p>\n<h2>PAD BANK</h2>\n<p>パッドバンク A〜H を切り替えます。</p>\n<h2>SAMPLE SELECT</h2>\n<p>サンプルブラウザを開いて、現在のパッドに割り当てるサンプルを参照・選択します。</p>\n<h2>TAP TEMPO</h2>\n<p>一定間隔でタップして新しいプロジェクトテンポを設定します。</p>\n<h2>Pads</h2>\n<p>16 個のベロシティセンシティブ・ポリアフタータッチ対応パッド。サンプルとシーケンスのトリガーや各種機能の実行に使用します。</p>\n<h2>Mode ボタン</h2>\n<h3>SAMPLE</h3>\n<p>Sample Mode を開きます。サンプルのトリガーとパラメータの表示・編集ができます。</p>\n<h3>SEQ</h3>\n<p>Sequence Mode に入り、ノートイベントのシーケンスを録音・編集します。</p>\n<h3>PAD FX</h3>\n<p>Pad FX Mode を有効化します。パッドを使用してシーケンス全体にエフェクトをトリガーします。</p>\n<h3>KNOB FX</h3>\n<p>Knob FX Mode を有効化します。K1〜K3 ノブで特定のエフェクトパラメータをコントロールします。</p>\n<h2>Pad Play ボタン</h2>\n<h3>CHOP</h3>\n<p>Chop Mode を有効化します。選択したパッドのサンプルが自動的に分割され、各パッドがスライスをトリガーします。</p>\n<h3>LOOP</h3>\n<p>現在のパッドのループ再生を有効化します。</p>\n<h3>MUTE</h3>\n<p>Sample Mode 内でパッドのミュートモードを有効化します。</p>\n<h3>16 LEVELS</h3>\n<p>現在選択されたサンプルが 16 パッドすべてにコピーされ、選択パラメータが各パッドで段階的に変化します。</p>\n<h3>SAMPLE RECORD</h3>\n<p>Sample Record Mode に入ります。接続されたソースからオーディオを録音して独自のサンプルを作成できます。</p>\n<h3>SEQ RECORD</h3>\n<p>Sequence Record Mode に入ります。</p>\n<h3>PLAY</h3>\n<p>シーケンスの再生または録音を開始します。</p>\n<h3>STOP</h3>\n<p>再生または録音を停止します。ダブルクリックですべてのオーディオが停止します。</p>", "operation": "<h1>操作</h1>\n<p>本章では MPC Sample の各モード・機能・メニューについて説明します。</p>\n<p>特定のコントロールや接続の詳細については前章の <strong>Features</strong> をご参照ください。</p>\n<h2>セクション内容</h2>\n<ul><li>Sample Mode</li><li>Sample Record Mode</li><li>Sequence Mode</li><li>Effects</li><li>Menus</li></ul>", "sample_mode": "<h1>Sample Mode</h1>\n<p>Sample Mode は MPC Sample のメインモードです。サンプルをトリガーし、パラメータを表示・編集できます。</p>\n<p><strong>SAMPLE</strong> ボタンを押して Sample Mode を開きます。</p>\n<p><strong>PAD</strong> を押してトリガーし、ディスプレイでサンプルを確認します。</p>\n<p>トリガーせずにサンプルを選択・表示するには、<strong>SAMPLE</strong> ボタンを押しながら <strong>PAD</strong> を押します。</p>\n<p><strong>K1–K3</strong> ノブで以下のパラメータを選択・調整します。または <strong>ENCODER</strong> を押してパラメータを循環させ、<strong>ENCODER</strong> を回すか <strong>-/+</strong> ボタンで調整します。</p>\n<p><strong>SHIFT + B1</strong> でループロックのオン/オフ。<strong>SHIFT + B2</strong> でノーマライズを適用します。</p>\n<h2>Trim（B1）</h2>\n<p>サンプルの長さを編集します。</p>\n<ul><li><strong>K1 – Start：</strong> サンプル開始点（0–100%）</li><li><strong>K2 – End：</strong> サンプル終了点（0–100%）</li><li><strong>K3 – Loop：</strong> ループポイント（0–100%）</li><li><strong>SHIFT + K1/K2/K3：</strong> 各ポイントのズーム</li></ul>\n<h2>Mix</h2>\n<p>ミックス設定を調整します。</p>\n<ul><li><strong>K1 – Volume：</strong> サンプルボリューム（-INF〜+6.00 dB）</li><li><strong>K2 – Kit Volume：</strong> キット全体のボリューム</li><li><strong>K3 – Pan：</strong> ステレオパン（50L〜C〜50R）</li></ul>\n<h2>Amp Env</h2>\n<p>振幅エンベロープを調整します。</p>\n<ul><li><strong>K1 – Attack：</strong> アタック段階（0–127）</li><li><strong>K2 – Decay/Release：</strong> デケイ/リリース段階（0–127）</li><li><strong>K3 – Vel Sens：</strong> ベロシティ感度（0–127）</li></ul>\n<h2>Tune（B2）</h2>\n<p>ピッチチューニングを調整します。</p>\n<ul><li><strong>K1 – Semi Tune：</strong> 半音単位のチューニング（-24〜+24）</li><li><strong>K2 – Fine Tune：</strong> セント単位のチューニング（-90〜+90）</li><li><strong>K3 – Warp：</strong> ワープ値（Off、50–200%、Seq）</li></ul>\n<h2>Play</h2>\n<p>再生機能を調整します。</p>\n<ul><li><strong>K1 – Polyphony：</strong> Mono / Poly 選択</li><li><strong>K2 – Mute Group：</strong> ミュートグループ割り当て（Off、1–16）</li><li><strong>K3 – Offset：</strong> トリガーオフセット（0–100%）</li></ul>\n<h2>Filter（B3）</h2>\n<p>フィルター設定を調整します。</p>\n<ul><li><strong>K1 – Cutoff：</strong> フィルター中心周波数（0–127）</li><li><strong>K2 – Reso：</strong> フィルター共鳴（0–127）</li><li><strong>K3 – Type：</strong> フィルタータイプ（Off、Classic、LPF2/4、HPF2/4、BPF2/4）</li></ul>\n<h2>Filt Env</h2>\n<p>フィルターエンベロープを調整します。</p>\n<ul><li><strong>K1 – Attack：</strong> アタック段階（0–127）</li><li><strong>K2 – Decay/Release：</strong> デケイ/リリース段階（0–127）</li><li><strong>K3 – Depth：</strong> エンベロープ影響度（0–127）</li></ul>", "pad_play": "<h1>Pad Play</h1>\n<p>Sample Mode 中に <strong>PAD PLAY</strong> ボタンを使用してサンプルの追加再生機能を有効にできます。<strong>MUTE</strong> 機能はどのモードでもアクセス可能です。</p>\n<h2>Chop</h2>\n<p><strong>CHOP</strong> ボタンを押して Chop Mode を有効にします。サンプルが自動的にスタート〜エンドポイント間で現在の Chop Type に基づいて分割されます。</p>\n<h3>Chop Mode コントロール</h3>\n<ul><li><strong>K1 – Start：</strong> スライス開始ポイント（0–100%）</li><li><strong>K2 – End：</strong> スライス終了ポイント（0–100%）</li><li><strong>K3 – Chop Type：</strong> Threshold / Regions 4/8/16 / Manual</li></ul>\n<h3>編集機能</h3>\n<ul><li><strong>SHIFT+B1：</strong> 現在のスライスを抽出</li><li><strong>SHIFT+B2：</strong> スライスを2分割</li><li><strong>SHIFT+B3：</strong> 前のスライスとマージ</li><li><strong>ERASE + PAD：</strong> スライスを削除</li></ul>\n<h2>Note On</h2>\n<p><strong>SHIFT + CHOP</strong> で有効化。パッド押下中のみサンプルが再生されます。</p>\n<h2>Loop</h2>\n<p><strong>LOOP</strong> ボタンで有効化。Sample End ポイントに達すると Loop Start ポイントに戻って繰り返します。</p>\n<p>LOOP LOCK がデフォルトで有効（Sample Start を Loop Start にロック）。<strong>SHIFT+B1</strong> で解除可能です。</p>\n<h2>Reverse</h2>\n<p><strong>SHIFT + LOOP</strong> で有効化。サンプルが逆方向（End→Start）で再生されます。</p>\n<h2>Mute</h2>\n<p><strong>MUTE</strong> ボタンで有効化。赤く点灯 = ミュート中、黄色く点灯 = ミュート解除中。</p>\n<p><strong>SHIFT + MUTE</strong> でパッド全体をアンミュートします。</p>\n<h2>16 Levels</h2>\n<p><strong>16 LEVELS</strong> ボタンで現在のパッドのサンプルが 16 パッドすべてにコピーされ、選択パラメータが段階的に変化します。</p>\n<p><strong>SHIFT + 16 LEVELS</strong> で 16 Levels タイプを切り替えます（Velocity / Filter / Tune）。</p>", "loading_and_saving_samples": "<h1>サンプルのロードと保存</h1>\n<h2>サンプルのロード</h2>\n<p><strong>SAMPLE SELECT</strong> ボタンを押してサンプルブラウザを開きます。</p>\n<p><strong>ENCODER</strong> を回すか <strong>-/+</strong> ボタンでサンプルカテゴリのリストを参照します。</p>\n<p><strong>ENCODER</strong> を押してフォルダを開き、サンプルリストを参照します。</p>\n<p><strong>B3</strong> で自動 <strong>Preview</strong> のオン/オフを切り替えます（オン時、ハイライトされたサンプルが自動再生されます）。</p>\n<p><strong>B1</strong> で前のフォルダに戻ります。</p>\n<p><strong>B2</strong> で内蔵ドライブと外部 microSD カードを切り替えます（カードが挿入されている場合）。</p>\n<h2>サンプルの保存</h2>\n<p><strong>SHIFT + SAMPLE SELECT / SAVE SAMPLE</strong> ボタンを押します。</p>\n<p><strong>ENCODER</strong> を回して文字・数字を選択します。<strong>ENCODER</strong> を押して次の文字に進みます。</p>\n<p><strong>SHIFT</strong> を押しながら大文字にアクセスできます。</p>\n<p><strong>-/+</strong> ボタンで文字間を移動します。</p>\n<p><strong>B2</strong> で現在の文字を削除。<strong>SHIFT + B2</strong> で全文字を一度に削除します。</p>\n<p>編集完了後、<strong>B3（Do It!）</strong> を押して保存します。<strong>B1（Cancel）</strong> でキャンセルします。</p>", "sample_record_mode": "<h1>Sample Record Mode</h1>\n<p>MPC Sample の内蔵サウンドに加えて、Sample Record Mode を使用して独自のサウンドを録音できます。</p>\n<h2>開き方</h2>\n<p><strong>SAMPLE RECORD</strong> ボタンを押して Sample Record Mode を開きます。</p>\n<h2>オーディオモニタリング設定</h2>\n<p><strong>B1</strong> ボタンを押してモニタリングを切り替えます。</p>\n<ul><li><strong>Off：</strong> モニタリングなし</li><li><strong>Auto：</strong> Sample Record Mode がフォーカス中のみモニタリング</li><li><strong>On：</strong> 常にモニタリング</li></ul>\n<h2>入力ソースの選択（K1 ノブ）</h2>\n<ul><li><strong>Mic：</strong> 内蔵マイク</li><li><strong>Rear：</strong> リアパネルの AUDIO IN（ステレオ）</li><li><strong>Rear L / Rear R：</strong> 個別チャンネル</li><li><strong>Resample：</strong> MPC Sample からの再録音</li><li><strong>USB / USB L / USB R：</strong> USB 接続デバイスのオーディオ</li></ul>\n<h2>録音長の設定（K2 ノブ）</h2>\n<ul><li><strong>Free：</strong> 無制限</li><li><strong>Seq：</strong> 現在のシーケンス長</li></ul>\n<h2>Threshold（K3 ノブ）</h2>\n<p>録音開始のトリガーレベルを設定します。</p>\n<h2>録音の開始と停止</h2>\n<p>録音したいパッドをタップして録音開始。録音中に追加のパッドをタップするとサンプルを分割できます。</p>\n<p>停止方法：</p>\n<ul><li>PAD を再度押す（Sample Record Mode に留まる）</li><li><strong>STOP</strong> ボタンを押す</li><li><strong>SAMPLE RECORD</strong> ボタンを押す（Sample Mode に自動遷移）</li></ul>\n<h2>Tips</h2>\n<p><strong>SHIFT + SAMPLE RECORD / RECALL</strong> ボタンを長押しすると、過去 25 秒のオーディオを取得して次の空きパッドに自動配置できます。</p>", "sequence_mode": "<h1>Sequence Mode</h1>\n<p>シーケンスは MPC Sample で音楽制作する際の基本要素です。一定時間にわたるノートパターンを含み、verse 用・chorus 用など複数のバリエーションを作成できます。</p>\n<h2>開き方</h2>\n<p><strong>SEQ</strong> ボタンを押して Sequence Mode を開きます。</p>\n<h2>基本操作</h2>\n<p><strong>ENCODER</strong> を回してプレイヘッド位置をビート単位で調整します。<strong>SHIFT + ENCODER</strong> で現在の Q 値単位で調整します。</p>\n<h2>BPM コントロール</h2>\n<p><strong>B1</strong> を押し続けて Sequence BPM ウィンドウを開きます。<strong>ENCODER</strong> で BPM を調整します。</p>\n<p><strong>B2</strong> で SEQ（個別）または GBL（全体共通）の BPM 制御を切り替えます。</p>\n<h2>Record 設定</h2>\n<p><strong>B3：</strong> Record Quantization のオン/オフ</p>\n<h2>長さ・グリッド設定</h2>\n<ul><li><strong>K1 ノブ：</strong> シーケンス長（1–128 バー）</li><li><strong>K2 ノブ：</strong> Q（Quantization）値</li><li><strong>SHIFT + K2：</strong> 拍子記号を調整</li></ul>\n<h2>リズムコントロール</h2>\n<p><strong>K3 ノブ：</strong> RT Swing 値（ノートのリアルタイム位置調整）</p>\n<h2>メトロノーム</h2>\n<p><strong>SHIFT + TAP TEMPO / METRONOME：</strong> Off / On / Record で切り替えます。</p>\n<p><strong>SHIFT + PAD 4 – COUNT-IN：</strong> カウントイン機能のオン/オフ</p>\n<h2>シーケンスの選択と再生</h2>\n<p><strong>PAD</strong> を押してシーケンスを選択します。ノートイベントを含むシーケンスは薄い緑、空のシーケンスは暗く表示されます。</p>\n<p><strong>PLAY</strong> を押して再生開始。再生中に別のパッドを押すと、現在のシーケンス終了後に次のシーケンスが再生されます。</p>\n<h2>関連セクション</h2>\n<ul><li>Recording Sequences</li><li>Editing Sequences</li><li>Step Edit</li><li>Song Mode</li></ul>", "recording_sequences": "<h1>Recording Sequences</h1>\n<h2>基本的な録音手順</h2>\n<ol><li>Sequence Mode で、暗く光っている空のパッドをタップして選択します。</li><li>録音前に BPM・Length・Record Quantization などを調整できます。</li><li><strong>SEQ RECORD</strong> ボタンを押して録音準備完了状態にします（ボタンが点滅）。</li><li><strong>PLAY</strong> ボタンを押して録音開始、パッドをタップしてイベントを追加します。</li><li>シーケンス終端に達すると自動的にオーバーダブ録音に切り替わります。</li><li>完了後、<strong>SEQ RECORD</strong> を再度押して停止、または <strong>STOP</strong> で完全停止します。</li></ol>\n<h2>編集機能</h2>\n<ul><li><strong>SHIFT + -/UNDO：</strong> 最後の録音以降のすべてのイベントを取り消します。</li><li><strong>ERASE ボタン長押し + PAD：</strong> そのパッドのすべての録音イベントを消去します。</li><li><strong>SHIFT + SEQ RECORD / RECALL：</strong> 前回のループで再生されたイベントを取得します。</li></ul>\n<h2>パラメーターオートメーションの録音</h2>\n<ol><li>対象のパッドを選択し、<strong>SEQ RECORD</strong> で録音準備します。</li><li><strong>PLAY</strong> で録音開始後、<strong>K1–K3 ノブ</strong>または <strong>FADER</strong> を操作してパラメーターを調整します。</li><li>Volume・Tuning・Pan・Amp Env・Filter Env・Velocity Sensitivity・Offset のオートメーションが録音できます。</li></ol>\n<h2>オートメーションの消去</h2>\n<p>パッドを選択後、<strong>ERASE</strong> を押しながら対応する <strong>K1–K3 ノブ</strong>を動かすと確認メニューが表示されます。<strong>B3</strong> で実行、<strong>B1</strong> でキャンセルです。</p>", "editing_sequences": "<h1>Editing Sequences</h1>\n<p>現在のシーケンスに対して、<strong>SHIFT</strong> を押しながら以下の <strong>PADS</strong> を押します。</p>\n<ul><li><strong>PAD 2 – Half Seq：</strong> シーケンスの長さを半分に短縮します（例：4 バー → 2 バー）。</li><li><strong>PAD 3 – Double Seq：</strong> シーケンスの長さを 2 倍にし、すべての録音イベントを複製します（例：4 バー → 8 バー）。</li><li><strong>PAD 6 – Half Speed：</strong> すべてのイベントを半速で再生します（例：1/8 音符 → 1/4 音符）。</li><li><strong>PAD 7 – Double Speed：</strong> すべてのイベントを 2 倍速で再生します（例：1/8 音符 → 1/16 音符）。</li><li><strong>PAD 10 – Rec Quantize：</strong> Record Quantization のオン/オフ。録音イベントを現在の時間分割グリッドにスナップします。</li><li><strong>PAD 11 – Resample：</strong> 現在のシーケンスを新しいサンプルとしてキャプチャします。選択後、追加先のパッドを押してください。</li><li><strong>PAD 12 – Song：</strong> Song Mode に入り、複数のシーケンスを組み合わせて曲を作成・エクスポートできます。</li><li><strong>PAD 14 – Time Correct：</strong> Time Correct メニューに入り、シーケンス内のイベントを調整・クオンタイズします。</li></ul>", "step_edit": "<h1>Step Edit</h1>\n<p>Step Edit ページでは、シーケンス内の個別イベントをステップごとに編集できます。</p>\n<h2>開き方</h2>\n<p><strong>SHIFT + SEQ / STEP EDIT</strong> ボタンを押します。</p>\n<h2>操作方法</h2>\n<ul><li><strong>ENCODER：</strong> 現在の Q 値でシーケンスの各ステップ間を移動します。</li><li><strong>-/+ ボタン：</strong> 現在のステップ上のイベント間を移動します。対応するパッドをタップしてイベントを選択することもできます。</li><li><strong>FADER：</strong> 選択したイベントのタイミングを調整し、前後にずらします。</li><li><strong>K1 ノブ：</strong> シーケンス長を調整します。</li><li><strong>K2 ノブ：</strong> Q（Quantization）値を調整します。</li><li><strong>K3 ノブ：</strong> 選択したイベントのベロシティを調整します。</li><li><strong>SHIFT + K2：</strong> プロジェクトの拍子記号を調整します。</li></ul>\n<p><strong>注：</strong> すべてのシーケンスは同じ拍子記号に結びついています。</p>\n<ul><li><strong>B1 + ENCODER：</strong> シーケンステンポを調整します。ENCODER を押して整数と小数の間を移動します。</li><li><strong>B3：</strong> 選択したイベントを消去します。</li><li><strong>ERASE + PAD：</strong> そのパッドのすべてのイベントを消去します（B1 でキャンセル、B3 で実行）。</li></ul>", "song_mode": "<h1>Song Mode</h1>\n<p>Song Mode では、複数のシーケンスをリスト形式で並べて曲を作成し、オーディオファイルとしてエクスポートするか、プロジェクト内の新しいシーケンスとして保存できます。</p>\n<h2>開き方</h2>\n<p><strong>SHIFT + PAD 12 – SONG</strong> を押します。</p>\n<h2>シーケンスの選択</h2>\n<p><strong>PADS</strong> を使用してシーケンスを選択します。既存のシーケンスは明るく点灯、空のシーケンスは暗く表示されます。</p>\n<h2>シーケンスの挿入</h2>\n<p><strong>B3</strong> を押して現在の位置にシーケンスを挿入します。<strong>ENCODER</strong> または <strong>-/+</strong> で挿入済みシーケンスのリストを参照できます。</p>\n<h2>シーケンスの削除</h2>\n<p>削除したいシーケンスをハイライトして <strong>B2</strong> を押します。</p>\n<h2>再生</h2>\n<ul><li><strong>PLAY：</strong> ソングを最初から再生します。</li><li><strong>SHIFT + PLAY / CONTINUE：</strong> ハイライトされたシーケンスから再生を開始します。</li></ul>\n<h2>エクスポート</h2>\n<p><strong>B1</strong> を押してエクスポートオプションを選択します。</p>\n<h3>オーディオミックスダウン</h3>\n<p><strong>B2</strong> でオーディオファイルとして保存します。名前を編集後、<strong>B3（Do It!）</strong> でエクスポート開始します。</p>\n<h3>新規シーケンスとして保存</h3>\n<p><strong>B3</strong> を押すと新しいシーケンスとして保存されます。128 バーを超える場合、作成後の長さ編集はできません。</p>", "effects": "<h1>エフェクト</h1>\n<p>MPC Sample には 4 つの異なるエフェクトエンジンが搭載されており、ビートを次のレベルへ引き上げることができます。</p>\n<h2>Pad FX</h2>\n<p>パッドを使用してシーケンス再生中にエフェクトをトリガーします。16 種類のエフェクトが利用可能で、パッドに加える圧力が強いほどエフェクトが強くかかります。</p>\n<h2>Flex Beat</h2>\n<p>パッドが時間ベースのエフェクトをトリガーし、シーケンスのピッチ・タイム・ボリュームを変形させます。ビートチョップ・DJスタイルのスクラッチ・トランスゲートエフェクトを実現します。</p>\n<h2>Knob FX</h2>\n<p>K1〜K3 ノブで単一のエフェクトパラメータをコントロールします。パッドでサンプル・シーケンスをトリガーしながら、パフォーマンス中にエフェクトを組み込みたい場合に最適です。</p>\n<h2>Compressor</h2>\n<p>内蔵コンプレッサーを適用・調整してサウンドにパンチを加えます。</p>", "pad_fx": "<h1>Pad FX</h1>\n<p>MPC Sample の Pad FX により、シーケンス再生中にパッドでエフェクトをトリガーできます。</p>\n<p><strong>PAD FX</strong> モードボタンを押して開きます。</p>\n<p><strong>PADS 1–16</strong> を押してエフェクトをトリガーします。圧力が強いほどエフェクトが強くかかります。最大 4 つのエフェクトを同時使用できます。</p>\n<p><strong>K1–3 ノブ</strong>でエフェクトパラメータを調整します。</p>\n<p><strong>B1</strong> でエフェクトを現在の量で <strong>Latch</strong>（ラッチ）できます。</p>\n<h2>エフェクト一覧</h2>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Pad</th><th>エフェクト</th><th>説明</th><th>K1</th><th>K2</th><th>K3</th></tr></thead><tbody>\n<tr><td>1</td><td>Half Speed</td><td>低速再生</td><td>Speed</td><td>Mix</td><td>—</td></tr>\n<tr><td>2</td><td>Chorus</td><td>きらめくピッチ変調</td><td>Rate</td><td>Depth</td><td>Feedback</td></tr>\n<tr><td>3</td><td>Flanger</td><td>「シュー」という変調音</td><td>Rate</td><td>Depth</td><td>Feedback</td></tr>\n<tr><td>4</td><td>Phaser</td><td>鋭い「スウープ」音</td><td>Feedback</td><td>Speed</td><td>Range</td></tr>\n<tr><td>5</td><td>Comb Filter</td><td>スペクトラムにノッチを生成</td><td>Speed</td><td>—</td><td>—</td></tr>\n<tr><td>6</td><td>LP Filter</td><td>カットオフ以上の周波数を抑制</td><td>Resonance</td><td>Speed</td><td>Range</td></tr>\n<tr><td>7</td><td>HP Filter</td><td>カットオフ以下の周波数を抑制</td><td>Resonance</td><td>Speed</td><td>Range</td></tr>\n<tr><td>8</td><td>BP Filter</td><td>カットオフ以上・以下を抑制</td><td>Resonance</td><td>Speed</td><td>Range</td></tr>\n<tr><td>9</td><td>Ring Mod</td><td>金属的なパルス音</td><td>Max Freq</td><td>—</td><td>—</td></tr>\n<tr><td>10</td><td>LoFi</td><td>ロー・ファイ音生成</td><td>Bitcrush</td><td>Decimator</td><td>—</td></tr>\n<tr><td>11</td><td>Color</td><td>ビンテージ機器の音をエミュレート</td><td>Mode</td><td>—</td><td>—</td></tr>\n<tr><td>12</td><td>Granulator</td><td>グレイン合成</td><td>Density</td><td>Feedback</td><td>Grain Len</td></tr>\n<tr><td>13</td><td>Beat Repeat</td><td>スタッタリングループ</td><td>Division</td><td>Reverse</td><td>Resonance</td></tr>\n<tr><td>14</td><td>Rev Stepper</td><td>スライス&リピート</td><td>Delay Time</td><td>Repeats</td><td>—</td></tr>\n<tr><td>15</td><td>Delay</td><td>エコーリピート</td><td>Time</td><td>Feedback</td><td>Range</td></tr>\n<tr><td>16</td><td>Reverb</td><td>空間残響</td><td>Pre-Delay</td><td>Decay</td><td>Diffusion</td></tr>\n</tbody></table></div>", "flex_beat": "<h1>Flex Beat</h1>\n<p>Pad FX と同様にパッドでエフェクトをトリガーしますが、時間ベースのエフェクトでシーケンスのピッチ・タイム・ボリュームを変形させます。ビートチョップ・DJスクラッチ・トランスゲートエフェクトを実現します。</p>\n<h2>開き方</h2>\n<p><strong>SHIFT + PAD FX / FLEX BEAT</strong> ボタンを押します。</p>\n<p>使用前に <strong>PLAY</strong> ボタンを押してシーケンスを再生してください。</p>\n<p>デフォルトでは <strong>PAD 1</strong>（EMPTY エフェクト）がアクティブです。</p>\n<p><strong>PADS 2–16</strong> を押してエフェクトをトリガーします。</p>\n<h2>コントロール</h2>\n<ul><li><strong>B3：</strong> Quantize のオン/オフ</li><li><strong>K1：</strong> One Shot / Loop の切り替え</li><li><strong>K3：</strong> ドライ/ウェット Mix（0–100%）</li></ul>", "knob_fx": "<h1>Knob FX</h1>\n<p>MPC Sample の Knob FX では、K1–3 ノブを使用して単一のエフェクトパラメータをコントロールします。パッドを他の用途に使いながらエフェクトを操作できます。</p>\n<h2>操作方法</h2>\n<p><strong>KNOB FX</strong> ボタンを押して有効化します。ディスプレイ下部に K1–K3 で制御可能なパラメータが表示されます。</p>\n<p><strong>SHIFT</strong> を押しながら追加パラメータにアクセスできます。</p>\n<p>無効化するには <strong>KNOB FX</strong> ボタンを再度押します。</p>\n<h2>設定調整</h2>\n<p><strong>SHIFT + KNOB FX</strong> で設定を調整します。特定のパッドまたは全パッドに適用できます。</p>\n<ul><li><strong>B2：</strong> 全パッドで有効化</li><li><strong>B3：</strong> 全パッドで無効化</li></ul>\n<h2>エフェクト選択</h2>\n<p><strong>ENCODER</strong> を回すか <strong>-/+</strong> でリストを参照し、<strong>ENCODER</strong> を押して選択します。</p>\n<h2>エフェクト一覧（主要）</h2>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>エフェクト</th><th>K1</th><th>K2</th><th>K3</th></tr></thead><tbody>\n<tr><td>Delay</td><td>Time</td><td>Feedback</td><td>Mix</td></tr>\n<tr><td>Diff Delay</td><td>Time</td><td>Feedback</td><td>Mix</td></tr>\n<tr><td>Tape Delay</td><td>Time</td><td>Feedback</td><td>Mix</td></tr>\n<tr><td>Reverb Small/Med/Large</td><td>Pre-Delay</td><td>Time</td><td>Mix</td></tr>\n<tr><td>Spring Reverb</td><td>Pre-Delay</td><td>Time</td><td>Mix</td></tr>\n<tr><td>HP Filter</td><td>Frequency</td><td>Resonance</td><td>—</td></tr>\n<tr><td>LP Filter</td><td>Frequency</td><td>Resonance</td><td>—</td></tr>\n<tr><td>BP Filter</td><td>Frequency</td><td>Resonance</td><td>—</td></tr>\n<tr><td>Bus Compressor</td><td>Attack</td><td>Release</td><td>Threshold</td></tr>\n<tr><td>Limiter</td><td>Gain</td><td>Ceiling</td><td>Release</td></tr>\n<tr><td>Pumper</td><td>Speed</td><td>Shape</td><td>Depth</td></tr>\n<tr><td>Transient</td><td>Attack</td><td>Shape</td><td>Sustain</td></tr>\n<tr><td>Noise Gate</td><td>Threshold</td><td>Depth</td><td>—</td></tr>\n<tr><td>Amp Sim</td><td>Cab Model</td><td>Drive</td><td>Soft Clip</td></tr>\n<tr><td>Tube Drive</td><td>Drive</td><td>Headroom</td><td>Saturation</td></tr>\n<tr><td>Soft Clipper</td><td>Drive</td><td>Shape</td><td>Mix</td></tr>\n<tr><td>Ensemble</td><td>Rate</td><td>Depth</td><td>Mix</td></tr>\n<tr><td>Multi-Chorus</td><td>Rate</td><td>Depth</td><td>Mix</td></tr>\n<tr><td>Phaser</td><td>Rate</td><td>Depth</td><td>Mix</td></tr>\n<tr><td>Flanger</td><td>Rate</td><td>Depth</td><td>Mix</td></tr>\n<tr><td>Auto-Wah</td><td>Sens</td><td>Resonance</td><td>Mix</td></tr>\n<tr><td>Auto-Pan</td><td>Rate</td><td>—</td><td>Mix</td></tr>\n<tr><td>Vintage Emulator</td><td>Type</td><td>—</td><td>—</td></tr>\n<tr><td>Vinyl Emulator</td><td>Tone</td><td>Crackle</td><td>Pitch</td></tr>\n<tr><td>Tape Emulator</td><td>Wow</td><td>Noise</td><td>Pitch</td></tr>\n</tbody></table></div>", "compressor": "<h1>Compressor</h1>\n<p>Compressor エフェクトは信号のダイナミックレンジを変更し、一定レベルを超えた場合に自動的にゲインを低減します。</p>\n<h2>アクセス方法</h2>\n<p><strong>SHIFT + PAD 5 – COMPRESSOR</strong> を押して開きます。</p>\n<h2>機能ボタン</h2>\n<ul><li><strong>B1：</strong> Color エフェクトのオン/オフ。有効時、ベースブースト・ピッチ不安定性・ハーモニック飽和による「テープウォーミス」効果が加わります。</li><li><strong>B3：</strong> コンプレッサーのバイパス/有効化。</li></ul>\n<h2>ノブコントロール</h2>\n<ul><li><strong>K1 – Attack：</strong> コンプレッサーのアタックフェーズ（0.100–150 ms）。信号がしきい値を超えた後、圧縮を開始するまでの時間。</li><li><strong>K2 – Release：</strong> リリースフェーズ（3.0–300 ms）。信号がしきい値以下に低下した後、圧縮を停止するまでの時間。</li><li><strong>K3 – Amount：</strong> 圧縮量（0.00–100.00%）。</li><li><strong>SHIFT + K3 – In Boost：</strong> コンプレッサーへの入力音量を増加させます。</li></ul>\n<p>Makeup gain は入力レベルと全体的なパラメータ設定に基づいて自動計算されます。</p>", "menus": "<h1>メニュー</h1>\n<p>本章では MPC Sample で使用される追加メニューについて説明します。デバイス設定やファイル管理などに関連する機能が含まれています。</p>\n<h2>セクション内容</h2>\n<ul><li>Input Configuration（入力設定）</li><li>Fader</li><li>Time Correct（タイムコレクト）</li><li>MIDI Configuration（MIDI 設定）</li><li>Project（プロジェクト）</li></ul>", "input_configuration": "<h1>入力設定（Input Configuration）</h1>\n<p>サンプリング用のオーディオ入力ソースを選択・調整できます。</p>\n<p><strong>SHIFT + SAMPLE</strong> ボタンを押して開きます。</p>\n<h2>Source（入力ソース）</h2>\n<ul><li><strong>Mic：</strong> 内蔵マイク</li><li><strong>Rear：</strong> リアパネルの AUDIO IN（ステレオ録音）</li><li><strong>Rear L / Rear R：</strong> 個別チャンネル</li><li><strong>Resample：</strong> MPC Sample から再録音したオーディオ（シーケンスを単一パッドに録音）</li><li><strong>USB：</strong> USB ポートに接続されたデバイスのオーディオ（ステレオ）</li><li><strong>USB L / USB R：</strong> 左/右チャンネル個別</li></ul>\n<h2>Monitor（モニタリング）</h2>\n<ul><li><strong>Off：</strong> モニタリングなし</li><li><strong>Auto：</strong> Sample Record Mode がフォーカス中のみ</li><li><strong>On：</strong> 常にモニタリング</li></ul>\n<h2>Threshold（閾値）</h2>\n<p>選択したソースの最小オーディオレベル（-96〜0 dB）。自動録音を開始する基準レベルです。</p>\n<h2>Rec Length（録音長）</h2>\n<ul><li><strong>FREE：</strong> 無制限</li><li><strong>SEQ：</strong> シーケンス長に固定</li></ul>\n<h2>Rec Input Effects</h2>\n<p>Knob FX を録音に含める（<strong>ON</strong>）か除外する（<strong>Off</strong>）かを設定します。</p>\n<p><strong>B3</strong> でメニューを閉じます。</p>", "fader": "<h1>Fader</h1>\n<p>Fader メニューでは、フェーダーがコントロールするパラメータを選択できます。</p>\n<h2>開き方</h2>\n<p><strong>SHIFT + PAD 9 – FADER</strong> を押します。</p>\n<h2>基本操作</h2>\n<p><strong>B3</strong> でフェーダーコントロールのオン/オフを切り替えます。</p>\n<p><strong>ENCODER</strong> を回して以下の機能を参照し、押して選択します。</p>\n<h2>Fader 機能一覧</h2>\n<ul><li><strong>Pad Volume：</strong> 選択したパッドの音量レベルを調整</li><li><strong>Pad Pan：</strong> 選択したパッドのステレオパンを調整</li><li><strong>Pad Tune：</strong> 選択したパッドの Semi Tune 値を調整</li><li><strong>Pad Amp Attack：</strong> 振幅エンベロープの Attack 値を調整</li><li><strong>Pad Amp Decay/Release：</strong> Decay または Release 値を調整</li><li><strong>Pad Filter Cutoff：</strong> フィルターの Cutoff 値を調整</li><li><strong>Kit Volume：</strong> キット全体の音量を調整</li></ul>\n<h2>ソフトテイクオーバー</h2>\n<p>コントロール切り替え時にフェーダーの位置が新しいパラメータの現在値と一致しない場合があります。Fader LED の明るさが現在のパラメータ値の相対位置を示します。LED が再度変化し始めるまでフェーダーを動かしてください。</p>\n<p><strong>B1</strong> で前のページに戻ります。</p>", "time_correct": "<h1>Time Correct（タイムコレクト）</h1>\n<p>Time Correct メニューにはプロジェクト内のイベントをクオンタイズする設定が含まれています。ノートが定義された値のグリッドにスナップします。</p>\n<p><strong>SHIFT + PAD 14 – TIME CORRECT</strong> を押して開きます。</p>\n<p><strong>PAD</strong> を押してタイミング補正するパッドを選択します。<strong>B2</strong> ですべてのパッドを同時に選択できます。</p>\n<h2>パラメータ</h2>\n<ul><li><strong>K1 ノブ – Q（Quantization）：</strong> クオンタイズ値を調整します。各バーが分割される時間分割を決定し、ノートイベントがその分割にスナップします（例：Q = 1/16 の場合、全イベントが最も近い 1/16 音符にスナップ）。</li><li><strong>K2 ノブ – Shift：</strong> 選択したイベントをシーケンス内で前後に微量調整します。「ヒューマナイズ」効果を作れます。</li><li><strong>K3 ノブ – Swing：</strong> ノートのタイミングをシフトしてビートを「シャッフル」させます。トリプレット風の感覚を持たせることができます。</li></ul>\n<h2>適用</h2>\n<p><strong>B3（Do It!）</strong> を押して Time Correct 設定を適用します。選択したパッドのすべての録音済みイベントが調整されます。</p>\n<h3>ヒント</h3>\n<p>適用前後にシーケンスを再生して違いを確認してください。満足できない場合は <strong>SHIFT + -/UNDO</strong> で元に戻せます。</p>\n<p>Q と Swing の値はグローバル設定であり、Sequence Mode でも共有されます。Swing 値は Note Repeat 機能にも影響します。</p>\n<p><strong>B1（Cancel）</strong> で設定を適用せずに終了します。</p>", "midi_configuration": "<h1>MIDI 設定（MIDI Configuration）</h1>\n<p>MPC Sample が MIDI および CV データを送受信する方法を調整します。設定とデータのリセットも行えます。</p>\n<p><strong>SHIFT + PAD 8 – MIDI CONFIG</strong> を押して開きます。</p>\n<p><strong>ENCODER</strong> でオプションをスクロールし、押して選択してから回して値を調整します。もう一度押して確定します。</p>\n<h2>設定項目</h2>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>設定</th><th>説明</th><th>値</th></tr></thead><tbody>\n<tr><td>MIDI Port</td><td>アクティブな MIDI ポート</td><td>External（背面 1/8\" MIDI）、USB</td></tr>\n<tr><td>MIDI In Channel</td><td>MIDI 入力チャンネル</td><td>All、1–16</td></tr>\n<tr><td>MIDI Out Channel</td><td>MIDI 出力チャンネル</td><td>1–16</td></tr>\n<tr><td>Pad MIDI In</td><td>MIDI 入力でパッドをトリガー</td><td>Off、On</td></tr>\n<tr><td>Pad MIDI Out</td><td>パッドから MIDI 出力を送信</td><td>Never、Always、Empty</td></tr>\n<tr><td>MIDI Sync In</td><td>MIDI Sync 情報の受信</td><td>Off、Midi Clock、MTC</td></tr>\n<tr><td>MIDI Sync Out</td><td>MIDI Sync 情報の送信</td><td>Off、Midi Clock、MTC</td></tr>\n<tr><td>MIDI Thru</td><td>MIDI OUT をスルーポートとして使用</td><td>Off、On</td></tr>\n<tr><td>Receive Program Change</td><td>プログラムチェンジの受信</td><td>Off、Sequence</td></tr>\n<tr><td>CV/Sync Out</td><td>SYNC OUT から CV/Sync を送信</td><td>Off、On</td></tr>\n<tr><td>CV/Sync Base</td><td>CV/Sync クロック解像度</td><td>1–8</td></tr>\n<tr><td>CV/Sync Division</td><td>CV/Sync Base の乗数</td><td>1–24</td></tr>\n</tbody></table></div>\n<h2>テイクオーバー設定</h2>\n<p>K1–K3 ノブと FADER の動作を調整します。</p>\n<ul><li><strong>Pickup：</strong> ハードウェア位置がパラメータ位置と一致するまで編集不可</li><li><strong>Scaled：</strong> ハードウェア調整に応じてスケーリングしてパラメータが移動</li><li><strong>Instant：</strong> ハードウェア調整時にパラメータが即座にジャンプ</li></ul>\n<h2>リセット機能</h2>\n<ul><li><strong>RESET FACTORY SETTINGS：</strong> すべての設定をリセットして再起動（B3 で「YES」、B1 で「NO」）。</li><li><strong>RESET FACTORY DATA：</strong> ユーザーコンテンツをすべて削除して再起動（⚠️ この操作は取り消せません）。</li></ul>", "project": "<h1>プロジェクト（Project）</h1>\n<p>Project メニューでは、プロジェクトの保存・読み込みと外部 microSD カードの管理が可能です。</p>\n<p><strong>SHIFT + PAD 16 – PROJECT</strong> を長押しして開きます。</p>\n<p><strong>ENCODER</strong> でオプションを参照し、押して選択します。</p>\n<h2>Load Project</h2>\n<p>プロジェクトとキットを読み込みます。</p>\n<ul><li><strong>Demos：</strong> デモプロジェクト。MPC Sample で作成可能なサウンドとスタイルを探索できます。</li><li><strong>Kits：</strong> 完全なキット。ENCODER を押してキットと 4 つのデフォルトシーケンスを読み込むか、<strong>B3（Load Kit）</strong> でキットサンプルのみを読み込みます。</li><li><strong>User：</strong> 内蔵ドライブに保存されたユーザープロジェクト。</li></ul>\n<h2>Save Project</h2>\n<p>現在のプロジェクトを保存します。</p>\n<p>ENCODER でプロジェクト名を入力します。<strong>SHIFT</strong> で大文字にアクセス、<strong>-/+</strong> で文字間を移動、<strong>B2</strong> で文字削除、<strong>SHIFT + B2</strong> で全文字削除です。</p>\n<p><strong>B3（Do It!）</strong> で保存、<strong>B1（Cancel）</strong> でキャンセルします。</p>\n<p><strong>注：</strong> MPC Sample には自動保存システムがあります。作業進行状況がバックグラウンドで保存されます。</p>\n<h2>New Project</h2>\n<p><strong>B3</strong> を押して現在のプロジェクトをクリアし、新規プロジェクトを開始します。<strong>B1</strong> でキャンセルします。</p>\n<h2>SD Card Access</h2>\n<p>microSD カードに USB 経由でコンピュータからアクセスします。サンプル・ソング・プロジェクトファイルを MPC Sample とコンピュータ間で転送できます。</p>\n<p>microSD カードはコンピュータ上の外部ドライブとしてマウントされます。このモード中は他のモードは使用できません。</p>\n<p>ファイル転送完了後、コンピュータから microSD を安全に取り出してから <strong>B1</strong> を押してモードを終了します。</p>", "technical_specifications": "<h1>技術仕様</h1>\n<h2>ハードウェアおよび入出力</h2>\n<p><strong>ストレージ</strong> 8 GB 内蔵ドライブ（工場出荷時データ約 2 GB 含む）、microSD カードスロット対応</p>\n<p><strong>メモリ</strong> 2 GB</p>\n<p><strong>パッド</strong> 16 個の RGB 照光ベロシティ感応型 MPC パッド（アフタータッチ対応）</p>\n<p><strong>ディスプレイ</strong> 2.4\"（6.1 cm）フルカラー LCD（高解像度波形編集対応）</p>\n<p><strong>入出力</strong></p>\n<ul><li>オーディオ入力：2 系統 1/4\" TRS（マイク/ラインレベル）</li><li>オーディオ出力：2 系統 1/4\" TRS（ラインレベル）</li><li>ヘッドフォン出力：1 系統 1/8\" TRS</li><li>MIDI 入出力：各 1 系統 1/8\" TRS Type A</li><li>CV/ゲート出力：1 系統 1/8\" TRS</li><li>USB Type-C（電源・オーディオ・MIDI・SD カードアクセス対応）</li></ul>\n<p><strong>マイク/スピーカー</strong> 内蔵マイク・3 ワットスピーカー搭載</p>\n<p><strong>電源</strong> USB Type-C（バスパワーまたは別売 AC アダプター/モバイルバッテリー 5V 2A）</p>\n<p><strong>バッテリー</strong> リチウムイオン型、連続再生約 5 時間</p>\n<p><strong>寸法・重量</strong> 7.6\" × 9.3\" × 2.0\"（19.4 × 23.6 × 5.0 cm） 2.03 lbs.（0.92 kg）</p>\n<h2>フォーマットとサポート</h2>\n<p><strong>ポリフォニー</strong> 32 ステレオボイス</p>\n<p><strong>録音可能データ</strong> プロジェクトあたり 16 サンプル × 8 バンク、16 シーケンス × 8 バンク（プロジェクト数無制限）</p>\n<p><strong>最大サンプリング時間</strong> サンプルあたり 20 分</p>\n<p><strong>対応フォーマット</strong> .wav, .mp3, .aif/.aiff, .snd, .s1s, .s3s, .flac, .ogg</p>\n<p><strong>処理サンプリング周波数</strong> 44.1 kHz、32-bit float</p>\n<p><strong>対応サンプリング周波数</strong> ファイル読み込み：24/16-bit、44.1/48/96 kHz 録音：24-bit、44.1 kHz</p>\n<h2>主要ソフトウェア機能</h2>\n<p><strong>シーケンサー</strong> MPC シーケンサー（リアルタイムスウィング、960 ppq）</p>\n<p><strong>サンプリング</strong> マイク・オーディオ入力・USB・リサンプル対応</p>\n<p><strong>エフェクト</strong> 4 つのエフェクトエンジン（60 以上のエフェクト）：Pad FX、Knob FX、Flex Beat、Color-Compressor</p>\n<p><strong>サンプル編集</strong> Chop モード・自動スナップ・リアルタイムループ・ワーピング対応</p>", "trademarks___licenses": "<h1>商標・ライセンス</h1>\n<h2>登録商標</h2>\n<p>Akai Professional および MPC は inMusic Brands, Inc. の商標であり、米国およびその他の国で登録されています。</p>\n<p>macOS は Apple Inc. の商標であり、米国およびその他の国で登録されています。</p>\n<p>microSD は SD-3C, LLC の登録商標です。</p>\n<p>Windows は米国およびその他の国における Microsoft Corporation の登録商標です。</p>\n<h2>その他の商標</h2>\n<p>その他すべての製品名・企業名・商標・商号は、それぞれの所有者に帰属しています。</p>"};
const JA_TITLES = {"introduction": "はじめに", "setup": "セットアップ", "firmware_updates": "ファームウェア更新", "connection_diagram": "接続ダイアグラム", "tutorial": "チュートリアル", "features": "機能説明", "operation": "操作", "sample_mode": "Sample Mode", "pad_play": "Pad Play", "loading_and_saving_samples": "サンプルのロード/セーブ", "sample_record_mode": "サンプル録音モード", "sequence_mode": "Sequence Mode", "recording_sequences": "シーケンス録音", "editing_sequences": "シーケンス編集", "step_edit": "Step Edit", "song_mode": "Song Mode", "effects": "エフェクト", "pad_fx": "Pad FX", "flex_beat": "Flex Beat", "knob_fx": "Knob FX", "compressor": "Compressor", "menus": "メニュー", "input_configuration": "入力設定", "fader": "Fader", "time_correct": "タイムコレクト", "midi_configuration": "MIDI 設定", "project": "プロジェクト", "technical_specifications": "技術仕様", "trademarks___licenses": "商標・ライセンス",

let currentLang = localStorage.getItem('mpc-lang') || 'en';

function getTitle(item) {
  return (currentLang === 'ja' && JA_TITLES[item.id]) ? JA_TITLES[item.id] : item.title;
}
function generateTipsPage(lang) {
  const tipPattern = /^(Tip[s]?:|Note:|Important:|IMPORTANT:)/i;
  const h = lang === 'ja'
    ? '<h1>Tips &amp; Notes</h1><p style="color:var(--text-muted);margin-bottom:4px;">マニュアル全体から抽出した重要な注意事項とヒントの一覧です。</p><div class="tips-list">'
    : '<h1>Tips &amp; Notes</h1><p style="color:var(--text-muted);margin-bottom:4px;">Important notes and tips collected from all manual pages.</p><div class="tips-list">';
  let items = '';
  for (const item of FLAT) {
    const content = PAGES[item.id] || '';
    const blocks = [...content.matchAll(/<table class="de-text-block[^"]*">([\s\S]*?)<\/table>/g)];
    for (const [, block] of blocks) {
      const textM = block.match(/class="de-tb-text">([\s\S]*?)<\/td>/);
      const iconM = block.match(/de-text-block-icon">([\s\S]*?)<\/span>/);
      if (!textM) continue;
      const rawText = textM[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      if (!tipPattern.test(rawText)) continue;
      if (rawText.startsWith('Important/Note/Tip:')) continue;
      const isImportant = iconM && iconM[1].codePointAt(0) === 0xf06a;
      const pageTitle = getTitle(item);
      items += `<div class="tips-item${isImportant ? ' tips-important' : ''}">` +
        `<div class="tips-badge">${isImportant ? '⚠️' : 'ℹ️'}</div>` +
        `<div class="tips-body"><div class="tips-content">${textM[1]}</div>` +
        `<a class="tips-source" onclick="navigateTo('${item.id}')">${pageTitle} →</a>` +
        `</div></div>`;
    }
  }
  return h + items + '</div>';
}
function getPageContent(id) {
  if (id === 'tips_notes') return generateTipsPage(currentLang);
  if (currentLang !== 'ja') return PAGES[id] || '<p>No content available.</p>';
  const jaHtml = PAGES_JA[id];
  if (!jaHtml) return PAGES[id] || '<p>No content available.</p>';
  const enHtml = PAGES[id] || '';
  return mergeJaImages(jaHtml, enHtml);
}
function mergeJaImages(jaHtml, enHtml) {
  const allImgs = [...enHtml.matchAll(/<img[^>]+>/g)].map(m => m[0]);
  if (allImgs.length === 0) return jaHtml;
  // h2/h3 でセクション分割
  const jaParts = jaHtml.split(/(?=<h[23])/i);
  const enParts = enHtml.split(/(?=<h[23])/i);
  if (jaParts.length <= 1) {
    return jaHtml + '<div class="en-imgs">' + allImgs.map(i => `<figure>${i}</figure>`).join('') + '</div>';
  }
  return jaParts.map((jaPart, idx) => {
    const enPart = enParts[Math.min(idx, enParts.length - 1)] || '';
    const sectionImgs = [...enPart.matchAll(/<img[^>]+>/g)].map(m => m[0]);
    if (sectionImgs.length === 0) return jaPart;
    return jaPart + '<div class="en-imgs">' + sectionImgs.map(i => `<figure>${i}</figure>`).join('') + '</div>';
  }).join('');
}
function buildSearchIndex() {
  return FLAT.map(item => {
    const raw = getPageContent(item.id);
    const text = raw.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return { id: item.id, title: getTitle(item), text };
  });
}
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('mpc-lang', lang);
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);

  searchIndex = buildSearchIndex();

}

let currentId = null;

// ── Build flat index for search ─────────────
let searchIndex = buildSearchIndex();

// ── Navigation helpers ──────────────────────
function getParents(id, nav, path) {
  for (const item of nav) {
    if (item.id === id) return [...path, item];
    if (item.children.length) {
      const found = getParents(id, item.children, [...path, item]);
      if (found) return found;
    }
  }
  return null;
}

function getNeighbors(id) {
  const idx = FLAT.findIndex(p => p.id === id);
  return {
    prev: idx > 0 ? FLAT[idx - 1] : null,
    next: idx < FLAT.length - 1 ? FLAT[idx + 1] : null,
  };
}

// ── Sidebar rendering ───────────────────────
function renderNav(items, depth, parentId) {
  return items.map(item => {
    const hasChildren = item.children && item.children.length > 0;
    const cls = depth === 0 ? 'nav-item' : depth === 1 ? 'nav-item child' : 'nav-item grandchild';
    const caret = hasChildren ? '<span class="nav-caret">&#9654;</span>' : '';
    let html = `<div class="${cls}" data-id="${item.id}" role="button" tabindex="0">${getTitle(item)}${caret}</div>`;
    if (hasChildren) {
      html += `<div class="nav-children" data-parent="${item.id}">${renderNav(item.children, depth + 1, item.id)}</div>`;
    }
    return html;
  }).join('');
}

function initSidebar() {
  document.getElementById('sidebarInner').innerHTML = renderNav(NAV, 0, null);

  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => navigateTo(el.dataset.id));
    el.addEventListener('keydown', e => { if (e.key === 'Enter') navigateTo(el.dataset.id); });
  });
}

function updateSidebarActive(id) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.remove('active', 'open');
  });
  document.querySelectorAll('.nav-children').forEach(el => el.classList.remove('open'));

  const active = document.querySelector(`.nav-item[data-id="${id}"]`);
  if (active) {
    active.classList.add('active');
    // Expand parent groups
    const parents = getParents(id, NAV, []);
    if (parents) {
      parents.forEach(p => {
        const el = document.querySelector(`.nav-item[data-id="${p.id}"]`);
        if (el) el.classList.add('open');
        const ch = document.querySelector(`.nav-children[data-parent="${p.id}"]`);
        if (ch) ch.classList.add('open');
      });
    }
    // Scroll into view in sidebar
    setTimeout(() => {
      active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }, 100);
  }
}

function navigateTo(id, pushState) {
  if (!id || (!PAGES[id] && id !== 'tips_notes')) return;
  currentId = id;

  // Update URL hash
  if (pushState !== false) {
    history.pushState({ id }, '', '#' + id);
  }

  // Scroll content to top
  document.getElementById('contentArea').scrollTo(0, 0);

  // Update sidebar
  updateSidebarActive(id);

  // Close mobile sidebar
  closeSidebar();

  // Render breadcrumb
  const parents = getParents(id, NAV, []) || [];
  const crumbEl = document.getElementById('breadcrumb');
  if (parents.length > 1) {
    crumbEl.innerHTML = parents.slice(0, -1).map(p =>
      `<a onclick="navigateTo('${p.id}')">${getTitle(p)}</a><span>/</span>`
    ).join('') + `<span>${getTitle(parents[parents.length - 1])}</span>`;
  } else {
    crumbEl.innerHTML = '';
  }

  // Render content
  document.getElementById('pageContent').innerHTML = getPageContent(id);


  // Homepage onboarding tip
  if (id === 'introduction') {
    const tipHtml = currentLang === 'ja' ? `
      <div class="onboarding-tip">
        <div class="tip-icon">💡</div>
        <div class="tip-body">
          <h3>やりたいことから素早く調べる</h3>

          <button class="tip-cta" onclick="openUseCase()">💡 やりたいことから探す</button>
        </div>
      </div>` : `
      <div class="onboarding-tip">
        <div class="tip-icon">💡</div>
        <div class="tip-body">
          <h3>Find pages by what you want to do</h3>
          <p>Tap the <strong>💡 button</strong> in the header to browse 48 use-case scenarios — "want to record a beat", "add reverb", "set BPM" — and jump directly to the right page. You can also search by keyword.</p>
          <button class="tip-cta" onclick="openUseCase()">💡 Find by use case</button>
        </div>
      </div>`;
    const tipEl = document.createElement('div');
    tipEl.innerHTML = tipHtml;
    document.getElementById('pageContent').prepend(tipEl.firstElementChild);
  }

  // Callout: de-text-block テーブルを div に置き換える
  document.querySelectorAll('#pageContent .de-text-block').forEach(table => {
    const iconEl = table.querySelector('.de-text-block-icon');
    const textEl = table.querySelector('.de-tb-text');
    if (!textEl) return;
    const isImportant = iconEl && iconEl.textContent.codePointAt(0) === 0xf06a;
    const box = document.createElement('div');
    box.className = 'callout-box' + (isImportant ? ' callout-important' : '');
    box.innerHTML = '<span class="callout-icon">' + (isImportant ? '⚠️' : 'ℹ️') + '</span>'
      + '<div class="callout-text">' + textEl.innerHTML + '</div>';
    table.closest('.table-wrap')
      ? table.closest('.table-wrap').replaceWith(box)
      : table.replaceWith(box);
  });

  // テーブルをスクロール可能なラッパーで囲む（モバイル対応・calloutは除外）
  document.querySelectorAll('#pageContent table').forEach(t => {
    if (t.closest('.table-wrap')) return;
    if (t.classList.contains('de-text-block')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
    t.removeAttribute('style');
  });

  // 内部リンクのクリックハンドラ
  document.querySelectorAll('#pageContent [data-page]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = a.dataset.page;
      const matched = FLAT.find(p => p.url === target || p.id === target);
      if (matched) navigateTo(matched.id);
    });
  });

  // Render prev/next navigation
  const { prev, next } = getNeighbors(id);
  const navEl = document.getElementById('pageNav');
  navEl.innerHTML = `
    <button class="page-nav-btn prev" ${!prev ? 'disabled' : ''} onclick="navigateTo('${prev?.id}')">
      ${prev ? `<div class="nav-label">${currentLang==='ja'?'前のページ':'Previous'}</div><div class="nav-title">${getTitle(prev)}</div>` : '—'}
    </button>
    <button class="page-nav-btn next" ${!next ? 'disabled' : ''} onclick="navigateTo('${next?.id}')">
      ${next ? `<div class="nav-label">${currentLang==='ja'?'次のページ':'Next'}</div><div class="nav-title">${getTitle(next)}</div>` : '—'}
    </button>
  `;
}

let searchTimer = null;
function openSearch() {
  document.getElementById('searchOverlay').classList.add('active');
  document.getElementById('searchInput').focus();
}
function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('active');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
}
function doSearch(q) {
  const el = document.getElementById('searchResults');
  if (!q || q.length < 2) { el.innerHTML = ''; return; }
  const results = [];
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  for (const item of searchIndex) {
    const ti = item.title.match(re);
    const tx = item.text.match(re);
    if (!ti && !tx) continue;
    // Find excerpt
    let excerpt = '';
    const pos = item.text.search(re);
    if (pos >= 0) {
      const start = Math.max(0, pos - 60);
      const end = Math.min(item.text.length, pos + 120);
      excerpt = (start > 0 ? '…' : '') + item.text.slice(start, end).replace(re, m => `<mark>${m}</mark>`) + (end < item.text.length ? '…' : '');
    }
    const titleHl = item.title.replace(re, m => `<mark>${m}</mark>`);
    results.push({ item, titleHl, excerpt, score: ti ? 2 : 1 });
    if (results.length >= 12) break;
  }
  if (!results.length) {
    el.innerHTML = '<div class="search-empty">No results found.</div>';
    return;
  }
  el.innerHTML = results.map(r => `
    <div class="search-result" data-id="${r.item.id}">
      <div class="search-result-title">${r.titleHl}</div>
      ${r.excerpt ? `<div class="search-result-excerpt">${r.excerpt}</div>` : ''}
    </div>
  `).join('');
  el.querySelectorAll('.search-result').forEach(el => {
    el.addEventListener('click', () => {
      navigateTo(el.dataset.id);
      closeSearch();
    });
  });
}

// ── 逆引き 関数 ────────────────────────────
function openUseCase() {
  document.getElementById('ucOverlay').classList.add('active');
  const input = document.getElementById('ucSearch');
  input.value = '';
  renderUseCases('');
  setTimeout(() => input.focus(), 50);
}
function closeUseCase() {
  document.getElementById('ucOverlay').classList.remove('active');
}
function renderUseCases(query) {
  const body = document.getElementById('ucBody');
  const q = query.toLowerCase().trim();
  let html = '';
  let total = 0;

  for (const cat of USE_CASES) {
    const items = cat.items.filter(item =>
      !q ||
      item.label.toLowerCase().includes(q) ||
      item.tags.some(t => t.toLowerCase().includes(q))
    );
    if (!items.length) continue;
    total += items.length;

    if (!q) {
      html += `<div class="uc-category">
        <div class="uc-cat-title"><span>${cat.emoji}</span>${cat.category}</div>
        <div class="uc-items">`;
    } else {
      html += `<div class="uc-category"><div class="uc-items">`;
    }

    for (const item of items) {
      const pageLinks = item.pages.map(pid => {
        const p = FLAT.find(f => f.id === pid);
        return p ? `<button class="uc-page-btn" data-id="${pid}">${p.title}</button>` : '';
      }).join('');
      const labelHl = q
        ? item.label.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`)
        : item.label;
      html += `<div class="uc-item">
        <div class="uc-item-hd">
          <span class="uc-item-dot"></span>
          <span class="uc-item-label">${labelHl}</span>
          <span class="uc-item-arrow">▶</span>
        </div>
        <div class="uc-pages">${pageLinks}</div>
      </div>`;
    }
    html += `</div></div>`;
  }

  if (!total) {
    html = `<div class="uc-empty">「${q}」に一致する使い方が見つかりませんでした。<br>別のキーワードをお試しください。</div>`;
  } else if (!q) {
    html = `<div class="uc-hint">💡 やりたいことをタップすると、関連ページへのリンクが表示されます。</div>` + html;
  }

  body.innerHTML = html;

  body.querySelectorAll('.uc-item-hd').forEach(hd => {
    hd.addEventListener('click', () => hd.closest('.uc-item').classList.toggle('open'));
  });
  body.querySelectorAll('.uc-page-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      navigateTo(btn.dataset.id);
      closeUseCase();
    });
  });

  // 検索時は全て展開
  if (q) {
    body.querySelectorAll('.uc-item').forEach(el => el.classList.add('open'));
  }
}

// ── Events ──────────────────────────────────
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
});
document.getElementById('overlay').addEventListener('click', closeSidebar);
document.getElementById('ucBtn').addEventListener('click', openUseCase);
document.getElementById('ucClose').addEventListener('click', closeUseCase);
document.getElementById('ucSearch').addEventListener('input', e => renderUseCases(e.target.value));
document.getElementById('ucOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeUseCase(); });
document.getElementById('searchBtn').addEventListener('click', openSearch);
document.getElementById('searchClose').addEventListener('click', closeSearch);
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(e.target.value.trim()), 200);
});
document.getElementById('searchOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeSearch();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); openSearch();
  }
  if (e.key === 'u' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); openUseCase();
  }
  if (e.key === 'Escape') { closeSearch(); closeUseCase(); }
  if (e.key === 'ArrowLeft' && !e.ctrlKey) {
    const { prev } = getNeighbors(currentId);
    if (prev) navigateTo(prev.id);
  }
  if (e.key === 'ArrowRight' && !e.ctrlKey) {
    const { next } = getNeighbors(currentId);
    if (next) navigateTo(next.id);
  }
});

// Browser back/forward
window.addEventListener('popstate', e => {
  if (e.state?.id) navigateTo(e.state.id, false);
});

// ── Init ─────────────────────────────────────
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.lang === currentLang);
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});
initSidebar();
const initId = location.hash.slice(1) || FLAT[0]?.id;
navigateTo(initId, false);
history.replaceState({ id: initId }, '', '#' + initId);
</script>
