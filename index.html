needs to be connected to power immediately.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_3\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"3\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_3_2.png\"/></a></span><div class=\"ic\"><h3>Charging Icon</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"3. Charging Icon\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_3_2.png\"/></span></div>\n<div class=\"p de_D8C83D7059\"><span class=\"de_68B99ACC5C\">This icon shows the current battery life of MPC Sample. If this icon is green, the battery has between 100% and 30% charge. If the icon is amber, the battery has between 29% and 15% charge. If the icon is red, the battery has between 14% and 5% charge. If the battery is blinking red, the battery has less than 5% charge and needs to be connected to power immediately. </span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_4\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"4\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_4_2.png\"/></a></span><div class=\"ic\"><h3>MAIN VOLUME</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"4. MAIN VOLUME\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_4_2.png\"/></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">Turn this knob to adjust the audio output level. This applies to the built-in <strong>SPEAKER</strong> as well as audio to the <strong>PHONES</strong> and <strong>AUDIO OUT</strong> connections on the rear panel.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_5\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"5\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_5_2.png\"/></a></span><div class=\"ic\"><h3>Meters</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"5. Meters\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_5_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_5_2.png\" data-full-width=\"38\" data-full-height=\"140\" /></span></div>\n<div class=\"p de_D8C83D7059\"><span class=\"de_68B99ACC5C\">These meters display the main output volume level, or the input source level when recording a sample. If the meter consistently lights up in the red during playback, adjust the volume of your samples. If the meter consistently light up in the red while recording, reduce the volume of your audio input source directly, or by turning down the <strong>REC GAIN</strong> knob for audio connected to the <strong>AUDIO IN</strong> connection on the rear panel.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_6\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"6\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_6_2.png\"/></a></span><div class=\"ic\"><h3>Speaker</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"6. Speaker\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_6_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_6_2.png\" data-full-width=\"134\" data-full-height=\"134\" /></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">This built-in speaker plays audio when nothing is connected to the <strong>PHONES</strong> or <strong>AUDIO OUT </strong>connections on the rear panel. Adjust the volume of the speaker by turning the <strong>MAIN VOLUME</strong> knob.</span></div>\n<div class=\"p Note_Tip de_D8C83D7059\"><table class=\"de-text-block de-text-block-custom-6488f07e-4719-432c-aa40-f80bfbe5fe06\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf06a;</span></td><td class=\"de-tb-text\"><div class=\"p Note_Tip de_F9165B2CF3\"><span class=\"Note_Tip\"><span class=\"de_2A01A3395F\"><strong>Important: </strong>When recording using the built-in Microphone, the speaker is automatically deactivated to prevent feedback.</span></span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_7\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"7\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_7_2.png\"/></a></span><div class=\"ic\"><h3>Microphone</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"7. Microphone\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_7_2.png\"/></span></div>\n<div class=\"p de_D8C83D7059\"><span class=\"de_68B99ACC5C\">This built-in condenser microphone allows you to easily sample anything. For more information on recording samples and adjusting the microphone settings, see the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sample_record_mode.htm\"><span class=\"de_AE3423201B\"><strong>Sample Record Mode</strong></span></a><span class=\"de_1142CCE897\"><strong> </strong></span><span class=\"de_68B99ACC5C\">chapter.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_8\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"8\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_8_2.png\"/></a></span><div class=\"ic\"><h3>SHIFT</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"8. SHIFT\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_8_2.png\"/></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">This button provides access to secondary functions on MPC Sample. Press and hold it and then press another button or pad to access its secondary function. These are printed below the selected control, and are </span><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\">highlighted</span></span><span class=\"de_68B99ACC5C\"> in the descriptions below.</span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">When viewing parameters and menus on the <strong>Display</strong>, if the <strong>Shift icon</strong> ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_custom_2.png\"/> ) is visible you can press and hold this button to access additional parameters for control using the <strong>K1–K3</strong> Knobs or <strong>B1–B3 </strong>Function Buttons.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_9\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"9\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_9_2.png\"/></a></span><div class=\"ic\"><h3>Encoder</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"9. Encoder\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_9_2.png\"/></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">Turn this knob to navigate menus, adjust settings, and more, depending on the current mode. </span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_10\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"10\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_10.png\"/></a></span><div class=\"ic\"><h3>-/+</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"10. -/+\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_10.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_10.png\" data-full-width=\"133\" data-full-height=\"47\" /></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">Press these buttons to decrease (-) or increase (+) the selected parameter, or move down (<strong>-</strong>) or up (<strong>+</strong>) in the current list.</span></div>\n<div class=\"p de_3308280385\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_F9165B2CF3\"><span class=\"de_68B99ACC5C\"><strong>Undo/Redo: </strong>Press and hold <strong>SHIFT</strong> and press these buttons to undo the last action (<strong>-</strong>) or redo the last action you undid (<strong>+</strong>).</span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_11\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"11\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_11.png\"/></a></span><div class=\"ic\"><h3>B1, B2, B3 Function Buttons</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"11. B1, B2, B3 Function Buttons\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_11.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_11.png\" data-full-width=\"172\" data-full-height=\"28\" /></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">Press these buttons above the display to cycle between pages on the display or enable certain functions.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_12\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"12\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_12.png\"/></a></span><div class=\"ic\"><h3>K1, K2, K3 Knobs</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"12. K1, K2, K3 Knobs\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_12.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_12.png\" data-full-width=\"351\" data-full-height=\"88\" /></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">Turn these knobs to adjust various settings and parameters as shown on the display. </span></div>\n<div class=\"p de_3308280385\"><table class=\"de-text-block de-text-block-custom-6488f07e-4719-432c-aa40-f80bfbe5fe06\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf06a;</span></td><td class=\"de-tb-text\"><div class=\"p Note_Tip de_60576EC445\"><span class=\"Note_Tip\"><span class=\"de_68B99ACC5C\"><strong>Important: </strong>These knobs have absolute position only. This means that as you are moving between banks of controls, the knob’s position may not align with the current setting of the parameter in that bank. When this happens, an arrow will appear to the left or right of the parameter name, pointing in that direction. Turn the knob in the direction shown until the parameter becomes selected and the arrow disappears. You will now be able to regain control of the selected parameter using the knob. </span></span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_13\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"13\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_13.png\"/></a></span><div class=\"ic\"><h3>Fader</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"13. Fader\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_13.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_13.png\" data-full-width=\"82\" data-full-height=\"196\" /></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">The fader can be used to adjust various pad and kit parameters. By default, the fader adjusts pad volume. </span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">Press and hold <strong>SHIFT</strong> and press <strong>PAD 9 – FADER</strong> to select a different parameter to control. See </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"fader.htm\"><span class=\"de_AE3423201B\"><strong>Menus &gt; Fader</strong></span></a><span class=\"de_68B99ACC5C\"> for more information.</span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">While in </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"step_edit.htm\"><span class=\"de_AE3423201B\"><strong>Step Edit </strong></span></a><span class=\"de_68B99ACC5C\">mode, you can also use the fader to adjust event timing. </span></div>\n<div class=\"p de_3308280385\"><table class=\"de-text-block de-text-block-custom-6488f07e-4719-432c-aa40-f80bfbe5fe06\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf06a;</span></td><td class=\"de-tb-text\"><div class=\"p Note_Tip de_60576EC445\"><span class=\"Note_Tip\"><span class=\"de_68B99ACC5C\"><strong>Important: </strong>Like the knobs, the fader has absolute position only. This means that as you are moving between different controls, the fader’s position may not align with the current setting of the new parameter. The brightness of the Fader LED indicates the relative position of the current parameter value. The brighter the LED, the higher the value. Move the fader until the LED begins changing brightness again, indicating the fader has regained control of the current parameter value. </span></span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_14\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"14\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_14.png\"/></a></span><div class=\"ic\"><h3>ERASE</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"14. ERASE\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_14.png\"/></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">This button is used to erase samples, sequences, events, and automation. </span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">To erase a sample from a pad, stop playback in </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sample_mode.htm\"><span class=\"de_AE3423201B\"><strong>Sample Mode</strong></span></a><span class=\"de_68B99ACC5C\">, then press and hold this button and press a pad. If playback is active, press and hold this button and then press and hold a pad to erase note events from that pad on the current sequence. While in </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"step_edit.htm\"><span class=\"de_AE3423201B\"><strong>Step Edit </strong></span></a><span class=\"de_68B99ACC5C\">Mode, you can also press and hold this button and then press a pad to erase all events from that pad. </span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">To erase a sequence, press and hold this button and then press a pad in </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sequence_mode.htm\"><span class=\"de_AE3423201B\"><strong>Sequence Mode</strong></span></a><span class=\"de_68B99ACC5C\">.</span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">To erase automation, select the pad that contains the automation you want to erase. Then, press and hold this button and move the K1–K3 Knob for the parameter with recorded automation. If the <strong>FADER</strong> is set to control a parameter with automation, you can also move the <strong>FADER</strong> while holding <strong>ERASE</strong>. A menu will appear on the display for confirmation. Press the <strong>B3</strong> Function Button to continue, or press the <strong>B1</strong> Function button to cancel.</span></div>\n<div class=\"p de_3308280385\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_F9165B2CF3\"><span class=\"de_68B99ACC5C\"><strong>COPY: </strong>Press and hold <strong>SHIFT</strong> and press this button to initiate the copy process for samples and sequences. The currently selected pad determines the sample or sequence that is being copied. While still holding <strong>SHIFT</strong> and <strong>COPY</strong>, press a pad or pads to select the destination(s) for the copied sample or sequence. Selected pads turn red, and can be pressed again to deselect. Finally, release <strong>SHIFT</strong> and <strong>COPY</strong> to complete the copy process for the sample or sequence. </span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_15\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"15\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_15.png\"/></a></span><div class=\"ic\"><h3>NOTE REPEAT</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"15. NOTE REPEAT\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_15.png\"/></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">Press this button to engage Note Repeat mode. When enabled, pressing a pad will cause it to sound repeatedly at the set time division. Use the B1–B3 Function Buttons to set the current division.</span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">You can also press and hold this button to temporarily engage Note Repeat. Release the button to disengage Note Repeat. </span></div>\n<div class=\"p de_3308280385\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_F9165B2CF3\"><span class=\"de_68B99ACC5C\"><strong>TRIPLET:</strong> While Note Repeat is engaged, press and hold <strong>SHIFT</strong> to display triplet time divisions for selection using the <strong>B1</strong>–<strong>B3</strong> Function Buttons.</span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_16\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"16\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_16.png\"/></a></span><div class=\"ic\"><h3>PAD BANK</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"16. PAD BANK\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_16.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to cycle between pad banks A–H. You can also press and hold this button and press <strong>PADS 1–8</strong> to jump directly to a bank. The current bank is shown on the top panel next to the <strong>MAIN VOLUME</strong> control.</span></div>\n<div class=\"p de_22F4A2F3E0\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press this button to move to the previous pad bank.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_17\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"17\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_17.png\"/></a></span><div class=\"ic\"><h3>SAMPLE SELECT</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"17. SAMPLE SELECT\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_17.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to open the sample browser, where you can browse and select a sample to add to the current pad from the internal drive or a connected microSD card (not included).</span></div>\n<div class=\"p Shift_Function de_D8C83D7059\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p Shift_Function de_7A8C25B212\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>SAVE SAMPLE:</strong> Press and hold <strong>SHIFT</strong> and press this button to save the currently selected sample. See </span></span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"loading_and_saving_samples.htm\"><span class=\"Document_Link\"><span class=\"de_2BBD9D8CED\"><strong>Loading and Saving Samples</strong></span></span></a><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"> for more information.</span></span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_18\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"18\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_18.png\"/></a></span><div class=\"ic\"><h3>TAP TEMPO</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"18. TAP TEMPO\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_18.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">&#160;Press this button at a regular interval to set a new project tempo. You can also press and hold this button in any mode and use the <strong>ENCODER</strong> to adjust the project tempo from the BPM pop-up. </span></div>\n<div class=\"p Shift_Function de_D8C83D7059\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p Shift_Function de_7A8C25B212\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>METRO:</strong> Press and hold <strong>SHIFT </strong>and press this button to cycle the metronome (or “click”) between its three states: Off (the metronome does not play), On (the metronome always plays during playback and recording), or Record (the metronome only plays during recording).</span></span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_19\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"19\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_19.png\"/></a></span><div class=\"ic\"><h3>Pads</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"19. Pads\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_19.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_19.png\" data-full-width=\"348\" data-full-height=\"358\" /></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">These 16 velocity-sensitive pads with poly-aftertouch are used to trigger samples and sequences, and perform other functions. See the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"operation.htm\"><span class=\"de_B84CA4D200\"><strong>Operation</strong></span></a><span class=\"de_CC7DAF531E\"> chapter to learn more about using the pads in each mode. </span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p Shift_Function de_03FDC443AD\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>SHIFT FUNCTIONS:</strong> Press and hold <strong>SHIFT</strong> and press each pad to perform the additional function printed below the pad.</span></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0;\">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 1 – FULL LEVEL:</strong> Sets all pads to play at full velocity, no matter how soft or hard they are struck. </span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 2 – HALF SEQ:</strong> Cuts the current sequence length in half.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 3 – DOUBLE SEQ:</strong> Doubles the length of the current sequence, duplicating all recorded events.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 4 – COUNT-IN:</strong> Activates or deactivates the count-in, which gives you a one-bar introduction prior to recording a sequence. </span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 5 – COMPRESSOR:</strong> Opens the Compressor menu, where you can apply the compressor effect and adjust its parameters.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 6 – HALF SPEED:</strong> Makes the events of the current sequence play back at half the speed, taking twice as much space in the sequence. </span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 7 – DOUBLE SPEED:</strong> Makes the events of the current sequence play back at twice the speed, taking half as much space in the sequence. </span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 8 – MIDI CONFIG: </strong>Opens the MIDI Configuration menu, where you can adjust device settings for MIDI and CV, as well as reset MPC Sample. </span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 9 – FADER: </strong>Opens the Fader menu, where you can select the active fader parameter, or deactivate it entirely.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 10 – REC QUANTIZE: </strong>Activates or deactivates record quantization, causing all events you record to snap to the grid based on the current quantization setting. You can adjust the quantize value in the Timing Correct or Sequence Mode pages.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 11 – RESAMPLE:</strong> Automatically resamples all audio from the current sequence and adds it as a new sample to the chosen pad.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 12 – SONG:</strong> Opens the Song Mode page, where you can combine your sequences into a song and export it to a new audio file or a new sequence.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 13 – TRIM SAMPLE:</strong> Trims the sample on the selected pad, removing any content before the Start point and after the End point.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 14 – TIME CORRECT:</strong> Opens the Timing Correct menu, where you can adjust the timing and quantization settings for pads in your project.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 15 – WARP:</strong> Toggles the current Warp mode between Time Stretch and Pitch. When set to Time Stretch, adjusting the Warp value changes the length (and tempo) of the sample, but keeps the pitch the same. When set to Pitch, adjusting the Warp values changes the length (and tempo) of the sample as well as adjusting the pitch.</span></span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p Shift_Function de_C05CA3A6D7\"><span class=\"Shift_Function\"><span class=\"de_FC32566F1B\"><strong>PAD 16 – PROJECT:</strong> Opens the Project page, where you can load, save, or start a new project. You can also access the internal microSD Card Storage from this menu when connected to a computer.</span></span></div>\n</li></ul></td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n\n<div class=\"p h3\"><h3><span class=\"de_68B99ACC5C\">Mode</span></h3></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\">The buttons in this section determine the current function mode of MPC Sample. You can learn more about these pages and functions in the</span><span class=\"de_111311456D\"><strong> </strong></span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"operation.htm\"><span class=\"de_B84CA4D200\"><strong>Operation</strong></span></a><span class=\"de_111311456D\"><strong> </strong></span><span class=\"de_CC7DAF531E\">chapter.</span></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_20\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"20\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_20.png\"/></a></span><div class=\"ic\"><h3>SAMPLE</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"20. SAMPLE\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_20.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to open </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sample_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sample Mode</strong></span></a><span class=\"de_CC7DAF531E\">. Here, you can trigger your samples, view and edit their parameters, and more. </span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_CC7DAF531E\"><strong>INPUT CONFIG:</strong> Press and hold <strong>SHIFT</strong> and press this button to enter the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"input_configuration.htm\"><span class=\"de_B84CA4D200\"><strong>Input Configuration</strong></span></a><span class=\"de_CC7DAF531E\"> menu, where you can select and adjust audio input sources.</span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_21\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"21\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_21.png\"/></a></span><div class=\"ic\"><h3>SEQ</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"21. SEQ\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_21.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to enter </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sequence_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sequence Mode</strong></span></a><span class=\"de_CC7DAF531E\">, where you can record and edit sequences of note events.</span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_CC7DAF531E\"><strong>STEP EDIT:</strong> Press and hold <strong>SHIFT</strong> and press this button to enter the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"step_edit.htm\"><span class=\"de_B84CA4D200\"><strong>Step Edit</strong></span></a><span class=\"de_CC7DAF531E\"> menu, where you can view and adjust individual events in your sequence per step.</span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_22\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"22\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_22.png\"/></a></span><div class=\"ic\"><h3>PAD FX</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"22. PAD FX\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_22.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to activate </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"pad_fx.htm\"><span class=\"de_B84CA4D200\"><strong>Pad FX</strong></span></a><span class=\"de_CC7DAF531E\"> mode, where you can use the pads to trigger effects that are applied to your entire sequence. </span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_CC7DAF531E\"><strong>FLEX BEAT:</strong> Press and hold <strong>SHIFT</strong> and press this button to enter </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"flex_beat.htm\"><span class=\"de_B84CA4D200\"><strong>Flex Beat</strong></span><span class=\"de_A6784F7BA8\"> </span></a><span class=\"de_CC7DAF531E\">FX mode. In this mode, the pads trigger time-based effects that warp the pitch, time, and volume of your sequence for beat chops, DJ-style scratches, and trance gate effects.</span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_23\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"23\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_23.png\"/></a></span><div class=\"ic\"><h3>KNOB FX</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"23. KNOB FX\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_23.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to activate </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"knob_fx.htm\"><span class=\"de_B84CA4D200\"><strong>Knob FX</strong></span><span class=\"de_A6784F7BA8\"> </span></a><span class=\"de_CC7DAF531E\">mode, where you can use the <strong>K1–K3 KNOBS</strong> to adjust effects applied to specific pads, freeing your pads for other uses. </span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_CC7DAF531E\"><strong>FX SELECT:</strong> Press and hold <strong>SHIFT</strong> and press this button to open the Knob FX selection menu, where you can select the active Knob FX and select the pads to which Knob FX is applied. </span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n\n<div class=\"p h3\"><h3><span class=\"de_68B99ACC5C\">Pad Play</span></h3></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">The buttons in this section determine the functionality of the pads while in </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sample_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sample Mode</strong></span></a><span class=\"de_CC7DAF531E\">. You can learn more about these functions in the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"pad_play.htm\"><span class=\"de_B84CA4D200\"><strong>Pad Play</strong></span></a><span class=\"de_97985A090F\"><strong> </strong></span><span class=\"de_CC7DAF531E\">chapter.</span></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_24\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"24\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_24.png\"/></a></span><div class=\"ic\"><h3>CHOP</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"24. CHOP\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_24.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to activate Chop Mode. When activated, the sample on the selected pad is automatically chopped by the selected chop type (Threshold by default), and the pads are assigned to trigger each available slice. </span></div>\n<div class=\"p de_22F4A2F3E0\"><span class=\"de_CC7DAF531E\">To return to Trim Mode, press the <strong>CHOP</strong> button again.</span></div>\n<div class=\"p de_22F4A2F3E0\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_CC7DAF531E\"><strong>NOTE ON:</strong> Press and hold <strong>SHIFT</strong> and press this button to set the current pad to <strong>NOTE ON</strong> mode. In this mode, pad playback occurs only while the pad is held down. <strong>NOTE ON</strong> mode is indicated on the Sample page by the note icon ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_custom_3.png\"/> ).</span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_25\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"25\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_25.png\"/></a></span><div class=\"ic\"><h3>LOOP</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"25. LOOP\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_25.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\"><strong>LOOP:</strong> Press this button to activate loop playback for the current pad. While activated, triggering the pad initiates the loop, which plays between the Loop Start Point (set using the <strong>K3 </strong>Knob while Loop Mode is active) and the Sample End Point. Loop mode is indicated on the Sample page by the loop icon ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_custom_4.png\"/> ).</span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_CC7DAF531E\"><strong>REVERSE:</strong> Press and hold <strong>SHIFT</strong> and press this button to activate reverse playback for the current pad. While activated, triggering the pad starts sample playback from the Sample End Point and moves backwards to the Sample Start Point (or Loop Start Point, if Loop playback is active). Reverse mode is indicated on the Sample page by the arrow icon ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_custom_5.png\"/> ).</span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_26\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"26\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_26.png\"/></a></span><div class=\"ic\"><h3>MUTE</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"26. MUTE\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_26.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to activate Mute mode for the pads in Sample Mode. While activated, press a pad to mute it, which prevents its sound from being heard during playback, but does not remove any recorded events from the sequence. Muted pads are lit red, while unmuted pads are lit yellow. </span></div>\n<div class=\"p de_22F4A2F3E0\"><span class=\"de_CC7DAF531E\">You can also press and hold this button to temporarily engage Mute mode. Release the button to disengage.</span></div>\n<div class=\"p de_22F4A2F3E0\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_CC7DAF531E\"><strong>UNMUTE ALL:</strong> Press and hold <strong>SHIFT</strong> and press this button to unmute all muted pads. </span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_27\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"27\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_27.png\"/></a></span><div class=\"ic\"><h3>16 LEVELS</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"27. 16 LEVELS\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_27.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to activate 16 Levels mode for the pads. While activated, the currently selected sample is copied across all 16 pads, with the selected 16 Levels <strong>TYPE</strong> determining how the sample changes across the 16 pads. 16 Levels mode is indicated on the Sample page by the 16 icon ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_custom_6.png\"/> ).</span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>TYPE:</strong> Press and hold <strong>SHIFT</strong> and press this button to select the 16 Levels type:</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-1;\">\n<div class=\"p de_FF1EFA3B44\"><span class=\"de_CC7DAF531E\"><strong>Velocity:</strong> The sample increases in velocity across the 16 pads.</span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_FF1EFA3B44\"><span class=\"de_CC7DAF531E\"><strong>Filter:</strong> The filter cutoff point of the currently selected filter type is adjusted across the 16 pads. Pads 1–8 increase the cutoff from the minimum point to the current <strong>Cutoff</strong> value. Pads 9–16 increase the cutoff from the current value to the maximum point. Depending on the current <strong>Cutoff</strong> value, the range of available value adjustment may be limited. The <strong>Cutoff</strong> value can be adjusted using the <strong>Filter</strong> functions in </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sample_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sample Mode</strong></span></a><span class=\"de_CC7DAF531E\">.</span></div>\n</li><li class=\"list-element list-counter-3c1b9a3d-0dee-43ac-af9b-7049e06a8205-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_FF1EFA3B44\"><span class=\"de_CC7DAF531E\"><strong>Tune:</strong> The pitch of the sample is adjusted across the 16 pads. The sample at its original pitch is placed on PAD 4, with pads below this lowering in pitch and pads above this increasing in pitch.</span></div>\n</li></ul></td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_28\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"28\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_28.png\"/></a></span><div class=\"ic\"><h3>SAMPLE RECORD</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"28. SAMPLE RECORD\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_28.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to enter Sample Record mode. In this mode, you can record audio from connected sources to create your own samples. See the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sample_record_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sample Record Mode</strong></span></a><span class=\"de_CC7DAF531E\"> chapter for more information.</span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_CC7DAF531E\"><strong>RECALL:</strong> Press and hold <strong>SHIFT</strong> and press this button to retrieve the last 25 seconds of audio input from the currently selected input source into the next available pad. </span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_29\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"29\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_29.png\"/></a></span><div class=\"ic\"><h3>SEQ RECORD</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"29. SEQ RECORD\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_29.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to enter Sequence Record mode. See the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sequence_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sequence Mode</strong></span></a><span class=\"de_CC7DAF531E\"> chapter for more information.</span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_CC7DAF531E\"><strong>RECALL:</strong> Press and hold <strong>SHIFT</strong> and press this button to retrieve events played during the last loop of sequence playback into the sequence. </span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_30\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"30\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_30.png\"/></a></span><div class=\"ic\"><h3>PLAY</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"30. PLAY\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_30.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to start playback or recording from the beginning of the sequence. </span></div>\n<div class=\"p de_0FD9383742\"><table class=\"de-text-block de-text-block-custom-13f6936c-fdd9-47cf-ae9c-ce72325c68dd\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf176;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_CC7DAF531E\"><strong>CONTINUE:</strong> Press and hold <strong>SHIFT</strong> and press this button to start playback from the current playhead position. </span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_31\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"31\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_31.png\"/></a></span><div class=\"ic\"><h3>STOP</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"31. STOP\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_31.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Press this button to stop playback or recording. </span></div>\n<div class=\"p de_22F4A2F3E0\"><span class=\"de_CC7DAF531E\">Quickly double-press this button to stop all audio.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p de_6AF6DD6F29\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_6AF6DD6F29\"><span class=\"de_C4517954D8\"><strong>Tip:</strong> The buttons’ LED states provide additional information on what functions are active, available, or unavailable.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_C4517954D8\">If a function is currently active, the associated button is brightly lit. For example, when you are in Sample Mode, the <strong>SAMPLE</strong> button is brightly lit. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_C4517954D8\">If a button is available to be used but not active, it is dimly lit. If a button is not available to be used, the LED is completely off. For example, if you are in Sequence Mode, you cannot access the Chop or 16 Levels functions, so those buttons’ LEDs are off.</span></div>\n<div class=\"p de_96C81F178C\"><span class=\"de_C4517954D8\">When you press and hold <strong>SHIFT</strong>, buttons that have available secondary functions are dimly lit in red if they are inactive, or brightly lit in red if they are active. For example, if you are in Knob FX Select Mode, the button is brightly lit in red. This will remain brightly lit in red as long as you are in this mode, whether or not you are holding <strong>SHIFT</strong>. </span></div>\n</td></tr></table></div>\n</div>", "operation": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Operation</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">This chapter describes MPC Sample’s different modes, functions, and menus.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">For more information on specific controls or connections, refer to the previous </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"features.htm\"><span class=\"de_B84CA4D200\"><strong>Features</strong></span></a><span class=\"de_97985A090F\"><strong> </strong></span><span class=\"de_CC7DAF531E\">chapter.</span></div>\n\n\n</div>", "sample_mode": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Sample Mode</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Sample Mode is the “main” mode of MPC Sample, where you can trigger your samples, view and edit their parameters, and more.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To open Sample Mode, press the <strong>SAMPLE</strong> button. </span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_2.png\" data-full-width=\"328\" data-full-height=\"248\" /></span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press a <strong>PAD</strong> to trigger it and view its sample on the display.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To select and view a sample without triggering it, press and hold the <strong>SAMPLE</strong> button and press a <strong>PAD</strong>.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1-K3 </strong>Knobs to select and adjust parameters as described below. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Alternatively, press the <strong>ENCODER</strong> to cycle between the <strong>K1–K3</strong> parameters at the bottom of the screen, and then turn the <strong>ENCODER</strong> or press the <strong>-/+</strong> buttons to adjust the selected parameter. You can also press and hold <strong>SHIFT</strong> and press the <strong>ENCODER</strong> to cycle backwards between the parameters. </span></div>\n\n<div class=\"p de_203502BDEC\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> to access these additional parameters using the <strong>B1</strong> and <strong>B2</strong> Function Buttons. </span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-0;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+B1 – Loop Lock: </strong>Activate or deactivate loop lock. When activated, loop start is locked to the sample start.<strong> </strong></span></div>\n</li><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+B2 – Normalize:</strong> Apply normalization to the sample, adjusting the audio level between the sample start point and end point so that the maximum peak level is set to 0 dB.</span></div>\n</li></ul>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>B1 </strong>Function Button to cycle between the following options:</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Trim:</strong> Use these functions to edit the length of the selected sample.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_2.png\" data-full-width=\"328\" data-full-height=\"248\" /> </span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-1;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>K1 – Start:</strong> Adjust the sample start point (<strong>0</strong> – <strong>100%</strong>). </span></div>\n</li></ul><div class=\"p de_1D4BC5ECBB\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K1 – Zoom: Start:</strong> Zoom in or out of the sample waveform at the sample start point (<strong>0</strong> – <strong>100%</strong>).</span></div>\n\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-2;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>K2 – End:</strong> Adjust the sample end point (<strong>0</strong> – <strong>100%</strong>).</span></div>\n</li></ul><div class=\"p de_1D4BC5ECBB\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K2 – Zoom: End:</strong> Zoom in or out of the sample waveform at the sample end point (<strong>0</strong> – <strong>100%</strong>).</span></div>\n\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-3;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>K3 – Loop:</strong> Adjust the loop point (<strong>0</strong> – <strong>100%</strong>).</span></div>\n</li></ul><div class=\"p de_1D4BC5ECBB\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K3 – Zoom: Loop:</strong> Zoom in or out of the sample waveform at the loop point (<strong>0</strong> – <strong>100%</strong>).</span></div>\n<div class=\"p de_6AF6DD6F29\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_96C81F178C\"><span class=\"de_C4517954D8\"><strong>Note:</strong> When Chop Mode is enabled, the Trim controls are replaced by Chop controls. See the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"pad_play.htm\"><span class=\"de_B84CA4D200\"><strong>Pad Play</strong></span><span class=\"de_68B99ACC5C\"> </span></a><span class=\"de_C4517954D8\">section for more information on Chop Mode controls. </span></div>\n</td></tr></table></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Mix:</strong> Use these functions to adjust mix settings for the sample. </span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_3.png\" data-full-width=\"328\" data-full-height=\"248\" /></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-4\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-4;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K1 – Volume:</strong> Adjust the sample volume (<strong>-INF</strong>, <strong>-74.00</strong> – <strong>+6.00 dB</strong>). The vertical meter to the left of the sample waveform displays the current volume setting. </span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-5\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-5;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K2 – Kit Volume:</strong> Adjust the kit volume, or the overall volume of all samples (<strong>-INF</strong>, <strong>-74.00</strong> – <strong>+6.00 dB</strong>). </span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-6\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-6;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K3 – Pan:</strong> Adjust the left/right stereo panning of the sample (<strong>50L</strong> – <strong>C</strong> – <strong>50R</strong>). The vertical meter to the right of the sample waveform displays the current pan setting. </span></div>\n</li></ul>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Amp Env:</strong> Use these functions to adjust the amplitude envelope of the sample, which allow you to change the sample dynamics. </span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_4.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_4.png\" data-full-width=\"327\" data-full-height=\"247\" /></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-7\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-7;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K1 – Attack:</strong> Adjust the attack phase of the amplitude envelope (<strong>0</strong> – <strong>127</strong>). This determines how quickly the sound fades in from the sample start point.</span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-8\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-8;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K2 – Decay:</strong> When the sample is set to One Shot playback, use this knob to adjust the decay phase of the amplitude envelope (<strong>0</strong> – <strong>127</strong>). This determines how quickly the sound fades out, either from the sample start point or end point.</span></div>\n</li></ul><div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K2 – Decay From:</strong> This setting determines whether the decay phase of the amplitude envelope is applied to the sample <strong>Start</strong> or <strong>End</strong> when the sample is set to One Shot playback. </span></div>\n\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-9\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-9;\">\n<div class=\"p de_9229EC0AB7\"><span class=\"de_CC7DAF531E\"><strong>K2 – Release:</strong> When the sample is set to Note On playback, use this knob to adjust the release phase of the amplitude envelope (<strong>0</strong> – <strong>127</strong>). This determines how quickly the sound fades out when the pad is released. See the Pad Play section to learn more about Note On playback.</span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-10\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-10;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K3 – Vel Sens:</strong> This setting determines how responsive the sample level is to your playing (<strong>0</strong> – <strong>127</strong>). When set to <strong>127</strong>, the pads are the most responsive to your playing dynamics as they can be, so that soft hits trigger low velocity events. When set to <strong>0</strong>, the sample plays at full velocity no matter how soft or hard you hit the pad. </span></div>\n</li></ul>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>B2 </strong>Function Button to cycle between the following options:</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Tune:</strong> Use these functions to adjust sample tuning.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_5.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_5.png\" data-full-width=\"329\" data-full-height=\"248\" /></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-11\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-11;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K1 – Semi Tune:</strong> Adjust the coarse tuning of the sample pitch in semitones (<strong>-24 </strong>– <strong>0</strong> – <strong>24</strong>).</span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-12\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-12;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K2 – Fine Tune:</strong> Adjust the fine tuning of the sample pitch in cents (<strong>-90 </strong>– <strong>0</strong> – <strong>90</strong>).</span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-13\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-13;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K3 – Warp:</strong> This setting adjusts the Warp value (<strong>Off</strong>, <strong>50</strong> – <strong>200%</strong>, <strong>Seq</strong>). Press and hold <strong>SHIFT</strong> and press <strong>PAD 15 – WARP</strong> to adjust the Warp mode.</span></div>\n</li></ul><div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\">When Warp is set to <strong>Time Stretch</strong>, adjusting this value changes the length (and tempo) of the sample, but keeps the pitch the same. If set to <strong>Off</strong>, there is no change to the length of the sample. At <strong>50%</strong>, the sample is half as long, or twice as fast. At <strong>200%</strong>, the sample is twice as long, or twice as slow. If set to <strong>Seq</strong>, the sample’s tempo remains locked to the Sequence tempo.</span></div>\n<div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\">When Warp is set to <strong>Pitch</strong>, adjusting this value changes the length (and tempo) of the sample in the same way, but also adjusts the pitch of the sample accordingly. When this Warp mode is selected, the <strong>Semi Tune</strong> and <strong>Fine Tune</strong> parameters are unavailable.</span></div>\n\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-14\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-14;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K3 – # Beats:</strong> This setting determines the length of the sample in beats. This is used in conjunction with the <strong>Warp</strong> setting to determine how the sample changes in tempo.</span></div>\n</li></ul>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Play:</strong> Use these settings to adjust sample playback functionality.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_6.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sa
