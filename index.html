mple/drex_sample_mode_custom_6.png\" data-full-width=\"328\" data-full-height=\"248\" /></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-15\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-15;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K1 – Polyphony:</strong> This setting determines whether the polyphony of the sample is <strong>Mono</strong> or <strong>Poly</strong>. When set to Mono, each time the pad is struck, the current sample playback will stop, and the sample will restart from the sample start point. When set to Poly, each time the pad is struck, the sample will play in its entirety. Striking the pad again will replay the sample from the sample start point while the previous trigger continues.</span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-16\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-16;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K2 – Mute Group:</strong> This setting allows you to assign pads to mute groups (<strong>Off</strong>, <strong>1</strong> – <strong>16</strong>). When pads are assigned to the same mute group, the last pad played silences any other playing samples in the same group. For example, you can assign a closed hi-hat sample and open hi-hat sample to the same mute group. Triggering the closed hi-hat after the open hi-hat stops the sound of the open hi-hat, mimicking the natural playing dynamic of a hi-hat. </span></div>\n</li></ul><div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+ K2 – Pad Link:</strong> This setting allows you to set two samples in the same Pad Bank to trigger at the same time (<strong>Off</strong>, <strong>1</strong> – <strong>16</strong>). For example, if you have a melodic sample on <strong>PAD 6</strong> in Bank A that you want to trigger at the same time as a drum break on <strong>PAD 7 </strong>in Bank A, set the Pad Link value on <strong>PAD 7</strong> to <strong>6</strong>. Now, each time <strong>PAD 7</strong> is triggered to launch the drum break, the melodic sample on <strong>PAD 6</strong> is triggered at the same time. Note, however, this will not affect <strong>PAD 7</strong> in any other Pad bank.</span></div>\n\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-17\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-17;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K3 – Offset:</strong> This setting allows you to apply a trigger offset to the sample (<strong>0</strong> – <strong>100%</strong>). This delays the start of the sample audio after you hit the pad. </span></div>\n</li></ul>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>B3 </strong>Function Button to cycle between the following options:</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Filter:</strong> Use these functions to adjust the sample filter, which allows some of a sample’s audio frequencies to pass through it and dampens other frequencies.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_7.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_7.png\" data-full-width=\"328\" data-full-height=\"247\" /></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-18\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-18;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K1 – Cutoff:</strong> Adjust the center frequency of the selected filter type (<strong>0</strong> – <strong>127</strong>). Frequencies below, above, or around this frequency will be dampened, depending on the selected filter type. </span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-19\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-19;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K2 – Reso:</strong> Adjust the resonance of the filter around the center frequency (<strong>0</strong> – <strong>127</strong>). This gives a boost around the center frequency. </span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-20\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-20;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K3 – Type:</strong> This setting determines the type of filter applied: <strong>Off</strong> (no filter), <strong>Classic</strong>, <strong>LPF2</strong>, <strong>LPF4</strong>, <strong>HPF2</strong>, <strong>HPF4</strong>, <strong>BPF2</strong>, <strong>BPF4</strong>. </span></div>\n</li></ul><div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\">Classic – Similar to the low-pass filter with a slightly different character, particularly when the resonance is increased. This is modeled after the filter on the classic MPC3000 drum machine. </span></div>\n<div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\">LPF – Low-pass filter. Audio frequencies below the cutoff are unaffected, and audio frequencies above the cutoff are dampened.</span></div>\n<div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\">HPF – High-pass filter. Audio frequencies below the cutoff are dampened, and audio frequencies above the cutoff are unaffected.</span></div>\n<div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\">BPF –Band-pass filter. Audio frequencies above and below the cutoff are dampened.</span></div>\n<div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\">2 and 4 refer to the rate of damping. </span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Filt Env:</strong> Use these functions to adjust the filter envelope settings. The filter envelope affects the filter Cutoff frequency.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_8.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_mode_custom_8.png\" data-full-width=\"324\" data-full-height=\"247\" /></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-21\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-21;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K1 – Attack:</strong> Adjust the attack phase of the filter envelope (<strong>0</strong> – <strong>127</strong>). This determines how quickly the filter opens up, increasing the filter cutoff frequency. </span></div>\n</li></ul>\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-22\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-22;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K2 – Decay:</strong> When the sample is set to One Shot playback, use this knob to adjust the decay phase of the filter envelope (<strong>0</strong> – <strong>127</strong>). This determines how quickly the filter closes, or returns to the filter cutoff frequency. </span></div>\n</li></ul><div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K2 – Decay From:</strong> This setting determines whether the decay phase of the filter envelope is applied to the sample <strong>Start</strong> or <strong>End</strong>.</span></div>\n\n<div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>K2 – Release:</strong> When the sample is set to Note On playback, use this knob to adjust the release phase of the filter envelope (<strong>0</strong> – <strong>127</strong>). This determines how quickly the filter closes, or returns to the filter cutoff frequency. See the following </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"pad_play.htm\"><span class=\"de_B84CA4D200\"><strong>Pad Play</strong></span></a><span class=\"de_CC7DAF531E\"> section to learn more about Note On playback.</span></div>\n\n<ul class=\"de_list\"><li class=\"list-element list-counter-967a19e3-04e5-4878-9702-3380b308389e-23\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-967a19e3-04e5-4878-9702-3380b308389e-23;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K3 – Depth:</strong> This setting determines the amount of influence the filter envelope has on the filter Cutoff frequency (<strong>0</strong> – <strong>127</strong>). The higher the Depth, the greater the range of filter frequency adjustment. </span></div>\n</li></ul>\n\n\n</div>", "pad_play": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Pad Play</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom.png\" data-full-width=\"237\" data-full-height=\"180\" /></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">While in Sample Mode, use the <strong>PAD PLAY</strong> buttons to activate additional playback functions for the samples, described below.</span></div>\n<div class=\"p de_6AF6DD6F29\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\"><strong>Note:</strong> The <strong>MUTE</strong> function can be accessed in any mode at any time for fast performance.</span></div>\n</td></tr></table></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_2.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Chop</strong></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>CHOP</strong> button to activate Chop Mode for the sample on the selected pad. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">In Chop Mode, the sample is automatically chopped by the current chop type between the sample Start Point and End Point. You can then use the <strong>PADS</strong> to trigger each slice or select it for editing. For example, if your sample is chopped into eight slices, press <strong>PAD 5</strong> to select Slice 5. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">When Chop Mode is activated, the Trim controls on the Sample Page are replaced by the following Chop controls:</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_3.png\" data-full-width=\"326\" data-full-height=\"246\" /></span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-0;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K1 – Start:</strong> Adjust the slice start point (<strong>0</strong> – <strong>100%</strong>, depending on the length of the slice).</span></div>\n</li></ul><div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K1 – Zoom: Start:</strong> Zoom in or out of the sample waveform at the slice start point (<strong>0</strong> – <strong>100%</strong>).</span></div>\n\n<ul class=\"de_list\"><li class=\"list-element list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-1;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K2 – End:</strong> Adjust the slice end point (<strong>0</strong> – <strong>100%</strong>, depending on the length of the slice).</span></div>\n</li></ul><div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K2 – Zoom: End:</strong> Zoom in or out of the sample waveform at the slice end point (<strong>0</strong> – <strong>100%</strong>).</span></div>\n\n<ul class=\"de_list\"><li class=\"list-element list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-2;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>K3 – Chop Type:</strong> Adjust the chop type. This determines how a sample is chopped when in Chop Mode. </span></div>\n</li></ul><div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>Threshold:</strong> In this mode, slices are placed automatically according to the Threshold setting. </span></div>\n<div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>Regions 4/8/16:</strong> In these modes, slices are divided evenly across the length of the sample to create the selected number of slices (4, 8, or 16).</span></div>\n<div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>Manual:</strong> In this mode, you can manually create slices. Tap <strong>PAD 1</strong> to begin playing the sample and add the initial slice start point. As the sample plays, tap pads to add additional slices. You can add up to 16 slices per sample. </span></div>\n<div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\"><strong>SHIFT+K3 – Threshold:</strong> When Chop Mode is set to Threshold, press and hold <strong>SHIFT</strong> and turn this knob to adjust the Threshold value (<strong>0</strong> – <strong>100%</strong>). Generally, the higher the threshold, the fewer the resulting slices.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>B1</strong> Function Button to <strong>Extract</strong> the currently selected slice. The selected area is exported as a new sample and automatically added to the next available pad. This is a non-destructive edit, so the original sample remains fully intact. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>B2</strong> Function Button to <strong>Split</strong> the currently selected slice. This automatically cuts the selected area in half, creating two slices in place of one. The subsequent slice numbers also increase by one. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>B3</strong> Function Button to <strong>Merge</strong> the currently selected slice with the previous slice. All subsequent slice numbers will decrease by one. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">For example, if you have a sample with eight slices and Merge Slice 2, Slice 2 is added to Slice 1, leaving seven slices in total. The previous Slice 3 becomes Slice 2, and so on. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">&#160;</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold the <strong>ERASE</strong> button and tap a <strong>PAD</strong> to remove a slice. This will also merge the removed slice with the previous slice and decrease all subsequent slice numbers by one.</span></div>\n<div class=\"p de_6AF6DD6F29\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_026A006CB7\"><span class=\"de_C4517954D8\"><strong>Note:</strong> Editing slices automatically sets the Chop Type to Manual. </span></div>\n<div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\">Editing slices also cannot be undone or redone using the <strong>UNDO</strong>/<strong>REDO</strong> functions.</span></div>\n</td></tr></table></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To exit Chop Mode, press the <strong>CHOP</strong> button again. </span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_4.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_2.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Note On</strong></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>CHOP</strong> button to enable Note On playback for the sample on the selected pad. When set to Note On, the sample will play only as long as the pad is held down. Once the pad is released, sample playback will stop. When Note On is off, the sample plays as a “One Shot” instead, playing in its entirety each time the pad is triggered (except when the <strong>LOOP</strong> function is engaged, in which case triggering the PAD starts and stops the loop). </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Enabling Note On mode for a sample also affects the Amplitude Envelope and Filter Envelope controls for the selected pad. Instead of Decay parameters, these Envelopes will have Release parameters. See the previous </span><span class=\"de_97985A090F\"><strong>Sample Mode</strong></span><span class=\"de_CC7DAF531E\"> section for more information on the Envelope parameters. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Note On playback is indicated for each sample in Sample Mode with the note icon ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_5.png\"/> ).</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_6.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_6.png\" data-full-width=\"328\" data-full-height=\"248\" /></span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_7.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Loop</strong></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>LOOP</strong> button to activate looping playback for the sample. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To start loop playback, tap a <strong>PAD</strong> while Loop is activated to begin playing the sample from the Sample Start point. When the sample reaches the Sample End point, it returns to the Loop Start point and keeps playing.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">By default, the <strong>LOOP LOCK </strong>function is engaged when looping playback is activated. This locks the Sample Start point to the Loop Start point. While in </span><span class=\"de_97985A090F\"><strong>Sample Mode</strong></span><span class=\"de_CC7DAF531E\">, press and hold <strong>SHIFT</strong> and press the <strong>B1</strong> Function Button to disengage Loop Lock. When disengaged, the Sample Start point and Loop Start point can be set independently. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">If the sample is also in Reverse playback, it begins at the Sample End point and plays backwards until reaching the Sample Start point, then returns to the Sample End point and keeps playing. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Loop playback also affects how the </span><span class=\"de_97985A090F\"><strong>Amp Env</strong></span><span class=\"de_CC7DAF531E\"> is applied. If the sample is set to One Shot playback and the envelope is set to Decay From End (default), the loop plays indefinitely until the pad is toggled off. If the sample is set to One Shot playback and the envelope is set to Decay From Start, the loop plays until it is manually toggled off, or until the Decay stage of the envelope is completed and mutes the sample. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To stop loop playback, tap the pad again. If the sample is also in Note On playback, it keeps looping as long as the pad is being held, and stops once the pad is released.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Loop playback is indicated in Sample Mode by the loop icon ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_8.png\"/> ).</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_9.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_9.png\" data-full-width=\"324\" data-full-height=\"250\" /></span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_4.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_7.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Reverse</strong></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>LOOP</strong> button to activate reverse playback for the sample. When activated, the sample plays in reverse, starting from the Sample End Point and moving backwards to the Sample Start Point (or Loop Start Point, if Loop playback is active).</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Reverse playback is indicated in </span><span class=\"de_97985A090F\"><strong>Sample Mode</strong></span><span class=\"de_CC7DAF531E\"> by the arrow icon ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_10.png\"/> ).</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_11.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_11.png\" data-full-width=\"329\" data-full-height=\"247\" /></span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_12.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Mute</strong></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>MUTE</strong> button to activate the mute function of the pads. You can also press and hold this button to temporarily engage the mute function. Release the button to disengage. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">When mute is activated, the pads no longer trigger samples, and can instead be used to mute and unmute individual samples. This can be useful when playing sequences to create dynamic arrangements by bringing elements in and out of the sequence.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To mute a sample, press the respective pad so that it is lit red. Unmuted samples are lit yellow.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To unmute a sample, press a pad that is lit red so that it returns to yellow. You can also use the <strong>UNMUTE ALL</strong> function, described below, to unmute all samples at the same time. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">If a muted sample is selected in </span><span class=\"de_97985A090F\"><strong>Sample Mode</strong></span><span class=\"de_CC7DAF531E\">, the waveform will appear greyed out, and the sample will not trigger. </span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_13.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_13.png\" data-full-width=\"331\" data-full-height=\"250\" /></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">This function can be accessed from any mode at any time for fast performance.</span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_4.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_12.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>Unmute All:</strong> Press and hold <strong>SHIFT</strong> and press the <strong>MUTE</strong> button to unmute all muted samples at the same time. </span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_14.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>16 Levels:</strong> Press the <strong>16 LEVELS</strong> button to activate 16 Levels mode for the sample on the currently selected pad. When activated, the current sample is copied across all 16 pads, with a selected parameter increasing in value across the pads. This allows you to create more dynamic arrangements by adding variations of the sample without having to load multiple versions of the same sound. 16 Levels mode is indicated on the Sample page by the 16 icon ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_15.png\"/> ).</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_16.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_16.png\" data-full-width=\"328\" data-full-height=\"250\" /></span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_4.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_14.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><strong>TYPE:</strong> Press and hold <strong>SHIFT</strong> and press the <strong>16 LEVELS</strong> button to cycle between the available 16 Levels types. This determines how the sample changes across the 16 pads.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-3;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>Velocity:</strong> The sample increases in velocity across the 16 pads.</span></div>\n</li><li class=\"list-element list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>Filter:</strong> The filter cutoff point of the currently selected filter type is adjusted across the 16 pads. Pads 1–8 increase the cutoff from the minimum point to the current <strong>Cutoff</strong> value. Pads 9–16 increase the cutoff from the current value to the maximum point. Depending on the current <strong>Cutoff</strong> value, the range of available value adjustment may be limited. The <strong>Cutoff</strong> value can be adjusted using the <strong>Filter</strong> functions in </span><span class=\"de_97985A090F\"><strong>Sample Mode</strong></span><span class=\"de_CC7DAF531E\">. </span></div>\n</li><li class=\"list-element list-counter-ef84c6e5-7f7e-477a-8435-0beb58ac9556-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\"><strong>Tune:</strong> The pitch of the sample is adjusted across the 16 pads. The sample at its original pitch is placed on <strong>PAD 4</strong>, with pads below this lowering in pitch and pads above this increasing in pitch.</span></div>\n</li></ul><div class=\"p de_36C866FB79\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_17.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_pad_play_custom_17.png\" data-full-width=\"330\" data-full-height=\"257\" /></span></div>\n</div>", "loading_and_saving_samples": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Loading and Saving Samples</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To load a sample to a pad, press the <strong>SAMPLE SELECT</strong> ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_loading_and_saving_samples_custom.png\"/> ) button to open the Sample Browser.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_loading_and_saving_samples_custom_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_loading_and_saving_samples_custom_2.png\" data-full-width=\"329\" data-full-height=\"246\" /> <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_loading_and_saving_samples_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_loading_and_saving_samples_custom_3.png\" data-full-width=\"330\" data-full-height=\"247\" /></span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong>, or press the <strong>-/+</strong> buttons, to browse the list of sample categories. </span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press the <strong>ENCODER</strong> to open a folder, and then turn the <strong>ENCODER</strong> or press the <strong>-/+</strong> buttons to browse the list of samples.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Use the <strong>B3</strong> Function Button to turn automatic <strong>Preview</strong> on or off. When on, each sample will play as it is highlighted. </span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press the <strong>B1</strong> Function Button to move <strong>Back</strong>.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press the <strong>B2</strong> Function Button to switch between the Internal drive and an External drive if you have a microSD card inserted into the microSD Card Slot. This defaults to an automatically-created <strong>MPC-Sample/Samples</strong> directory where user samples are stored, but you can freely navigate to other directories on your microSD card as needed.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To save a sample, press and hold <strong>SHIFT</strong> and press the <strong>SAMPLE SELECT / SAVE SAMPLE</strong> button.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_loading_and_saving_samples_custom_4.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_loading_and_saving_samples_custom_4.png\" data-full-width=\"329\" data-full-height=\"246\" /></span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> to scroll through letters and numbers. Press the <strong>ENCODER</strong> to select the desired character and move to the next character. </span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> to access capital letters.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press the <strong>-/+</strong> buttons to move between characters. </span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press the <strong>B2</strong> Function Button to erase the current character.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>B2</strong> Function Button to erase all characters at the same time. </span></div>\n<div class=\"p de_03FDC443AD\"><span class=\"de_CC7DAF531E\">When you have finished editing the sample name, press the <strong>B3</strong> Function Button (<strong>Do It!</strong>) to save the sample.</span></div>\n<div class=\"p de_03FDC443AD\"><span class=\"de_CC7DAF531E\">To exit the Save Sample page without saving, press the <strong>B1</strong> Function Button (<strong>Cancel</strong>).</span></div>\n\n\n\n\n\n\n\n\n</div>", "sample_record_mode": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Sample Record Mode</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">In addition to the built-in sounds of MPC Sample, you can use its sampling capabilities to record your own sounds using Sample Record mode. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_record_mode_custom.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To open Sample Record Mode, press the <strong>SAMPLE RECORD</strong> button.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_record_mode_custom_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_sample_record_mode_custom_2.png\" data-full-width=\"327\" data-full-height=\"250\" /></span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>B1 </strong>Function Button to cycle between the audio monitoring settings. </span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-1654d689-1da5-4d62-b232-40f847dfed95-0;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Off:</strong> Audio from the selected Source is never monitored.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Auto:</strong> Audio from the selected Source is monitored only while Sample Record Mode is in focus.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>On:</strong> Audio from the selected Source is always monitored.</span></div>\n</li></ul><div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">This is automatically set to the current <strong>MONITOR</strong> setting in the </span><span class=\"de_97985A090F\"><strong>Input Configuration</strong></span><span class=\"de_CC7DAF531E\"> menu. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">The Speaker icon below to this setting indicates the current state of the built-in speaker. If the speaker is deactivated, the icon appears crossed out. For example, this occurs when the built-in Microphone is selected as the active Source and Monitor is set to On or Auto (while Sample Record Mode is in focus), or when an audio output device is connected to the <strong>PHONES</strong> or <strong>AUDIO OUT</strong> connections on the rear panel while any input is selected as the active Source. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1 </strong>Knob<strong> </strong>to select the active input source. </span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-1654d689-1da5-4d62-b232-40f847dfed95-1;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Mic:</strong> The built-in microphone, located next to the <strong>ENCODER</strong>.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Rear:</strong> The rear panel <strong>AUDIO IN</strong> connections. Selecting this option enables both the <strong>1/L </strong>and <strong>2/R</strong> inputs to record in stereo.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Rear L:</strong> The <strong>1/L AUDIO IN</strong> on the rear panel.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Rear R:</strong> The <strong>2/R AUDIO IN</strong> on the rear panel.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Resample:</strong> Re-recorded audio from MPC Sample. You can use this to record a sequence onto a single pad, freeing up other pads for additional sounds.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>USB:</strong> Audio from a device connected to MPC Sample’s rear panel <strong>USB</strong> port. Selecting this option records stereo audio from the USB device.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>USB L:</strong> Left-channel audio from a device connected to the <strong>USB</strong> port.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>USB R:</strong> Right-channel audio from a device connected to the <strong>USB</strong> port.</span></div>\n</li></ul><div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">This is automatically set to the current <strong>SOURCE</strong> setting in the Input Configuration menu.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K2 </strong>Knob<strong> </strong>to set the recording length for the sample. Set this to <strong>Free</strong> to record with no set length, or set to <strong>Seq</strong> to record for the length of the current sequence. If <strong>Seq</strong> is selected and playback is active, recording begins at the end of the current loop.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">This is automatically set to the <strong>REC LENGTH </strong>setting in the Input Configuration menu.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K3 </strong>Knob<strong> </strong>to adjust the recording <strong>Threshold</strong>. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">When incoming audio rises above the Threshold setting, the waveform icon in the top-right corner of the screen lights up. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">This is automatically set to the <strong>THRESHOLD</strong> setting in the Input Configuration menu.</span></div>\n\n\n<div class=\"p de_203502BDEC\"><span class=\"de_CC7DAF531E\">Once you have confirmed these settings, you can begin recording.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-1654d689-1da5-4d62-b232-40f847dfed95-2;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Tap the pad where you would like to add your sample to begin recording.</span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Record audio from your selected source.</span></div>\n<div class=\"p de_636669D020\"><span class=\"de_CC7DAF531E\">As you record, you can also tap additional <strong>PADS</strong> to chop your sample. </span></div>\n</li><li class=\"list-element list-counter-1654d689-1da5-4d62-b232-40f847dfed95-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Once you are finished recording, stop recording by pressing the pad again, pressing the <strong>STOP</strong> button, or pressing the <strong>SAMPLE RECORD</strong> button.</span></div>\n</li></ul><div class=\"p de_1D4BC5ECBB\"><span class=\"de_CC7DAF531E\">If you stop recording by pressing the <strong>PAD</strong> or <strong>STOP</strong> button, you will remain in Sample Record mode, and can continue recording samples. To return to Sample Mode and view your recorded sample, press the <strong>SAMPLE</strong> button.</span></div>\n<div class=\"p de_1D4BC5ECBB\"><span class=\"de_CC7DAF531E\">If you stop recording by pressing the <strong>SAMPLE RECORD</strong> button, you will automatically return to Sample Mode with your newly recorded sample selected.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\"><strong>Tip:</strong> If you miss capturing a great moment, you can press and hold <strong>SHIFT</strong> and press the <strong>SAMPLE RECORD/ RECALL</strong> button to retrieve the last 25 seconds of audio from your selected source and automatically place it on the next available pad.</span></div>\n</td></tr></table></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">You can now edit your sample and add it to sequences. See the </span><span class=\"de_97985A090F\"><strong>Sample Mode</strong></span><span class=\"de_CC7DAF531E\"> chapter for more information on editing samples, as well as </span><span class=\"de_97985A090F\"><strong>Loading and Saving Samples</strong></span><span class=\"de_CC7DAF531E\">, or the </span><span class=\"de_97985A090F\"><strong>Sequence Mode</strong></span><span class=\"de_CC7DAF531E\"> chapter for more information on recording and editing sequences. </span></div>\n\n\n\n\n</div>", "sequence_mode": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Sequence Mode</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Sequences are the building blocks of songs when making music with MPC Sample. A sequence contains a pattern of notes over a set length of time. You can use sequences to create entire song sections, like having one sequence for a verse and one sequence for a chorus, or create many variations using sequences, like having four similar sequences for a verse that you can use interchangeably or together. As you build your sequences, you can also edit them and export them as an entire song for sharing.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sequence_mode_custom.png\"/></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To open Sequence Mode, press the <strong>SEQ</strong> button. </span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_sequence_mode_custom_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_sequence_mode_custom_2.png\" data-full-width=\"326\" data-full-height=\"247\" /></span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> to adjust the current playhead position by beats. Press and hold <strong>SHIFT</strong> and turn the <strong>ENCODER</strong> to adjust the current playhead position by the current <strong>Q</strong> value (described below).</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press and hold the <strong>B1</strong> Function Button to open the Sequence BPM window. Turn the <strong>ENCODER</strong> to adjust the tempo to the desired BPM. Press the <strong>ENCODER</strong> to cycle between whole numbers and decimals. When you have finished editing the Sequence BPM, release the <strong>B1</strong> Function Button. </span></div>\n<div class=\"p de_026A006CB7\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\"><strong>Tip:</strong> You can also press the <strong>TAP TEMPO</strong> button at a regular interval to set a new tempo for the sequence.</span></div>\n</td></tr></table></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B2</strong> Function Button to toggle between Sequence (<strong>SEQ</strong>) BPM control and Global (<strong>GBL</strong>) BPM control. When set to SEQ, each sequence has an independent BPM. When set to GBL, all sequences are tied to the same BPM.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B3</strong> Function Button to turn Record Quantization on or off. When on, the notes you play while recording are snapped to the grid at the current <strong>Q</strong> value (described below).</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1</strong> Knob to adjust the length of the sequence to 1, 2, 4, 8, 16, 32, 64, or 128 Bars. Press and hold <strong>SHIFT </strong>and turn the <strong>K1</strong> Knob to adjust the length of the sequence to any value between 1–128 Bars.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>K2</strong> Knob to adjust the Quantization (<strong>Q</strong>) value. This determines the time division that each bar of the sequence is divided into, and how note events snap to those divisions. For example, if the Q is set to 1/16, all events will snap to the nearest 1/16<sup>th</sup> note on the grid.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>K3</strong> knob to adjust the <strong>RT Swing</strong> value. This is a “live” parameter that does not affect the actual placement of note events in the sequence, but instead applies a percentage shift based on the current note event position and relative to the nearest time division as set by the Q value. You can use this as a performative tool to adjust your beat’s rhythms on the fly. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and turn the <strong>K2</strong> Knob to adjust the time signature of the Project. The current time signature is also shown on the display in Sequence Mode below the current sequence name.</span></div>\n<div class=\"p de_026A006CB7\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\"><strong>Note:</strong> All sequences are tied to the same time signature. </span></div>\n</td></tr></table></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and turn the <strong>K3</strong> Knob to adjust the Metronome (or “click”) volume. </span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>TAP TEMPO / METRONOME</strong> button to cycle the metronome between its three states: <strong>Off</strong> (the metronome does not play), <strong>On</strong> (the metronome always plays during playback and recording), or <strong>Record</strong> (the metronome only plays during recording). The current metronome setting is also shown on the display in Sequence Mode above the current sequence time. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press <strong>PAD 4 – COUNT-IN</strong> to activate or deactivate the recording count-in. When activated, MPC Sample will count off one bar at the current tempo and time signature prior to recording a sequence. This count appears on the display, and if the Metronome is set to On or Record, it can also be heard.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">The count-in status is also shown on the display in Sequence Mode. The <strong>1234</strong> icon is red when the count-in is activated, and gray when it is deactivated.</span></div>\n\n<div class=\"p de_026A006CB7\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\"><strong>Tip:</strong> You can access the Sequence Mode display functions while keeping the pads in Sample Mode for triggering samples by pressing and holding the <strong>SEQ</strong> button and then pressing the <strong>SAMPLE</strong> button (or vice versa). Both buttons will flash while Sample/Seq Mode is engaged. To exit, press either the <strong>SEQ</strong> or <strong>SAMPLE</strong> button to return to that mode’s display and pad functions.</span></div>\n</td></tr></table></div>\n\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><strong>Selecting and Triggering Sequences</strong></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press a <strong>PAD</strong> to select a sequence. Sequences with note events are lit light green, while empty sequences are dimly lit.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">If playback is stopped, the current sequence will flash bright green, indicating it is queued for playback. The name of the current sequence is also shown on the display below the sequence tempo.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>PLAY</strong> button to launch a sequence. The pad for the current sequence will stop flashing and remain solidly lit bright green.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">During playback, press another <strong>PAD</strong> to queue a different sequence. The pad for the queued sequence flashes bright green until the end of the current sequence. Once the current sequence ends, the new sequence immediately begins playing, and the pad for the new sequence is now solidly lit bright green.</span></div>\n\n\n\n</div>", "recording_sequences": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Recording Sequences</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To record a new sequence with MPC Sample:</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-0;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">In Sequence Mode, tap a dimly lit pad to select an empty sequence. </span></div>\n</li><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Prior to recording, you can adjust the Sequence data like BPM, Length, and Record Quantization as needed using the methods described above. </span></div>\n</li><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When you are ready to record, press the </span><span class=\"de_67B4B21911\"><strong>SEQ RECORD</strong></span><span class=\"de_CC7DAF531E\"> ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_recording_sequences_custom.png\"/> ) button. The button will begin flashing to indicate it is armed for recording. </span></div>\n</li><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_1F1007D887\"><span class=\"de_CC7DAF531E\">The pads will also enter Sample/Seq Mode, where the Sequence Mode display remains while the pads return to sample triggering mode, as described above. Both the </span><span class=\"de_67B4B21911\"><strong>SAMPLE</strong></span><span class=\"de_CC7DAF531E\"> and </span><span class=\"de_67B4B21911\"><strong>SEQ</strong></span><span class=\"de_CC7DAF531E\"> buttons flash to indicate they are in Sample/Seq Mode. You can also press the SAMPLE button to return to Sample Mode while keeping sequence recording armed.</span></div>\n</li><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the </span><span class=\"de_67B4B21911\"><strong>PLAY</strong></span><span class=\"de_CC7DAF531E\"> button to begin recording. The sequence begins playing, and you can tap the pads to add recorded events.</span></div>\n</li><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When the end of the Sequence is reached, MPC Sample automatically switches to overdub recording, and any samples triggered will play back at their recorded locations. You can continue recording as needed. </span></div>\n</li><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When you are finished, press the </span><span class=\"de_67B4B21911\"><strong>SEQ RECORD</strong></span><span class=\"de_CC7DAF531E\"> button again to stop recording but continue playback. You can also press the </span><span class=\"de_67B4B21911\"><strong>STOP</strong></span><span class=\"de_CC7DAF531E\"> button to stop recording and playback at the same time. The pads will return to sequence triggering mode if you were previously in Sequence Mode.</span></div>\n</li></ul>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold </span><span class=\"de_67B4B21911\"><strong>SHIFT</strong></span><span class=\"de_CC7DAF531E\"> and press </span><span class=\"de_67B4B21911\"><strong>-/UNDO</strong></span><span class=\"de_CC7DAF531E\"> to undo all recorded events since the last time recording began. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">While sequence recording is armed, you can also press and hold the </span><span class=\"de_67B4B21911\"><strong>ERASE</strong></span><span class=\"de_CC7DAF531E\"> button and press a </span><span class=\"de_67B4B21911\"><strong>PAD</strong></span><span class=\"de_CC7DAF531E\"> to erase all recorded events for that pad. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold </span><span class=\"de_67B4B21911\"><strong>SHIFT</strong></span><span class=\"de_CC7DAF531E\"> and press the </span><span class=\"de_67B4B21911\"><strong>SEQ RECORD/RECALL</strong></span><span class=\"de_CC7DAF531E\"> button to retrieve any events played during the last loop of the sequence. These events are automatically added to your sequence on the respective pads. </span></div>\n\n\n<div class=\"p de_203502BDEC\"><span class=\"de_CC7DAF531E\">In addition to recording events, you can also record parameter automation on your sequence.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-1;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Select the pad on which you want to record automation. </span></div>\n</li><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the </span><span class=\"de_67B4B21911\"><strong>SEQ RECORD</strong></span><span class=\"de_CC7DAF531E\"> button to arm sequence recording, and then press the </span><span class=\"de_67B4B21911\"><strong>PLAY</strong></span><span class=\"de_CC7DAF531E\"> button to begin recording.</span></div>\n</li><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Turn the </span><span class=\"de_67B4B21911\"><strong>K1</strong></span><span class=\"de_CC7DAF531E\">–</span><span class=\"de_67B4B21911\"><strong>K3</strong></span><span class=\"de_CC7DAF531E\"> Knobs or move the </span><span class=\"de_67B4B21911\"><strong>FADER</strong></span><span class=\"de_CC7DAF531E\"> to adjust the desired parameter. You can automate parameters including Volume, Tuning, Pan, Amp and Filter Envelope parameters (except Decay From), Velocity Sensitivity, and Offset.</span></div>\n</li><li class=\"list-element list-counter-4052dee5-08be-4230-acc2-8cd2fd2e36ef-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When you are finished, press the </span><span class=\"de_67B4B21911\"><strong>SEQ RECORD</strong></span><span class=\"de_CC7DAF531E\"> button again to stop recording but continue playback. You can also press the </span><span class=\"de_67B4B21911\"><strong>STOP</strong></span><span class=\"de_CC7DAF531E\"> button to stop recording and playback at the same time.</span></div>\n</li></ul>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold </span><span class=\"de_67B4B21911\"><strong>SHIFT</strong></span><span class=\"de_CC7DAF531E\"> and press </span><span class=\"de_67B4B21911\"><strong>-/UNDO</strong></span><span class=\"de_CC7DAF531E\"> to undo all recorded automation events since the last time recording began. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To erase automation, select the pad that contains the automation you want to erase. Then, press and hold this button and move the </span><span class=\"de_67B4B21911\"><strong>K1</strong></span><span class=\"de_CC7DAF531E\">–</span><span class=\"de_67B4B21911\"><strong>K3</strong></span><span class=\"de_CC7DAF531E\"> Knob for the parameter with recorded automation. If the </span><span class=\"de_67B4B21911\"><strong>FADER</strong></span><span class=\"de_CC7DAF531E\"> is set to control a parameter with automation, you can also move the </span><span class=\"de_67B4B21911\"><strong>FADER</strong></span><span class=\"de_CC7DAF531E\"> while holding </span><span class=\"de_67B4B21911\"><strong>ERASE</strong></span><span class=\"de_CC7DAF531E\">. A menu will appear on the display for confirmation. Press the </span><span class=\"de_67B4B21911\"><strong>B3</strong></span><span class=\"de_CC7DAF531E\"> Function Button to continue, or press the </span><span class=\"de_67B4B21911\"><strong>B1</strong></span><span class=\"de_CC7DAF531E\"> Function button to cancel. </span></div>\n\n\n\n</div>", "editing_sequences": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Editing Sequences</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the following <strong>PADS</strong> to perform the following actions for your sequence:</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-ce5516e0-e561-4287-9c30-d927cabaa308-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-ce5516e0-e561-4287-9c30-d927cabaa308-0;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>PAD 2 – Half Seq:</strong> Cuts the length of the current sequence in half. For example, a 4-bar sequence becomes a 2-bar sequence. </span></div>\n</li><li class=\"list-element list-counter-ce5516e0-e561-4287-9c30-d927cabaa308-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>PAD 3 – Double Seq:</strong> Doubles the length of the current sequence, duplicating all recorded events. For example, a 4-bar sequence becomes an 8-bar sequence.</span></div>\n</li><li class=\"list-element list-counter-ce5516e0-e561-4287-9c30-d927cabaa308-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>PAD 6 – Half Speed:</strong> Makes all events in the current sequence play at half speed, so they take twice as much space in the sequence. For example, hi-hats playing at 1/8 notes now play at 1/4 notes.</span></div>\n</li><li class=\"list-element list-counter-ce5516e0-e561-4287-9c30-d927cabaa308-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>PAD 7 – Double Speed:</strong> Makes all events in the current sequence play at double speed, so they take half as much space in the sequence. For example, hi-hats playing at 1/8 notes now play at 1/16 notes.</span></div>\n</li><li class=\"list-element list-counter-ce5516e0-e561-4287-9c30-d927cabaa308-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>PAD 10 – Rec Quantize:</strong> Activates or deactivate record quantization. This makes all recorded events snap to the grid based on the current time division. This can also be adjusted in </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sequence_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sequence Mode</strong></span></a><span class=\"de_CC7DAF531E\">. </span></div>\n</li><li class=\"list-element list-counter-ce5516e0-e561-4287-9c30-d927cabaa308-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>PAD 11 – Resample:</strong> Press this to capture the current sequence a new sample. After selecting this action, press the pad where you want to add the new sample, and the sequence is rendered as a new sample to that pad. </span></div>\n</li><li class=\"list-element list-counter-ce5516e0-e561-4287-9c30-d927cabaa308-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>PAD 12 – Song:</strong> Enter Song Mode, where you can string together sequences to create a song, and then export it as an audio file or new sequence added to your project. See the following </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"song_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Song Mode</strong></span></a><span class=\"de_CC7DAF531E\"> chapter to learn more. </span></div>\n</li><li class=\"list-element list-counter-ce5516e0-e561-4287-9c30-d927cabaa308-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\"><strong>Pad 14 – Time Correct:</strong> Enter the Time Correct menu, where you can adjust and apply quantization to events in your sequence. See the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"time_correct.htm\"><span class=\"de_B84CA4D200\"><strong>Time Correct</strong></span></a><span class=\"de_CC7DAF531E\"> chapter to learn more.</span></div>\n</li></ul>\n</div>", "step_edit": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Step Edit</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">The Step Edit page allows you to edit individual events in your sequence by step. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_step_edit_custom.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_step_edit_custom_2.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">To open the Step Edit page, press and hold <strong>SHIFT</strong> and press the <strong>SEQ / STEP EDIT</strong> button.</span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_step_edit_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_step_edit_custom_3.png\" data-full-width=\"325\" data-full-height=\"247\" /></span></div>\n\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> to move between each step of the sequence at the current quantization (<strong>Q</strong>) value. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>-/+</strong> buttons to move between events on the current step. You can also tap the respective pad to select its event. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Move the <strong>FADER</strong> up or down to adjust the timing of the selected event, nudging it forward or backward, respectively, from the current position. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1</strong> Knob to adjust the sequence length.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K2</strong> Knob to adjust the current quantization (<strong>Q</strong>) value. This also determines the value of each step that you can scroll through using the <strong>ENCODER</strong>.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Turn the <strong>K3</strong> Knob to adjust the velocity of the selected event. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and turn the <strong>K2</strong> Knob to adjust the time signature of the Project. </span></div>\n<div class=\"p de_6AF6DD6F29\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_60576EC445\"><span class=\"de_C4517954D8\"><strong>Note:</strong> All sequences are tied to the same time signature. </span></div>\n</td></tr></table></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press and hold the <strong>B1</strong> Function Button to adjust the sequence tempo using the <strong>ENCODER</strong>. Press the <strong>ENCODER</strong> to move between whole numbers and decimals. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Press the <strong>B3</strong> Function Button to erase the selected event. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">While viewing the Step Edit page, you can also press and hold the <strong>ERASE</strong> button and press a <strong>PAD</strong> to erase all events from that pad. Press the <strong>B1</strong> Function Button to <strong>Cancel</strong> and return to the Step Edit page, or press the <strong>B3</strong> Function Button (<strong>Do It!</strong>) to proceed with erasing the events.</span></div>\n\n\n\n\n</div>", "song_mode": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Song Mode</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Song Mode allows you to create a list of sequences, which you can then export as an audio file or as a new sequence in your project.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_song_mode_custom.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_song_mode_custom_2.png\"/></span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To enter song mode, press and hold <strong>SHIFT</strong> and press <strong>PAD 12 – SONG</strong>. </span></div>\n<div class=\"p\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_song_mode_custom_3.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_song_mode_custom_3.png\" data-full-width=\"329\" data-full-height=\"248\" /></span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Use the <strong>PADS</strong> to select a sequence. Filled sequences are brightly lit, while empty sequences are dim.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B3 </strong>Function Button to insert the sequence into the song at the current location. Sequences will be placed after the highlighted sequence if there are already sequences in place. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> or press the <strong>-/+</strong> buttons to browse the list of sequences inserted into the song. </span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To remove a sequence, highlight it and then press the <strong>B2</strong> Function Button. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To hear your song from the beginning, press the <strong>PLAY</strong> button. Sequences will play back automatically in the order the appear on the Song page.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To hear your song starting from another point, highlight the sequence you want to start from and then press and hold <strong>SHIFT</strong> and press <strong>PLAY/CONTINUE</strong>. Playback will begin from the selected sequences and progress through the following sequences. </span></div>\n\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To export your song, press the <strong>B1</strong> Function Button. You can export your song as an audio mixdown or as a new sequence in your project. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B2</strong> Function Button to export your song as an audio mixdown. This allows you to save your song as an audio file which you can then transfer to a computer for sharing. </span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> to scroll through letters and numbers. Press the <strong>ENCODER</strong> to select the desired character and move to the next character. </span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> to access capital letters.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press the <strong>-/+</strong> buttons to move between characters. </span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press the <strong>B2</strong> Function Button to erase the current character.</span></div>\n<div class=\"p de_44E0ED04F8\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>B2</strong> Function Button to erase all characters at the same time. </span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">When you have finished editing the song name, press the <strong>B3</strong> Function Button (<strong>Do It!</strong>) to start the export.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To exit the audio export page, press the <strong>B1</strong> Function Button (<strong>Cancel</strong>).</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B3</strong> Function Button to export your song as a new sequence. The resulting sequence is automatically added to the next available sequence slot. If the new sequence length is over 128 bars, you will not be able to edit the length of the created sequence.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Press the <strong>B1</strong> Function Button to cancel exporting and return to the Song page. </span></div>\n\n\n\n\n</div>", "effects": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Effects</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">MPC Sample includes four different effect engines, all of which can be used to take your beats to the next level.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"pad_fx.htm\"><span class=\"de_B84CA4D200\"><strong>Pad FX</strong></span></a><span class=\"de_CC7DAF531E\">: In this mode, effects are triggered using the pads during playback of your sequence. There are 16 available effects which can be dynamically triggered according to how hard you press the pad. The harder you press, the more the effect is applied.</span></div>\n<div class=\"p de_6AF6DD6F29\"><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"flex_beat.htm\"><span class=\"de_B84CA4D200\"><strong>Flex Beat</strong></span></a><span class=\"de_CC7DAF531E\">: In this mode, the pads trigger 16 different effects that warp pitch, time, and volume of your audio for beat chops, DJ-style scratches, and trance gate effects. </span></div>\n<div class=\"p de_6AF6DD6F29\"><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"knob_fx.htm\"><span class=\"de_B84CA4D200\"><strong>Knob FX</strong></span></a><span class=\"de_CC7DAF531E\">: In this mode, the <strong>K1–K3</strong> knobs are used to control a specific effect that can be applied to any number of pads. This mode is great for when you want to continue to use the pads for triggering samples or sequences, but also want to incorporate effects during your performance. </span></div>\n<div class=\"p de_6AF6DD6F29\"><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"compressor.htm\"><span class=\"de_B84CA4D200\"><strong>Compressor</strong></span></a><span class=\"de_CC7DAF531E\">: This page allows you to apply and adjust the built-in compressor for adding extra punch to your sound. </span></div>\n\n\n</div>", "pad_fx": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Pad FX</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">MPC Sample’s Pad FX allow you to trigger effects using the pads as your sequence plays. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\
