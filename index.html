<script>
const PAGES = {"introduction": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Introduction</h1></div></div>\n\n<div class=\"p\">Thank you for purchasing your MPC Sample! </div>\n<div class=\"p\">Inspired by the classic MPC60 design, this portable sampler, sequencer, and effects processor puts the iconic workflow of vintage MPCs into a compact, modern format with features that empower limitless creativity. Legendary MPC pads, a full-color display, and simple creative controls encourage hands-on sampling, looping, and beatmaking right out of the box. For immediate idea generation, this standalone hardware comes with over 100 kits, inspiring pad and knobs effects, and an intuitive chopping workflow. MPC Sample is equipped with all the storage and connectivity options you need.  A rechargeable lithium-ion battery, microSD card storage, an onboard sequencer,  an internal microphone, a built-in speaker, and USB-C connection make it easy  and convenient to record, edit, and play back audio on the go—no computer  or DAW required.</div>\n\n\n<div class=\"p h2\"><h2>Box Contents</h2></div>\n\n<div class=\"p\">MPC Sample</div>\n<div class=\"p\">USB-C® Cable</div>\n<div class=\"p\">Quickstart Guide</div>\n<div class=\"p\">Safety &amp; Warranty Manual</div>\n\n\n<div class=\"p h2\"><h2>Support</h2></div>\n\n<div class=\"p\">To learn more about MPC Sample, visit <a href=\"http://akaipro.com\" target=\"_blank\" rel=\"noopener\" target=\"_blank\"><span class=\"New_normal\"><span class=\"de_2B94C39861\"><strong>akaipro.com</strong></span></span></a>.</div>\n<div class=\"p\">To register your product, visit <a href=\"http://profile.inmusicbrands.com\" target=\"_blank\" rel=\"noopener\" target=\"_blank\"><span class=\"New_normal\"><span class=\"de_2B94C39861\"><strong>profile.inmusicbrands.com</strong></span></span></a>. Log in or register for an account if you do not already have one, and then select Register New Product to register MPC Sample. You can also download the inMusic Software Center from your Account to register your product, as well as access updates and support links. </div>\n<div class=\"p\">For additional product support, visit <a href=\"http://support.akaipro.com\" target=\"_blank\" rel=\"noopener\" target=\"_blank\"><span class=\"New_normal\"><span class=\"de_2B94C39861\"><strong>support.akaipro.com</strong></span></span></a>.</div>\n\n\n<div class=\"p h2\"><h2>About this User Guide</h2></div>\n\n<div class=\"p\">This manual should help you get familiar with using your MPC Sample. We use specific formatting to indicate particular topics of significance:</div>\n\n<div class=\"p Note_Tip\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p Note_Tip de_7A8C25B212\"><span class=\"Note_Tip\"><span class=\"de_1CFD0D5D27\"><strong>Important/Note/Tip:</strong> Important or helpful information on a given topic.</span></span></div>\n</td></tr></table></div>\n\n<div class=\"p\">Names of buttons, controls, parameters, settings, and other options are written in bold characters throughout the manual.</div>\n<div class=\"p\">Examples: </div>\n<div class=\"p de_36C866FB79\">To open the Flex Beat page, press and hold <strong>SHIFT </strong>and press the <strong>PAD FX / FLEX BEAT</strong> button.</div>\n<div class=\"p de_36C866FB79\">Press the <strong>B3</strong> Function Button to Bypass Knob FX on all affected pads.</div>\n\n<div class=\"p\">Some parts of this manual refer to other relevant chapters or sections, which are cited in <span class=\"Document_Link\"><strong>bold, italic blue</strong></span> characters. Click the text to skip immediately to that section.</div>\n<div class=\"p\">Examples:</div>\n<div class=\"p de_36C866FB79\">See the <a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"pad_play.htm\"><span class=\"Document_Link\"><span class=\"de_2B94C39861\"><strong>Pad Play</strong></span></span></a> section for more information on Chop Mode controls.</div>\n<div class=\"p de_36C866FB79\">While in <a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"step_edit.htm\"><span class=\"Document_Link\"><span class=\"de_2B94C39861\"><strong>Step Edit</strong></span></span><span class=\"de_2B94C39861\"> </span></a>mode, you can also use the fader to adjust event timing. </div>\n\n<div class=\"p\">You can also click on certain images to jump to specific sections of the manual.</div>\n\n</div>", "setup": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Setup</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">This chapter describes how to initially set up your MPC Sample and connect it with other equipment. We recommend reviewing this chapter before continuing to the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"tutorial.htm\"><span class=\"de_B84CA4D200\"><strong>Tutorial</strong></span></a><span class=\"de_CC7DAF531E\"> chapter to get started making beats with MPC Sample. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">For a more detailed overview of MPC Sample’s controls and connections, proceed to the following </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"features.htm\"><span class=\"de_B84CA4D200\"><strong>Features</strong></span></a><span class=\"de_CC7DAF531E\"> chapter.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">For additional information on MPC Sample’s functions, proceed to the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"operation.htm\"><span class=\"de_B84CA4D200\"><strong>Operation</strong></span></a><span class=\"de_97985A090F\"><strong> </strong></span><span class=\"de_CC7DAF531E\">chapter. </span></div>\n\n\n</div>", "firmware_updates": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Firmware Updates</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">Before you use MPC Sample for the first time, we recommend checking for available firmware updates. These updates add exciting new features and improvements, so staying up-to-date ensures the best experience with MPC Sample. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">To check for available firmware updates and apply them to your MPC Sample:</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">1. &#160; &#160; Connect MPC Sample to an available USB port on a computer using the included USB-C cable.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">2. &#160; &#160; Power on MPC Sample. </span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">3. &#160; &#160; Open a web browser, and navigate to </span><a href=\"http://mpc-sample.local\" target=\"_blank\" rel=\"noopener\" target=\"_blank\"><span class=\"de_A6784F7BA8\"><strong>mpc-sample.local</strong></span></a><span class=\"de_CC7DAF531E\">. </span></div>\n<div class=\"p Note_Tip de_026A006CB7\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p Note_Tip de_026A006CB7\"><span class=\"Note_Tip\"><span class=\"de_2A01A3395F\"><strong>Tip: </strong>If you are having trouble connecting, try restarting MPC Sample while connected via USB. If this still does not work, try entering </span></span><span class=\"New_normal\"><span class=\"de_2A01A3395F\"><strong>192.168.155.1</strong></span></span><span class=\"Note_Tip\"><span class=\"de_2A01A3395F\"> into your web browser instead. </span></span></div>\n<div class=\"p Note_Tip de_60576EC445\"><span class=\"Note_Tip\"><span class=\"de_2A01A3395F\">For Windows 10 users, make sure you have installed the Windows 10 driver prior to connecting.</span></span></div>\n</td></tr></table></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">4. &#160; &#160; Once the web page is loaded and a connection is established, your current firmware version is automatically scanned. If there is a firmware update available, follow the instructions on screen to apply it to your device. </span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">5. &#160; &#160; You can also click <strong>Manual Firmware Upload</strong> if you have a firmware update file that you would like to load to your device.</span></div>\n\n<div class=\"p de_026A006CB7\"><table class=\"de-text-block de-text-block-custom-6488f07e-4719-432c-aa40-f80bfbe5fe06\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf06a;</span></td><td class=\"de-tb-text\"><div class=\"p de_6AF6DD6F29\"><span class=\"de_C4517954D8\"><strong>IMPORTANT: </strong>Windows 10 users should download the MPC Sample Firmware Update application from the MPC Sample Downloads page at </span><a href=\"http://akaipro.com/mpc-sample\" target=\"_blank\" rel=\"noopener\"><span class=\"de_A6784F7BA8\"><strong>akaipro.com/mpc-sample</strong></span></a><span class=\"de_B0B5DD9A7A\"> </span><span class=\"de_C4517954D8\">instead of using the web-based updater.</span></div>\n</td></tr></table></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">If you have downloaded the inMusic Software Center, you can also use this to check for updates and apply them to your MPC Sample.</span></div>\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">In addition to checking before you use MPC Sample the first time, we recommend periodically checking for firmware updates. You can also visit </span><a href=\"http://akaipro.com\" target=\"_blank\" rel=\"noopener\" target=\"_blank\"><span class=\"New_normal\"><span class=\"de_84040A150E\"><strong>akaipro.com</strong></span></span></a><span class=\"de_68B99ACC5C\"> </span><span class=\"de_CC7DAF531E\">for the latest product news.</span></div>\n\n</div>", "connection_diagram": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Connection Diagram</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Pictured below is an example of how to set up MPC Sample with other equipment. Note that items not listed under the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"introduction.htm\"><span class=\"de_B84CA4D200\"><strong>Introduction &gt; Box Contents</strong></span></a><span class=\"de_CC7DAF531E\"> are sold separately.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Proceed to the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"features.htm\"><span class=\"de_B84CA4D200\"><strong>Features</strong></span></a><span class=\"de_97985A090F\"><strong> </strong></span><span class=\"de_CC7DAF531E\">chapter for more information on these connections. </span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_connection_diagram_custom.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_connection_diagram_custom.png\" data-full-width=\"1060\" data-full-height=\"644\" /> </span></div>\n\n\n</div>", "tutorial": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Tutorial</h1></div></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">This tutorial walks you through the basics of making beats with MPC Sample. We recommend following the steps in this chapter in order.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">There are links throughout this section to later chapters of the manual if you would like to learn more about specific functions. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">You can also watch tutorials by visiting the Akai Professional YouTube channel at </span><a href=\"http://youtube.com/AkaiProVideo\" target=\"_blank\" rel=\"noopener\" target=\"_blank\"><span class=\"de_A6784F7BA8\"><strong>youtube.com/AkaiProVideo</strong></span></a><span class=\"de_CC7DAF531E\">.</span></div>\n\n<div class=\"p de_6AF6DD6F29\"><hr style=\"width: 100%; height: 1px; text-align: left; margin-left: 0; margin-right: auto; border:none; background-color:#000000; color: #000000; clear:none;\" /></div>\n\n<div class=\"p h3\"><h3><span class=\"de_8B49FE8C88\">Playing Sounds</span></h3></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">As soon as you turn on MPC Sample, a sample demo project loads automatically so you can get started immediately.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-0;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>POWER</strong> button to turn MPC Sample on.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Turn up the <strong>MAIN VOLUME</strong> knob. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_2.png\"/></span></div>\n<div class=\"p de_35730C9A7E\"><span class=\"de_CC7DAF531E\">This will adjust the audio level coming from the built-in speaker, or from the <strong>PHONES</strong> or <strong>AUDIO OUT</strong> if you have audio output devices connected to them.</span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>PLAY</strong> button to hear a sequence using the startup project. As the sequence plays, the pads light up as each sound is triggered. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_3.png\"/> &#160; &#160; </span><span class=\"de_CC7DAF531E\"> <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_4.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_4.png\" data-full-width=\"328\" data-full-height=\"248\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-0\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>STOP</strong> button to stop playback. If you want to stop all sounds at once, quickly double-press the <strong>STOP</strong> button.</span></div>\n</li></ul><div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_5.png\"/></span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">After you stop the sequence, try tapping on the pads. Each time you hit a pad, the sample triggers, and the sample waveform is shown on the MPC Sample display. This is known as </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sample_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sample Mode</strong></span></a><span class=\"de_CC7DAF531E\">, which can be accessed any time by pressing the <strong>SAMPLE</strong> button.</span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_6.png\"/></span></div>\n\n<div class=\"p de_6AF6DD6F29\"><hr style=\"width: 100%; height: 1px; text-align: left; margin-left: 0; margin-right: auto; border:none; background-color:#000000; color: #000000; clear:none;\" /></div>\n\n<div class=\"p h3\"><h3><span class=\"de_8B49FE8C88\">Exploring Samples</span></h3></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">MPC Sample includes hundreds of different samples, from individual drum and instrument hits to full drum breaks and melodic phrases. </span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-1;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Tap a pad, and then press the <strong>SAMPLE SELECT</strong> button. For example, try tapping <strong>PAD 2</strong> and then press <strong>SAMPLE SELECT</strong>.</span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_7.png\"/> + </span><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_8.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> to browse the list of sample content folders. Try turning the <strong>ENCODER</strong> so that the <strong>Snares </strong>folder is highlighted.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_9.png\"/>&#160; &#160; &#160; &#160; &#160; </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_10.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_10.png\" data-full-width=\"329\" data-full-height=\"246\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>ENCODER</strong> to open the folder, and then turn it to browse the list of samples. As each sample is highlighted, the sample is previewed from the built-in speaker or a connected audio output. </span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Select a new sample, and then press the <strong>ENCODER</strong> to load the highlighted sample to the pad. </span></div>\n<div class=\"p de_1A059E9B91\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_11.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_11.png\" data-full-width=\"330\" data-full-height=\"247\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>SAMPLE SELECT</strong> button again to return to Sample Mode. </span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_8.png\"/>&#160; &#160; &#160; &#160; &#160; </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_12.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_12.png\" data-full-width=\"328\" data-full-height=\"246\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-1\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Try playing the sequence back again to hear the difference in sound with the new sample. </span></div>\n</li></ul>\n<div class=\"p de_6AF6DD6F29\"><hr style=\"width: 100%; height: 1px; text-align: left; margin-left: 0; margin-right: auto; border:none; background-color:#000000; color: #000000; clear:none;\" /></div>\n\n<div class=\"p h3\"><h3><span class=\"de_8B49FE8C88\">Playing Sequences</span></h3></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Now that you’ve heard one sequence, you can explore how to use MPC Sample to play multiple sequences together. </span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-2;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>SEQ</strong> button to open </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sequence_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sequence Mode</strong></span></a><span class=\"de_CC7DAF531E\">. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_13.png\"/></span></div>\n<div class=\"p de_1A059E9B91\"><span class=\"de_CC7DAF531E\">In this mode, the pads are used to select and trigger different sequences. </span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">With <strong>PAD 1</strong> still selected, press the <strong>PLAY</strong> button again to begin sequence playback. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_3.png\"/>&#160; &#160; &#160; &#160; &#160; </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_14.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_14.png\" data-full-width=\"331\" data-full-height=\"249\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">While Sequence 1 is still playing, tap <strong>PAD 2</strong>. This queues Sequence 2 to start playing as soon as Sequence 1 ends, and PAD 2 will start blinking. Continue listening until you hear the sequence change. PAD 2 also lights up once that sequence begins playing.</span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_7.png\"/>&#160; &#160; &#160; &#160; &#160; <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_15.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_15.png\" data-full-width=\"330\" data-full-height=\"247\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Try triggering other sequences in different orders as MPC Sample continues playing to hear how you can create longer songs with different parts. </span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-2\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When you are finished, press the <strong>STOP</strong> button to stop playback. </span></div>\n</li></ul><div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_5.png\"/></span></div>\n\n<div class=\"p de_026A006CB7\"><hr style=\"width: 100%; height: 1px; text-align: left; margin-left: 0; margin-right: auto; border:none; background-color:#000000; color: #000000; clear:none;\" /></div>\n\n<div class=\"p h3\"><h3><span class=\"de_8B49FE8C88\">Recording a Sequence</span></h3></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">While in Sequence Mode, you can also try recording your own new sequence using the current sounds.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Tap a dimly lit pad to select an empty sequence. For example, tap <strong>PAD 9</strong> in the demo startup project.</span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_16.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press and hold the <strong>B1</strong> Function Button (the left-most button above the display) to open the Sequence BPM window. </span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_17.png\"/></span></div>\n<div class=\"p de_35730C9A7E\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> to adjust the tempo to the desired BPM. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_9.png\"/>&#160; &#160; &#160; &#160; &#160; </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_18.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_18.png\" data-full-width=\"330\" data-full-height=\"247\" /></span></div>\n<div class=\"p de_35730C9A7E\"><span class=\"de_CC7DAF531E\">You can also press the <strong>TAP TEMPO</strong> button at a regular interval to set a new tempo.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_19.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>B3</strong> Function Button (the right-most button above the display) to turn Record Quantization on or off. When on, the notes you play while recording are snapped to the grid at the current <strong>Q</strong> value. </span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_20.png\"/></span></div>\n<div class=\"p de_636669D020\"><span class=\"de_CC7DAF531E\">You can adjust the <strong>Q</strong> value by turning the <strong>K2</strong> Knob. </span></div>\n<div class=\"p de_F2D5A26E1B\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_21.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1</strong> Knob to adjust the sequence length, in bars. </span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_22.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When you are ready to record, press the <strong>SEQ RECORD</strong> button, and the pads will return to sample triggering mode.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_23.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>PLAY</strong> button to begin recording, and tap the pads to add recorded events.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_3.png\"/> &#160; &#160; </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_24.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_24.png\" data-full-width=\"328\" data-full-height=\"248\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When the end of the Sequence is reached, MPC Sample continues overdub recording and any samples triggered will play back at their recorded locations. </span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When you are finished, press the <strong>SEQ RECORD</strong> button again to stop recording but continue playback. You can also press the <strong>STOP</strong> button to stop recording and playback at the same time. The pads will return to sequence triggering mode. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_23.png\"/> / <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_5.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-3\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Try launching your new sequence, and then try launching other sequences in the project. </span></div>\n</li></ul>\n<div class=\"p de_6AF6DD6F29\"><hr style=\"width: 100%; height: 1px; text-align: left; margin-left: 0; margin-right: auto; border:none; background-color:#000000; color: #000000; clear:none;\" /></div>\n\n<div class=\"p h3\"><h3><span class=\"de_8B49FE8C88\">Starting a New Project</span></h3></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">When you’re ready to move on from the included startup project, you can start a new project.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-4\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-4;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press and hold the <strong>SHIFT</strong> button and press <strong>PAD 16 – PROJECT</strong>. This will open the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"project.htm\"><span class=\"de_B84CA4D200\"><strong>Project </strong></span></a><span class=\"de_CC7DAF531E\">menu.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_25.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_26.png\"/>&#160; &#160; &#160; &#160; &#160; <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_27.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_27.png\" data-full-width=\"325\" data-full-height=\"248\" /></span></div>\n<div class=\"p de_62047D07EB\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_62047D07EB\"><span class=\"de_C4517954D8\"><strong>Tip:</strong> If you’d like to save your work so far, turn the <strong>ENCODER</strong> so that <strong>Save Project </strong>is highlighted, and then press it to select. You can use the <strong>ENCODER</strong> and <strong>-/+</strong> buttons to enter a name for your project and save it.</span></div>\n</td></tr></table></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-4\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Turn the <strong>ENCODER</strong> so that <strong>New Project</strong> is highlighted, and then press it to select.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_9.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-4\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">If you have unsaved changes in the current project, you can press the <strong>B3</strong> Function Button to confirm you want to clear everything. If you need to save your project, press the <strong>B1</strong> Function Button to return to the Project menu, and follow the instructions in the <strong>Tip</strong> above to save your project.</span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_28.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_28.png\" data-full-width=\"330\" data-full-height=\"249\" /></span></div>\n</li></ul>\n<div class=\"p de_026A006CB7\"><hr style=\"width: 100%; height: 1px; text-align: left; margin-left: 0; margin-right: auto; border:none; background-color:#000000; color: #000000; clear:none;\" /></div>\n\n<div class=\"p h3\"><h3><span class=\"de_8B49FE8C88\">Recording a Sample</span></h3></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">In addition to the hundreds of included samples, you can sample any kind of audio with MPC Sample to create your own samples. Let’s try using the built-in microphone to capture sound from around you to create a new sample.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-5\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-5;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>SAMPLE RECORD</strong> button to enter </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"sample_record_mode.htm\"><span class=\"de_B84CA4D200\"><strong>Sample Record Mode</strong></span></a><span class=\"de_CC7DAF531E\">.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_29.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-5\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1</strong> Knob to adjust the current input Source. Select <strong>Mic</strong> for the built-in microphone.</span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_22.png\"/>&#160; &#160; &#160; &#160; &#160; </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_30.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_30.png\" data-full-width=\"327\" data-full-height=\"250\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-5\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Tap a pad to begin recording. Try humming, singing, or even tapping on your surroundings to make some noise!</span></div>\n<div class=\"p de_046CCD6C59\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_31.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_31.png\" data-full-width=\"327\" data-full-height=\"249\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-5\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When you are finished recording, tap the <strong>PAD</strong> again to return to the Sample Record page. </span></div>\n</li></ul>\n<div class=\"p de_6AF6DD6F29\"><hr style=\"width: 100%; height: 1px; text-align: left; margin-left: 0; margin-right: auto; border:none; background-color:#000000; color: #000000; clear:none;\" /></div>\n\n<div class=\"p h3\"><h3><span class=\"de_8B49FE8C88\">Editing a Sample</span></h3></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">After recording your own sample, or if you want to change one of the included samples, you can use MPC Sample’s editing features.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-6\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-6;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Make sure you are in Sample Mode by pressing the <strong>SAMPLE</strong> button.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_6.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-6\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Tap a pad to select the sample you want to edit. If you recorded a sample above, tap that pad to select it.</span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-6\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Your recorded sample might have extra audio around the start and end of your recording that you don’t need.</span></div>\n<div class=\"p de_300C4ECC40\"><span class=\"de_CC7DAF531E\">Turn the <strong>K1</strong> Knob to adjust the sample <strong>Start</strong> point. Turn the <strong>K2</strong> Knob to adjust the sample <strong>End</strong> point. Try isolating the best part of your recorded sample.</span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_32.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_32.png\" data-full-width=\"437\" data-full-height=\"173\" />&#160; &#160; &#160; &#160; &#160; <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_33.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_33.png\" data-full-width=\"325\" data-full-height=\"247\" /></span></div>\n<div class=\"p de_0781524CBD\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p de_6AF6DD6F29\"><span class=\"de_C4517954D8\"><strong>Tip:</strong> If you move the knob but the parameter doesn’t change, look for the arrows next to the parameter name. Move the knob in this direction until you regain control of the parameter.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_C4517954D8\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_34.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_34.png\" data-full-width=\"192\" data-full-height=\"25\" /></span></div>\n</td></tr></table></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-6\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">When you tap the pad again, the sample now plays between the sample Start and End points. You can permanently alter the sample to be this length by pressing and holding <strong>SHIFT</strong> and pressing <strong>PAD 13 – TRIM SAMPLE</strong>. This will discard any audio before the Start point and after the End point. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_25.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_35.png\"/>&#160; &#160; &#160; &#160; &#160; <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_36.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_36.png\" data-full-width=\"327\" data-full-height=\"246\" /></span></div>\n</li></ul>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">There are many other ways to edit your sample. </span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-7\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-7;\">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\">Try pressing the <strong>B1</strong>, <strong>B2</strong>, and <strong>B3</strong> Function Buttons to cycle between different options in Sample Mode. Use the <strong>K1</strong>, <strong>K2</strong>, and <strong>K3</strong> Knobs to adjust the various parameters, from pad volume and tuning to filter and amplitude envelopes. </span></div>\n<div class=\"p de_AFF98C8A1B\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_37.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_37.png\" data-full-width=\"347\" data-full-height=\"63\" /></span></div>\n<div class=\"p de_AFF98C8A1B\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_38.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_38.png\" data-full-width=\"694\" data-full-height=\"167\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-7\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\">Try using the buttons in the <strong>PAD PLAY</strong> section to adjust sample playback. For example, press the <strong>LOOP</strong> button to make the sample loop continuously when triggered. </span></div>\n<div class=\"p de_AFF98C8A1B\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_39.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_39.png\" data-full-width=\"264\" data-full-height=\"206\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-7\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_174BC1BFEC\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press <strong>PAD 9 – FADER</strong> to open the Fader control menu. You can select from different parameters that can be adjusted using the Fader. Try selecting Pad Tune. Move the fader as you trigger a pad to hear the pitch of the sample change. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_25.png\"/> + </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_16.png\"/>&#160; &#160; &#160; &#160; &#160; <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_40.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_40.png\" data-full-width=\"328\" data-full-height=\"250\" /></span></div>\n</li></ul>\n<div class=\"p de_026A006CB7\"><hr style=\"width: 100%; height: 1px; text-align: left; margin-left: 0; margin-right: auto; border:none; background-color:#000000; color: #000000; clear:none;\" /></div>\n\n<div class=\"p h3\"><h3><span class=\"de_8B49FE8C88\">Using FX</span></h3></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">As your projects grow, you can take your beats to the next level with MPC Sample’s powerful effects. First, try using the Pad FX mode. In this mode, each pad triggers a different effect, and the level of the effect is determined by how hard you press the pad. </span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-8\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-8;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>PAD FX</strong> button to open Pad FX mode.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_41.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-8\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>PLAY</strong> button to play the current sequence, and then tap and hold on the pads to trigger the respective effects. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_3.png\"/> &#160; &#160; </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_42.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_42.png\" data-full-width=\"327\" data-full-height=\"251\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-8\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Use the <strong>K1–K3</strong> Knobs to adjust different parameters for each effect. </span></div>\n<div class=\"p de_13E5B20873\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_38.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_38.png\" data-full-width=\"694\" data-full-height=\"167\" /></span></div>\n</li></ul>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Next, try using Knob FX mode. In this mode, a single effect is controlled using the <strong>K1–K3</strong> Knobs, freeing the MPC Sample pads for other uses. For example, this is perfect for applying effects as transitions between sequences.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-9\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-9;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>KNOB FX</strong>&#160; button to open Knob FX mode. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_43.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-9\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press <strong>SEQ</strong> to open Sequence mode, and press <strong>PLAY</strong> to play a sequence.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_13.png\"/> &#160; &#160; <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_3.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-9\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Use the <strong>K1–K3</strong> Knobs to adjust the effect while you launch different sequences. </span></div>\n<div class=\"p de_13E5B20873\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_38.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_38.png\" data-full-width=\"694\" data-full-height=\"167\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-9\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">To change the current Knob FX, press and hold <strong>SHIFT</strong> and press the <strong>KNOB FX / FX SELECT</strong> ( <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_44.png\"/> ) button. Use the <strong>ENCODER</strong> to select a different effect.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_25.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_43.png\"/>&#160; &#160; &#160; &#160; &#160; </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_45.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_45.png\" data-full-width=\"327\" data-full-height=\"249\" /></span></div>\n</li></ul><div class=\"p de_2281E960B9\"><span class=\"de_CC7DAF531E\">While in this menu, you can also press the <strong>PADS</strong> to determine which samples are affected by the Knob FX. Lit pads are affected by Knob FX, while dim pads are not affected. Press the <strong>B2</strong> Function Button to apply Knob FX to <strong>All Pads</strong> at once. </span></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">Finally, let’s explore Flex Beat mode. Similar to Pad FX, the pads trigger different effects in this mode, but the effects are time-based effects that warp the pitch, time, and volume of your sequence for beat chops, DJ-style scratches, and trance gate effects.</span></div>\n<ul class=\"de_list\"><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-10\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; counter-reset: list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-10;\">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press and hold <strong>SHIFT</strong> and press the <strong>PAD FX / FLEX BEAT</strong> button to open Flex Beat mode.</span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_25.png\"/> + <img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_41.png\"/></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-10\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press the <strong>PLAY</strong> button to play the current sequence, and then tap the pads to trigger the respective effects. Each Flex Beat effect begins looping once you press the pad, and you will hear your sequence’s audio change. </span></div>\n<div class=\"p de_7F9D13BC1F\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_3.png\"/> &#160; &#160; </span><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_46.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_46.png\" data-full-width=\"329\" data-full-height=\"248\" /></span></div>\n</li><li class=\"list-element list-counter-25d209cf-f79a-42ea-8a4d-6d15cb3f2410-10\" style=\"color:#000000;font-size:10pt;font-family:&quot;Arial&quot;; direction: ltr; \">\n<div class=\"p de_5409D64126\"><span class=\"de_CC7DAF531E\">Press <strong>PAD 1</strong> to return to the “Empty” effect. </span></div>\n<div class=\"p de_143F6E7EF6\"><span class=\"de_CC7DAF531E\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_tutorial_custom_47.png\"/></span></div>\n</li></ul>\n<div class=\"p de_6AF6DD6F29\"><hr style=\"width: 100%; height: 1px; text-align: left; margin-left: 0; margin-right: auto; border:none; background-color:#000000; color: #000000; clear:none;\" /></div>\n\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">In addition to the many features and functions covered in this Tutorial, there’s so much more you can do to make beats with MPC Sample. </span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">The following </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"features.htm\"><span class=\"de_B84CA4D200\"><strong>Features</strong></span></a><span class=\"de_CC7DAF531E\"> chapter gives you a breakdown of every connection and control on MPC Sample and its function.</span></div>\n<div class=\"p de_6AF6DD6F29\"><span class=\"de_CC7DAF531E\">The </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"operation.htm\"><span class=\"de_B84CA4D200\"><strong>Operation</strong></span></a><span class=\"de_CC7DAF531E\"> chapter provides greater detail on the different modes and functions of MPC Sample. </span></div>\n</div>", "features": "<div class=\"description_on_page\"><div class=\"p h1\"><div class=\"ic\"><h1>Features</h1></div></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">This chapter describes the functions of MPC Sample’s connections and controls. Click on the picture to jump directly to the selected control.</span></div>\n\n<div class=\"p de_026A006CB7\"><span class=\"de_CC7DAF531E\">For more information on using some of the features described below, proceed to the following </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"operation.htm\"><span class=\"de_B84CA4D200\"><strong>Operation</strong></span></a><span class=\"de_97985A090F\"><strong> </strong></span><span class=\"de_CC7DAF531E\">chapter. </span></div>\n\n\n<div class=\"p\"><span class=\"de_68B99ACC5C\">\n<a class=\"anchor\" id=\"wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"></a>\n<map name=\"controlmap_3c1b9a3d_0dee_43ac_af9b_7049e06a8205_f7e252c0_471a_480b_9265_66a7ebb5d621\" id=\"controlmap_3c1b9a3d_0dee_43ac_af9b_7049e06a8205_f7e252c0_471a_480b_9265_66a7ebb5d621\">\n<area shape=\"rect\" alt=\"\" href=\"#id_f7e252c0-471a-480b-9265-66a7ebb5d621_1\" coords=\"1039,307,1075,343\" data-coord-left=\"1039\" data-coord-top=\"307\" data-coord-right=\"1075\" data-coord-bottom=\"343\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_f7e252c0-471a-480b-9265-66a7ebb5d621_2\" coords=\"899,307,935,343\" data-coord-left=\"899\" data-coord-top=\"307\" data-coord-right=\"935\" data-coord-bottom=\"343\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_f7e252c0-471a-480b-9265-66a7ebb5d621_3\" coords=\"760,307,796,343\" data-coord-left=\"760\" data-coord-top=\"307\" data-coord-right=\"796\" data-coord-bottom=\"343\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_f7e252c0-471a-480b-9265-66a7ebb5d621_4\" coords=\"617,306,653,342\" data-coord-left=\"617\" data-coord-top=\"306\" data-coord-right=\"653\" data-coord-bottom=\"342\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_f7e252c0-471a-480b-9265-66a7ebb5d621_5\" coords=\"414,307,450,343\" data-coord-left=\"414\" data-coord-top=\"307\" data-coord-right=\"450\" data-coord-bottom=\"343\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_f7e252c0-471a-480b-9265-66a7ebb5d621_6\" coords=\"255,307,291,343\" data-coord-left=\"255\" data-coord-top=\"307\" data-coord-right=\"291\" data-coord-bottom=\"343\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_f7e252c0-471a-480b-9265-66a7ebb5d621_7\" coords=\"132,307,168,343\" data-coord-left=\"132\" data-coord-top=\"307\" data-coord-right=\"168\" data-coord-bottom=\"343\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_f7e252c0-471a-480b-9265-66a7ebb5d621_8\" coords=\"29,307,65,343\" data-coord-left=\"29\" data-coord-top=\"307\" data-coord-right=\"65\" data-coord-bottom=\"343\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_f7e252c0-471a-480b-9265-66a7ebb5d621_9\" coords=\"1145,229,1181,265\" data-coord-left=\"1145\" data-coord-top=\"229\" data-coord-right=\"1181\" data-coord-bottom=\"265\"  />\n</map><img usemap=\"#controlmap_3c1b9a3d_0dee_43ac_af9b_7049e06a8205_f7e252c0_471a_480b_9265_66a7ebb5d621\"  alt=\"Features\" class=\"de_wndimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_screen.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_screen.png\" data-full-width=\"1333\" data-full-height=\"382\" /></span></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_f7e252c0-471a-480b-9265-66a7ebb5d621_1\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"><img  alt=\"1\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_1.png\"/></a></span><div class=\"ic\"><h3>POWER</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"1. POWER\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_1.png\"/></span></div>\n<div class=\"p de_D8C83D7059\"><span class=\"de_68B99ACC5C\">Press this button to turn MPC Sample’s power on and off. </span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_f7e252c0-471a-480b-9265-66a7ebb5d621_2\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"><img  alt=\"2\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_2.png\"/></a></span><div class=\"ic\"><h3>USB</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"2. USB\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_2.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">To power MPC Sample and charge the internal battery, use the included USB-C cable to connect this port to a USB-C power adapter or USB-C power bank (not included). When charging, the <strong>Charging Icon</strong> on the top panel lights up. </span></div>\n<div class=\"p de_22F4A2F3E0\"><span class=\"de_CC7DAF531E\">You can also connect this to a USB-C host port on your computer (or mobile device) to send and receive audio and MIDI, and transfer files to and from a microSD card inserted into the <strong>microSD Card Slot</strong>.</span></div>\n<div class=\"p Note_Tip de_D8C83D7059\"><table class=\"de-text-block de-text-block-custom-6488f07e-4719-432c-aa40-f80bfbe5fe06\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf06a;</span></td><td class=\"de-tb-text\"><div class=\"p Note_Tip de_F9165B2CF3\"><span class=\"Note_Tip\"><span class=\"de_8C248F13E3\"><strong>Important:</strong> Depending on the type of USB cable and power source used, charging of MPC Sample may be limited to when it is powered off only. For best results, use the included USB-C cable with a minimum 5V, 2A power source. </span></span></div>\n</td></tr></table></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_f7e252c0-471a-480b-9265-66a7ebb5d621_3\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"><img  alt=\"3\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_3.png\"/></a></span><div class=\"ic\"><h3>REC GAIN</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"3. REC GAIN\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_3.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Turn this knob to adjust the recording level of the line-level <strong>AUDIO IN</strong> connections.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_f7e252c0-471a-480b-9265-66a7ebb5d621_4\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"><img  alt=\"4\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_4.png\"/></a></span><div class=\"ic\"><h3>AUDIO IN</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"4. AUDIO IN\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_4.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_4.png\" data-full-width=\"164\" data-full-height=\"120\" /></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Use these</span><span class=\"de_68B99ACC5C\"> 1/4” (6.35 mm) TRS </span><span class=\"de_CC7DAF531E\">inputs to connect a microphone, instrument, or other line-level audio source (mixer, synthesizer, drum machine, etc.). </span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_f7e252c0-471a-480b-9265-66a7ebb5d621_5\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"><img  alt=\"5\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_5.png\"/></a></span><div class=\"ic\"><h3>AUDIO OUT</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"5. AUDIO OUT\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_5.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_5.png\" data-full-width=\"163\" data-full-height=\"120\" /></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">Use these 1/4” (6.35 mm) TRS outputs to connect to your speakers, a mixer, or other audio output destination. Use the <strong>MAIN VOLUME</strong> control to adjust the level of the audio output.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_f7e252c0-471a-480b-9265-66a7ebb5d621_6\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"><img  alt=\"6\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_6.png\"/></a></span><div class=\"ic\"><h3>MIDI IN / OUT</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"6. MIDI IN / OUT\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_6.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Connect external MIDI devices such as drum machines or synthesizers to the MIDI Input and Output using 1/8” TRS (Type A) to 5-Pin MIDI DIN connectors (not included).</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_f7e252c0-471a-480b-9265-66a7ebb5d621_7\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"><img  alt=\"7\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_7.png\"/></a></span><div class=\"ic\"><h3>SYNC OUT</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"7. SYNC OUT\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_7.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Use this 5V control voltage (CV) output (1/8&quot; [3.5 mm], TS) to send clock pulse for syncing external modular gear.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p Note_Tip\"><table class=\"de-text-block de-text-block-custom-c29bc8c7-16be-4928-ad1f-4368eeeb83df\"><tr><td class=\"de-tb-icon\"><span class=\"de-text-block-icon\">&#xf05a;</span></td><td class=\"de-tb-text\"><div class=\"p Note_Tip de_7A8C25B212\"><span class=\"Note_Tip\"><span class=\"de_8C248F13E3\"><strong>Note: </strong>You can adjust MIDI and Sync settings in the </span></span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"midi_configuration.htm\"><span class=\"Note_Tip\"><span class=\"de_0E7C9ECD5E\"><strong>MIDI Configuration</strong></span></span></a><span class=\"Note_Tip\"><span class=\"de_8C248F13E3\"> menu.</span></span></div>\n</td></tr></table></div>\n\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_f7e252c0-471a-480b-9265-66a7ebb5d621_8\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"><img  alt=\"8\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_8.png\"/></a></span><div class=\"ic\"><h3>PHONES</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"8. PHONES\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_8.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Connect standard headphones here to monitor MPC Sample’s audio. Use the <strong>MAIN VOLUME</strong> control to adjust the level of the headphones output. When headphones are connected, the built-in <strong>Speaker</strong> will be deactivated. </span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_f7e252c0-471a-480b-9265-66a7ebb5d621_9\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_f7e252c0-471a-480b-9265-66a7ebb5d621\"><img  alt=\"9\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_9.png\"/></a></span><div class=\"ic\"><h3>microSD Card Slot</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"9. microSD Card Slot\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_9.png\"/></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">Insert a microSD card here (left side of device) for external file storage. You can access this storage using SD Card Access Mode in the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"project.htm\"><span class=\"de_B84CA4D200\"><strong>Project</strong></span></a><span class=\"de_CC7DAF531E\"> menu.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; fo 714,975,750\" data-coord-left=\"939\" data-coord-top=\"714\" data-coord-right=\"975\" data-coord-bottom=\"750\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_0fa02357-9e84-4a0b-b2e4-3656991697ef_30\" coords=\"939,766,975,802\" data-coord-left=\"939\" data-coord-top=\"766\" data-coord-right=\"975\" data-coord-bottom=\"802\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_0fa02357-9e84-4a0b-b2e4-3656991697ef_31\" coords=\"939,837,975,873\" data-coord-left=\"939\" data-coord-top=\"837\" data-coord-right=\"975\" data-coord-bottom=\"873\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_0fa02357-9e84-4a0b-b2e4-3656991697ef_10\" coords=\"938,628,974,664\" data-coord-left=\"938\" data-coord-top=\"628\" data-coord-right=\"974\" data-coord-bottom=\"664\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_0fa02357-9e84-4a0b-b2e4-3656991697ef_13\" coords=\"130,621,166,657\" data-coord-left=\"130\" data-coord-top=\"621\" data-coord-right=\"166\" data-coord-bottom=\"657\"  />\n<area shape=\"rect\" alt=\"\" href=\"#id_0fa02357-9e84-4a0b-b2e4-3656991697ef_25\" coords=\"938,386,974,422\" data-coord-left=\"938\" data-coord-top=\"386\" data-coord-right=\"974\" data-coord-bottom=\"422\"  />\n</map><img usemap=\"#controlmap_3c1b9a3d_0dee_43ac_af9b_7049e06a8205_0fa02357_9e84_4a0b_b2e4_3656991697ef\"  alt=\"Features\" class=\"de_wndimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_screen_2.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_screen_2.png\" data-full-width=\"1126\" data-full-height=\"1046\" /></span></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_1\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"1\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_1_2.png\"/></a></span><div class=\"ic\"><h3>Display</h3></div></div>\n<div class=\"p\"><span class=\"de_68B99ACC5C\"><img  alt=\"\" class=\"de_custom_img de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_custom.png\" data-full-src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_custom.png\" data-full-width=\"328\" data-full-height=\"248\" /></span></div>\n<div class=\"p de_0FD9383742\"><span class=\"de_CC7DAF531E\">The display on MPC Sample shows the various menus and parameters available. To learn more about all of MPC Sample’s features and functions, continue reading below and proceed to the </span><a class=\"local_link\" href=\"javascript:void(0)\" data-page=\"operation.htm\"><span class=\"de_B84CA4D200\"><strong>Operation</strong></span></a><span class=\"de_CC7DAF531E\"> chapter for more details.</span></div>\n</td></tr><tr class=\"topLinkRow\"><td><div style=\"text-align: right; font-size:8pt\"><a href=\"#top\">Top</a></div></td></tr></table></div></div>\n<div class=\"p\"><div class=\"de_ctrl\"><table><tr><td><a class=\"anchor\" id=\"id_0fa02357-9e84-4a0b-b2e4-3656991697ef_2\"></a><div class=\"p h3\"><span class=\"de_68B99ACC5C\"><a class=\"anchor\" href=\"#wndid_0fa02357-9e84-4a0b-b2e4-3656991697ef\"><img  alt=\"2\" class=\"de_ctrlbullet de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_bullet_2_2.png\"/></a></span><div class=\"ic\"><h3>Battery Icon</h3></div></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\"><img  alt=\"2. Battery Icon\" class=\"de_ctrlimg de_78924636B9\" src=\"https://www.akaipro.com/guides/mpc-sample/drex_features_control_2_2.png\"/></span></div>\n<div class=\"p de_3308280385\"><span class=\"de_68B99ACC5C\">This icon shows the current battery life of MPC Sample. If this icon is green, the battery has between 100% and 30% charge. If the icon is amber, the battery has between 29% and 15% charge. If the icon is red, the battery has between 14% and 5% charge. If the battery is blinking red, the battery has less than 5% charge and
