<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0f0f0f">
<title>MPC Sample User Guide</title>
<style>
:root {
  --red: #e8002d;
  --red-dark: #b8001f;
  --bg: #111;
  --surface: #1c1c1c;
  --surface2: #272727;
  --surface3: #303030;
  --text: #e4e4e4;
  --text-muted: #888;
  --text-faint: #555;
  --border: #333;
  --sidebar-w: 260px;
  --header-h: 52px;
  --bottom-nav-h: 64px;
  --radius: 8px;
  --transition: 0.25s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─── Header ─────────────────────────────── */
.header {
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  flex-shrink: 0;
  position: relative;
  z-index: 20;
}
.menu-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: var(--text);
  cursor: pointer; border-radius: var(--radius);
  font-size: 20px; flex-shrink: 0;
  transition: background var(--transition);
}
.menu-btn:hover { background: var(--surface3); }
.header-title {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.header-logo {
  width: 28px; height: 28px;
  background: var(--red);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; color: #fff;
  flex-shrink: 0; letter-spacing: -0.5px;
}
.header-text {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: var(--text-muted);
  cursor: pointer; border-radius: var(--radius);
  font-size: 18px; flex-shrink: 0;
  transition: color var(--transition), background var(--transition);
}
.search-btn:hover { color: var(--text); background: var(--surface3); }

/* ─── Body layout ─────────────────────────── */
.body {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* ─── Sidebar overlay (mobile) ────────────── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 30;
}
.overlay.active { display: block; }

/* ─── Sidebar ─────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
  transition: transform var(--transition);
  z-index: 40;
}
.sidebar-inner {
  overflow-y: auto;
  flex: 1;
  padding: 8px 0 16px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.sidebar-inner::-webkit-scrollbar { width: 4px; }
.sidebar-inner::-webkit-scrollbar-track { background: transparent; }
.sidebar-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Nav items */
.nav-section { padding: 8px 0 0; }
.nav-item {
  display: flex;
  align-items: center;
  padding: 9px 16px 9px 16px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 0.875rem;
  font-weight: 500;
  border-radius: 0;
  transition: background var(--transition), color var(--transition);
  line-height: 1.3;
  gap: 8px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--surface3); color: var(--red); font-weight: 600; }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  width: 3px;
  height: 32px;
  background: var(--red);
  border-radius: 0 2px 2px 0;
}
.nav-item { position: relative; }
.nav-caret {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-faint);
  transition: transform var(--transition);
  flex-shrink: 0;
}
.nav-item.open .nav-caret { transform: rotate(90deg); }
.nav-children {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.3s ease;
}
.nav-children.open { max-height: 500px; }
.nav-item.child { padding-left: 32px; font-size: 0.82rem; font-weight: 400; }
.nav-item.grandchild { padding-left: 48px; font-size: 0.8rem; }

/* ─── Content area ────────────────────────── */
.content-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
}
.content-wrap {
  flex: 1;
  padding: 28px 24px 120px;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
}

/* ─── Page content typography ─────────────── */
.page-content h1 {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--red);
  line-height: 1.3;
}
.page-content h2 {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--text);
  margin: 28px 0 12px;
  padding-left: 12px;
  border-left: 3px solid var(--red);
}
.page-content h3 {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text);
  margin: 20px 0 8px;
}
.page-content h4, .page-content h5, .page-content h6 {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-muted);
  margin: 16px 0 6px;
}
.page-content p {
  margin-bottom: 14px;
  color: var(--text);
}
.page-content ul, .page-content ol {
  margin: 8px 0 16px 24px;
  color: var(--text);
}
.page-content li { margin-bottom: 6px; }
.page-content img {
  max-width: 100%;
  height: auto;
  border-radius: var(--radius);
  margin: 12px 0;
  display: block;
}
/* テーブル：モバイルで横スクロール */
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 16px 0;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.page-content table {
  width: 100%;
  min-width: max-content;
  border-collapse: collapse;
  font-size: 0.85rem;
}
.page-content table thead tr {
  background: var(--surface3);
}
.page-content th, .page-content td {
  padding: 9px 14px;
  border: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
}
.page-content td { white-space: normal; min-width: 80px; }
.page-content th { font-weight: 600; color: var(--text); white-space: nowrap; }
.page-content td { color: var(--text-muted); }
/* AKAI固有クラスのスタイル */
.description_on_page { }
.page-content .p { margin-bottom: 8px; line-height: 1.7; }
.page-content .p.h1 { margin: 0 0 20px; }
.page-content span { color: inherit; }
.page-content .ic { display: inline; }
.page-content a {
  color: var(--red);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color var(--transition);
}
.page-content a:hover { border-bottom-color: var(--red); }
.page-content strong, .page-content b { color: var(--text); font-weight: 600; }
.page-content em, .page-content i { color: var(--text-muted); font-style: italic; }
.page-content code {
  background: var(--surface3);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 0.875em;
}
.page-content blockquote {
  border-left: 3px solid var(--red);
  margin: 16px 0;
  padding: 12px 16px;
  background: var(--surface2);
  border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--text-muted);
}
.page-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}

/* ─── Loading ─────────────────────────────── */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  color: var(--text-muted);
  gap: 12px;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Page navigation ─────────────────────── */
.page-nav {
  display: flex;
  gap: 12px;
  padding: 20px 0 8px;
  border-top: 1px solid var(--border);
  margin-top: 32px;
}
.page-nav-btn {
  flex: 1;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  cursor: pointer;
  text-align: center;
  transition: all var(--transition);
  font-size: 0.875rem;
  line-height: 1.3;
  -webkit-tap-highlight-color: transparent;
}
.page-nav-btn:hover:not(:disabled) {
  background: var(--surface2);
  border-color: var(--red);
  color: var(--text);
}
.page-nav-btn:disabled { opacity: 0.3; cursor: default; }
.page-nav-btn .nav-label { font-size: 0.75rem; color: var(--text-faint); margin-bottom: 4px; }
.page-nav-btn .nav-title { font-weight: 500; color: var(--text); }
.page-nav-btn.prev { text-align: left; }
.page-nav-btn.next { text-align: right; }
.page-nav-btn.prev::before { content: '←  '; }
.page-nav-btn.next::after { content: '  →'; }

/* ─── Search overlay ──────────────────────── */
.search-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  z-index: 50;
  align-items: flex-start;
  justify-content: center;
  padding-top: 80px;
}
.search-overlay.active { display: flex; }
.search-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: min(90vw, 560px);
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.search-input-wrap {
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
}
.search-input-wrap span { color: var(--text-muted); font-size: 18px; }
.search-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 1.1rem;
  padding: 16px 12px;
}
.search-input::placeholder { color: var(--text-faint); }
.search-results {
  max-height: 400px;
  overflow-y: auto;
  padding: 8px;
}
.search-result {
  padding: 12px;
  cursor: pointer;
  border-radius: 6px;
  transition: background var(--transition);
}
.search-result:hover { background: var(--surface2); }
.search-result-title { font-weight: 600; color: var(--text); font-size: 0.9rem; }
.search-result-excerpt { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; line-height: 1.5; }
.search-result mark { background: rgba(232,0,45,.25); color: var(--red); border-radius: 2px; }
.search-empty { padding: 24px; text-align: center; color: var(--text-faint); font-size: 0.9rem; }
.search-close-btn {
  padding: 4px 12px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 0.85rem;
  cursor: pointer;
  transition: color var(--transition);
}
.search-close-btn:hover { color: var(--text); }

/* ─── Breadcrumb ──────────────────────────── */
.breadcrumb {
  font-size: 0.78rem;
  color: var(--text-faint);
  margin-bottom: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.breadcrumb span { color: var(--text-faint); }
.breadcrumb a {
  color: var(--text-muted);
  cursor: pointer;
  text-decoration: none;
  transition: color var(--transition);
}
.breadcrumb a:hover { color: var(--red); }

/* ─── Responsive ──────────────────────────── */
@media (max-width: 767px) {
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    transform: translateX(-100%);
    box-shadow: 4px 0 20px rgba(0,0,0,.4);
  }
  .sidebar.open { transform: translateX(0); }
  .content-wrap {
    padding: 20px 16px 100px;
  }
  .page-content h1 { font-size: 1.4rem; }
  .page-content h2 { font-size: 1.1rem; }
  .page-nav {
    flex-direction: column;
    gap: 8px;
  }
  .page-nav-btn { text-align: left !important; }
  .page-nav-btn.next::after { display: none; }
  .page-nav-btn.prev::before { display: none; }
  .page-nav-btn.prev::after { content: none; }
}
@media (min-width: 768px) {
  .menu-btn { display: none; }
  .overlay { display: none !important; }
}

/* ─── 逆引き (Use Case) Overlay ───────────── */
.uc-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: var(--text-muted);
  cursor: pointer; border-radius: var(--radius);
  font-size: 18px; flex-shrink: 0;
  transition: color var(--transition), background var(--transition);
}
.uc-btn:hover { color: var(--red); background: var(--surface3); }
.uc-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.82);
  z-index: 50;
  overflow-y: auto;
  padding: 48px 16px 32px;
  -webkit-overflow-scrolling: touch;
}
.uc-overlay.active { display: block; }
.uc-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: min(100%, 680px);
  margin: 0 auto;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.6);
}
.uc-head {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  position: sticky;
  top: -48px;
  z-index: 2;
}
.uc-head-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.uc-head-icon { font-size: 20px; }
.uc-head-title {
  flex: 1;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
}
.uc-close {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: var(--surface3);
  color: var(--text-muted); border-radius: 6px; cursor: pointer;
  font-size: 14px; flex-shrink: 0;
  transition: all var(--transition);
}
.uc-close:hover { background: var(--red); color: #fff; }
.uc-search {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.95rem;
  padding: 10px 14px;
  outline: none;
  font-family: inherit;
}
.uc-search::placeholder { color: var(--text-faint); }
.uc-search:focus { border-color: var(--red); }
.uc-body { padding: 12px 12px 20px; }
.uc-category { margin-bottom: 20px; }
.uc-cat-title {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-faint);
  margin-bottom: 6px;
  padding: 0 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.uc-items { display: flex; flex-direction: column; gap: 2px; }
.uc-item { border-radius: 8px; overflow: hidden; }
.uc-item-hd {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  gap: 10px;
  font-size: 0.88rem;
  color: var(--text);
  cursor: pointer;
  transition: background var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.uc-item-hd:hover { background: var(--surface2); }
.uc-item.open .uc-item-hd { background: var(--surface2); }
.uc-item-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
  opacity: 0.7;
}
.uc-item-label { flex: 1; line-height: 1.4; }
.uc-item-arrow {
  font-size: 9px;
  color: var(--text-faint);
  transition: transform var(--transition);
  flex-shrink: 0;
}
.uc-item.open .uc-item-arrow { transform: rotate(90deg); }
.uc-pages {
  display: none;
  flex-direction: column;
  gap: 3px;
  padding: 4px 12px 8px 30px;
}
.uc-item.open .uc-pages { display: flex; }
.uc-page-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface3);
  border-radius: 6px;
  font-size: 0.82rem;
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--transition);
  border: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.uc-page-btn::before { content: '→'; color: var(--red); font-size: 11px; flex-shrink: 0; }
.uc-page-btn:hover { background: var(--red); color: #fff; }
.uc-page-btn:hover::before { color: #fff; }
.uc-empty {
  padding: 40px 16px;
  text-align: center;
  color: var(--text-faint);
  font-size: 0.9rem;
  line-height: 1.8;
}
.uc-hint {
  padding: 10px 12px;
  background: rgba(232,0,45,.07);
  border: 1px solid rgba(232,0,45,.15);
  border-radius: var(--radius);
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 16px;
  line-height: 1.5;
}

/* ─── Language switcher ───────────────────── */
.lang-switcher {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  background: var(--surface3);
  border-radius: 8px;
  flex-shrink: 0;
}
.lang-btn {
  padding: 5px 10px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  transition: all var(--transition);
  font-family: inherit;
  line-height: 1;
}
.lang-btn.active { background: var(--red); color: #fff; }
.lang-btn:hover:not(.active) { background: var(--surface2); color: var(--text); }

/* ─── Onboarding tip ──────────────────────── */
.onboarding-tip {
  background: linear-gradient(135deg, rgba(232,0,45,.08), rgba(232,0,45,.03));
  border: 1px solid rgba(232,0,45,.2);
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 28px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.tip-icon { font-size: 2rem; flex-shrink: 0; line-height: 1; margin-top: 2px; }
.tip-body h3 {
  font-size: 1rem; font-weight: 700; color: var(--text);
  margin: 0 0 6px; border: none; padding: 0;
}
.tip-body p {
  font-size: 0.85rem; color: var(--text-muted);
  margin: 0 0 12px; line-height: 1.6;
}
.tip-cta {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--red); color: #fff;
  border: none; border-radius: var(--radius);
  font-size: 0.83rem; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: opacity var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.tip-cta:hover { opacity: 0.85; }

/* ─── Callout boxes (Tips / Notes / Important) ── */
.callout-box {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin: 14px 0;
  padding: 12px 16px;
  border-radius: 8px;
  background: rgba(59, 130, 200, 0.07);
  border: 1px solid rgba(59, 130, 200, 0.25);
  border-left: 4px solid #3b82c8;
}
.callout-box.callout-important {
  background: rgba(232, 130, 0, 0.08);
  border: 1px solid rgba(232, 130, 0, 0.3);
  border-left: 4px solid #e88000;
}
.callout-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; line-height: 1.7; }
.callout-text { font-size: 0.875rem; line-height: 1.65; color: var(--text); flex: 1; }
.callout-text p, .callout-text div { margin: 0; }
/* ─── Japanese images (英語版から注入) ── */
.en-imgs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; }
.en-imgs figure { margin: 0; }
.en-imgs img { max-width: 100%; border-radius: 6px; display: block; }
/* ─── Tips & Notes page ── */
.tips-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.tips-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; border-radius: 8px;
  background: rgba(59,130,200,0.07); border: 1px solid rgba(59,130,200,0.25);
  border-left: 4px solid #3b82c8;
}
.tips-item.tips-important {
  background: rgba(232,130,0,0.08); border-color: rgba(232,130,0,0.3);
  border-left-color: #e88000;
}
